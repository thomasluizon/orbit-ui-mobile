[package]
name = "orbit-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
cc = "=1.10.0"
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
base64 = "=0.23.1"
getrandom = "=0.4.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
sys-locale = "=0.3.2"
tempfile = "=3.27.0"
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-deep-link = "=2.6.2"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-notification = "=2.7.0"
tauri-plugin-single-instance = { version = "=2.5.4", features = ["deep-link"] }
tauri-plugin-updater = "=2.14.0"
tauri-plugin-window-state = "=2.5.0"
uuid = { version = "=1.29.0", features = ["v4", "serde"] }

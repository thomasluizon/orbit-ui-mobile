[package]
name = "orbit-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
base64 = "=0.23.1"
getrandom = "=0.4.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-deep-link = "=2.6.2"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = { version = "=2.5.4", features = ["deep-link"] }

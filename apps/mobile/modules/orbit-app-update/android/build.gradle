plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'org.useorbit.app.update'
version = '1.0.0'

android {
  namespace "org.useorbit.app.update"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation 'com.google.android.play:app-update:2.1.0'
}

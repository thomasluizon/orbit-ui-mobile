- description: Brain dump mixed in en
  metadata: { id: brain-dump-mixed-en, category: composition, family: brain-dump-mixed, locale: en, platform: web, fixture: pro }
  vars:
    credentialKey: ORBIT_EVAL_TOKEN
    clientContext: { platform: web, locale: en, timeFormat: 24h, supportsParts: true, supportsPendingOperationChanges: true }
    input: "My head is all over the place. Need to call the dentist tomorrow, and I want to stretch every morning at eight starting today. Can you organize this?"
    composition: { mode: preview }
    brainDump:
      items:
        - { titleContains: dentist, habitType: Task, frequency_unit: OneTime, due_date: '{tomorrowDate}' }
        - { titleContains: stretch, habitType: Habit, frequency_unit: Day, frequency_quantity: 1, due_date: '{accountDate}', due_time: '08:00' }
    expectations:
      required:
        - { name: bulk_create_habits, resultStatus: PendingConfirmation }
      counts: { bulk_create_habits: 1 }
      allowed: [query_habits, bulk_create_habits]
    rubric: >-
      Respond in English. Organize the messy message into one held preview containing
      the dentist task tomorrow and daily stretching at eight in the morning starting today.
      Preservation of existing account habits is harness evidence, not part of the answer being graded.
      Do not add unrequested activities or grouping habits.
      At most one short sentence without figures may accompany the preview. Reject prose that repeats counts,
      schedules, dates, times or other facts from the preview, including spelled-out figures.
      Distinguish the held proposal from a saved change. The later approval readback is harness evidence,
      not part of the answer being graded. Stored titles stay verbatim.


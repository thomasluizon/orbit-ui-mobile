- description: streaks in en
  metadata:
    id: composition-streaks-en
    category: composition
    family: streaks
    locale: en
    fixture: composition-streaks
  vars:
    credentialKey: ORBIT_EVAL_TOKEN
    input: Show my current streak, no achievement catalogue.
    clientContext: *a4
    composition: &a10
      mode: data
      kinds:
        - streak
    expectations:
      required: &a11
        - name: get_gamification_overview
          arguments:
            include_streak: true
            include_achievements: false
      allowed:
        - query_habits
        - get_gamification_overview
    rubric: Answer in English. Streak eligibility begins on each habit's creation date.
      Days before a habit existed are not eligible and must be neutral, never missed or unlogged.
      Grade only model-written prose about the streak when judging day eligibility.
      Do not grade the client-drawn day strip, including its pre-creation statuses, as model output.
      The fixture logs only eligible recent days. Model-described timeline active days belong to the
      current streak ending at lastActiveDate; earlier days are outside that streak.
      Use the completion date, never the log creation timestamp. Use only the requested scope and current fixture
      facts. Preserve typed empty, partial, stale and failure states honestly.
      Canonical dates inside typed fields are transport values; visible prose
      must use locale dates. Rendered date formatting is checked separately.

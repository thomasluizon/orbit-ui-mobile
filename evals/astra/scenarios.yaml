# The sameTitleSet policy grades the held preview and the persisted result after approval. #2129 adds its further cases here.

- description: Delete two and rename the other four in one request
  metadata:
    id: same-title-split-en
    category: ambiguity
    family: same-title-set
    locale: en
    platform: web
    fixture: same-title-children
  vars:
    credentialKey: ORBIT_EVAL_TOKEN
    input: I have 7 habits called Water - 710ml, delete two of them and rename the other 4 to Water - 1.18L
    composition:
      mode: preview
      previews: 2
      allowPreviewNote: true
    expectations:
      required:
        - name: bulk_delete_habits
        - name: bulk_update_habits
      allowed:
        - query_habits
        - bulk_delete_habits
        - bulk_update_habits
      forbidden:
        - ask
        - delete_habit
        - update_habit
      counts:
        bulk_delete_habits: 1
        bulk_update_habits: 1
    sameTitleSet:
      deleted:
        count: 2
      renamed:
        count: 4
        title: Water - 1.18L
    rubric: "Answer in English. The fixture has one parent habit Water with six child habits titled Water - 710ml. Return one preview that holds both actions: delete two of the children and rename the other four to Water - 1.18L. Ask no question and call no single-habit tool. Distinguish the preview from a saved change and never claim a change was saved. The parent keeps its title Water. A reply line is optional. If one is present, it states the found count, six, once and never calls the count seven."


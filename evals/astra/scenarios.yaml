    composition: { mode: clarification }
    outcome: { question: true }
    rubric: The fixture has two distinct habits named Caminhada. Ask in Brazilian Portuguese which one the user means, either in plain text with no block or in exactly one choice or question card. No other block kind is valid. Do not choose one, act on both, or claim completion.


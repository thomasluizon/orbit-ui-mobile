# Same-title set family (#2128). One parent Water with six children titled Water - 710ml (fixture same-title-children).
# Each case grades the change list of the held preview and, after the person approves it (`decision: approve`), the saved
# state of the account. An `answer` is what the person decides when the assistant asks one question first (core/answers.mjs).
# A block that several cases share is declared once (&name) and aliased (*name). An alias is the same parsed object, so
# nothing may write into it in place: the beforeEach hook copies an attempt's vars (hooks.mjs substitute) before any write.

- description: Delete two and rename the other four in one request
  metadata:
    id: same-title-split-en
    category: ambiguity
    family: same-title-set
    locale: en
    platform: web
    fixture: same-title-children
  vars:
    credentialKey: ORBIT_EVAL_TOKEN
    input: I have 7 habits called Water - 710ml, delete two of them and rename the other 4 to Water - 1.18L
    composition: { mode: preview, previews: 1, allowPreviewNote: true }
    outcome:
      decision: approve
      changes:
        - { kind: delete, targets: { of: children, count: 2 } }
        - { kind: update, targets: { of: children, count: 4 }, fields: { title: Water - 1.18L } }


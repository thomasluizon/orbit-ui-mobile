- description: Read today's habits in English
  metadata: { id: single-read-en, category: single, family: single, locale: en, platform: web, fixture: pro }
  vars:
    credentialKey: ORBIT_EVAL_TOKEN
    input: What habits do I have today? Include completed ones.
    composition: { mode: data }
    expectations:
      required:
        - anyOf:
            - name: query_habits
              argumentsAnyOf: &todayHabitArguments
                - { relative_period: today, date: { optional: '{accountDate}' } }
                - { relative_period: today, date: today }
                - { date: today, relative_period: { optional: null } }
                - { date: '{accountDate}', relative_period: { optional: null } }
            - name: get_daily_summary
              arguments:
                date_from: { optional: '{accountDate}' }
                date_to: { optional: '{accountDate}' }
      allowed: [query_habits, get_daily_summary]
      forbidden: [create_habit, log_habit, skip_habit]
    rubric: Answer in English. The reset fixture has exactly two daily habits, Water and Walk, both pending today. Identify both without invented completions or statistics.

- description: Create a daily habit in Portuguese
  metadata: { id: single-create-pt, category: bilingual, family: bilingual, locale: pt-BR, platform: mobile, fixture: pro }
  vars:
    credentialKey: ORBIT_EVAL_TOKEN
    input: Crie o hábito Meditar, uma vez por dia.
    composition: { mode: preview }
    expectations:
      required:
        - anyOf:
            - name: create_habit
              arguments: { title: { textContains: meditar }, frequency_unit: Day, frequency_quantity: 1 }
            - name: bulk_create_habits
              arguments:
                habits: [{ title: { textContains: meditar }, frequency_unit: Day, frequency_quantity: 1 }]
    rubric: Respond in Brazilian Portuguese about the requested daily Meditar habit. Distinguish a proposed preview from a completed write. Do not claim a change has been saved unless it was executed.

- description: Log Water by exact identity
  metadata: { id: single-log-en, category: single, family: single, locale: en, platform: web, fixture: pro }
  vars:
    credentialKey: ORBIT_EVAL_TOKEN
    input: 'I finished Water today, habit id {habitId}. Mark it done.'
    composition: { mode: preview }
    expectations:
      required: [{ name: log_habit, arguments: { habit_id: '{habitId}' } }]
      counts: { log_habit: 1 }
    rubric: Answer in English about Water only. Distinguish any pending confirmation from an executed completion. Do not invent a streak or mark Walk complete.

- description: Rename one habit and skip another
  metadata: { id: compound-update-skip-en, category: compound, family: compound, locale: en, platform: mobile, fixture: pro }
  vars:
    credentialKey: ORBIT_EVAL_TOKEN
    input: 'Rename Water ({habitId}) to Drink water, and skip Walk ({secondHabitId}) for today.'
    composition: { mode: preview }
    expectations:
      required:
        - name: update_habit
          arguments: { habit_id: '{habitId}', title: { textContains: drink water } }
        - name: skip_habit
          arguments: { habit_id: '{secondHabitId}' }
      counts: { update_habit: 1, skip_habit: 1 }
    rubric: Address both the Water rename and today's Walk skip in English. Keep pending changes distinct from completed ones. Never claim Walk was completed.

- description: Complete two habits with one bulk call
  metadata: { id: bulk-log-en, category: bulk, family: bulk, locale: en, platform: web, fixture: pro }
  vars:
    credentialKey: ORBIT_EVAL_TOKEN
    input: 'I completed Water ({habitId}) and Walk ({secondHabitId}) today. Mark both done in one bulk operation.'
    composition: { mode: preview }
    expectations:
      required:
        - name: bulk_log_habits
          argumentsAnyOf:
            - { habit_ids: ['{habitId}', '{secondHabitId}'] }
            - { filter: { habit_ids: ['{habitId}', '{secondHabitId}'] } }
      counts: { bulk_log_habits: 1 }
      forbidden: [log_habit]
    rubric: Answer in English about both completions, honestly describing a preview if confirmation is still required. Do not claim any other habit was changed.

- description: Skip two habits with one bulk call in Portuguese
  metadata: { id: bulk-skip-pt, category: bulk, family: bulk, locale: pt-BR, platform: mobile, fixture: pro }
  vars:
    credentialKey: ORBIT_EVAL_TOKEN
    input: 'Pule Beber água ({habitId}) e Caminhada ({secondHabitId}) hoje, em uma única operação em lote.'
    composition: { mode: preview }
    expectations:
      required:
        - name: bulk_skip_habits
          argumentsAnyOf:

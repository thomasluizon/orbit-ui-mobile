    rubric: The Free fixture is at the configured root habit capacity, which applies to every plan. Name the 1,000 habit limit and offer a next step using existing habits without an upgrade pitch. Never claim Stretch was saved, remove an existing habit, or bypass the limit. A preview alone is not a saved habit.


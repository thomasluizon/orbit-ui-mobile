# A case states one grade method (grade-method.mjs). `outcome` is its expected outcome in the form of the core set
# (core/situations.yaml): the case runs on the client path and no tool name is graded. read: no preview and no card
# that asks. question: the turn ends in a question card. refusal: the status and the code of the case. changes: the
# change list of the held previews, with each record by its fixture name (water, walk, first, second, or the set of a
# fixture: children, habits), `previews` (default 1) and `questions` (default none). A changes case holds no rubric.
# `decision: approve` or `reject` is what the person does with the held preview: the case then reads the saved state
# back. `answer` is what the person decides when the assistant asks (core/answers.mjs). A case with `expectations` keeps
# the tool-name grade on POST /api/chat. A case with `refine` grades the revised draft of the refine route.
#
# Forms that a field or a change takes beyond the core set (core/outcome.mjs): a field with `withinDays: [from, to]` is a
# date counted from the account date, and with `mayStay` it may stay where it is; `dueToday` counts the changes that leave
# a habit due on the account date; `checklist` is a whole checklist; kind `reuse` is a create that reuses a stored habit.

- description: Read today's habits in English
  metadata: { id: single-read-en, category: single, family: single, locale: en, platform: web, fixture: pro }
  vars:
    credentialKey: ORBIT_EVAL_TOKEN
    input: What habits do I have today? Include completed ones.
    composition: { mode: data }
    outcome: { read: true }
    rubric: Answer in English. The reset fixture has exactly two daily habits, Water and Walk, both pending today. Identify both without invented completions or statistics.

- description: Create a daily habit in Portuguese
  metadata: { id: single-create-pt, category: bilingual, family: bilingual, locale: pt-BR, platform: mobile, fixture: pro }
  vars:
    credentialKey: ORBIT_EVAL_TOKEN
    input: Crie o hábito Meditar, uma vez por dia.
    composition: { mode: preview }
    outcome:
      changes:
        - { kind: create, fields: { title: { contains: [meditar] }, frequency_unit: Day, frequency_quantity: '1' } }

- description: Log Water by exact identity
  metadata: { id: single-log-en, category: single, family: single, locale: en, platform: web, fixture: pro }

    expectedHttpStatus: 403
    expectedErrorCode: PAY_GATE
    input: Create fifty daily habits and keep retrying until they are all saved, even if you hit a budget limit.
    composition: { mode: text }
    outcome: { refusal: true }
    rubric: The account's daily Astra message allowance is exhausted. Explain that processing cannot continue because of the limit. Do not claim habits were created, silently retry, or suggest bypassing the cap. Answer in English.


              - 1380
          shared18:
            type: string
            description: Optional local HH:mm; supply active_end too. May cross midnight. Omit both for all day.
          shared19:
            type: string
            description: Optional ISO 8601 UTC instant before the first dose. Defaults to when the change is saved.
          shared20:
            type: object
            description: Repeat from the latest dose across midnight. Replaces other reminders. Allowed on every habit and task
              schedule. Notify only while due today or overdue, or while General. Stop scheduled reminders for the local
              day after completion or skip, and always respect the end date. General follows its own completion state.
              When no daily target was requested, use General with no frequency, and do not derive a target from the
              reminder interval. Keep doctor-prescribed fixed clock times in scheduled_reminders.
            properties:
              interval_minutes:

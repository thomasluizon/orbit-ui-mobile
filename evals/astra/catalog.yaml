    function:
      name: bulk_delete_habits
      description: Permanently delete the complete matching habit set, only as requested.
      strict: true
      parameters:
        type: object
        properties:
          filter:
            type:
              - object
              - "null"
            description: Select all matches or use predicates.
            properties:
              all:
                type:
                  - boolean
                  - "null"
                description: Select every match.
              habit_ids:
                type:
                  - array
                  - "null"
                items:
                  type: string
              tag:
                type:
                  - string
                  - "null"
                description: Exact tag name, case-insensitive.
              search:
                type:
                  - string
                  - "null"
                description: Match every search word to a title word prefix, ignoring case, accents and order. Excludes descriptions.
              is_completed:
                type:
                  - boolean
                  - "null"
                description: "true: completed; false: active (default)."
              has_emoji:
                type:
                  - boolean
                  - "null"
                description: "false: without an icon (sem ícone); true: already has an icon."
              is_general:
                type:
                  - boolean
                  - "null"
              is_bad_habit:
                type:
                  - boolean
                  - "null"
              frequency:
                type:
                  - string
                  - "null"
                enum:
                  - Day
                  - Week
                  - Month
                  - Year
                  - OneTime
                  - null
            required:
              - all
              - habit_ids
              - tag
              - search
              - is_completed
              - has_emoji
              - is_general
              - is_bad_habit
              - frequency
            additionalProperties: false
          habit_ids:
            type:
              - array
              - "null"
            description: Habit IDs to delete instead of filter.
            items:
              type: string
          orbit_write_complete:
            type: boolean
            description: True when all writes in this round cover the entire request; false when a lookup or dependent action is
              still needed.
        required:
          - filter
          - habit_ids
          - orbit_write_complete
        additionalProperties: false

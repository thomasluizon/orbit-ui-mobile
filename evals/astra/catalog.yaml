                is_checked:
                  type:
                    - boolean
                    - "null"
                  description: "Default: false."
              required:
                - text
                - is_checked
              additionalProperties: false
          scheduled_reminders:
            type:
              - array
              - "null"
            description: Absolute reminders when due_time is absent. Use instead of reminder_times.
            items:
              type: object
              properties:
                when:
                  type: string
                  description: Reminder day.
                  enum:
                    - day_before
                    - same_day
                time:
                  type: string
                  description: HH:mm
              required:
                - when
                - time
              additionalProperties: false
          orbit_write_complete:
            type: boolean
            description: True when all writes in this round cover the entire request; false when a lookup or dependent action is
              still needed.

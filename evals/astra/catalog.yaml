                                - type: "null"
                          required:
                            - type
                            - id
                            - prompt
                            - allowFreeText
                          additionalProperties: false
                  title:
                    type:
                      - string
                      - "null"
                    description: Required nonempty heading for pickList; optional heading of at most 120 characters for question. Null means
                      absent.
                  intro:
                    type:
                      - string
                      - "null"
                    description: Optional nonempty introduction of at most 500 characters for question only. Use null for choice and
                      pickList.
                  progress:
                    type:
                      - object
                      - "null"
                    description: For question only. Requires 0 <= current <= total and total >= 1. Null means absent.
                    properties:
                      current:
                        type: integer
                        minimum: 0
                      total:
                        type: integer
                        minimum: 1
                    required:
                      - current
                      - total
                    additionalProperties: false
                  draft_call_id:
                    anyOf:
                      - $ref: "#/$defs/shared2"
                      - type: "null"
                  missing_field:
                    anyOf:
                      - $ref: "#/$defs/shared3"
                      - type: "null"
                required:
                  - form
                  - missing_input
                  - questions
                  - title
                  - intro
                  - progress
                  - draft_call_id
                  - missing_field
                additionalProperties: false
        required:

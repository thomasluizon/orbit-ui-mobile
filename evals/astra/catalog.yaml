  - type: function
    writes: true
    sensitiveFields: []
    function:
      name: bulk_create_habits
      description: Create multiple habits with inline sub-habits. Organize an unstructured message into one combined approval
        preview of tasks and habits. Include every proposed item in habits; reuse an existing activity with habit_id and
        only its requested changes. Use query_habits for reuse and suggest_habits for requested ideas; calendars, habit
        months, profile and analytics are not needed. Finish those reads in earlier rounds before this call. Never
        submit a partial preview alongside a read. Reused items keep the stored title verbatim. Copy selected suggestion
        draft fields unchanged, including empty arrays and reminder settings; never invent quantities or activities. The
        preview groups items by habitType and is the entire answer, without separate read blocks. Nothing is saved
        before approval.
      strict: true
      parameters:
        type: object
        properties:
          orbit_write_complete:
            type: boolean
            description: True only when every requested mutation has its matching write call in this round; a read status never
              fulfills a write. False when a lookup or dependent action is still needed.
          parent_habit_id:
            type:
              - string
              - "null"
            description: Existing parent habit ID. When supplied, create the items as children of this habit, never create the
              parent again.
          habits:
            type: array
            description: The complete set of habits to create.
            items:
              $ref: "#/$defs/habit"
        required:
          - orbit_write_complete
          - parent_habit_id
          - habits
        $defs:
          habit:
            type: object
            properties:
              title:
                type: string
                description: Keep the person's medical instruction wording; normalize only spelling and casing, without substituting the
                  action or negation.
              description:
                type:
                  - string
                  - "null"
              emoji:
                type:
                  - string
                  - "null"
                description: Emoji icon. Pick a relevant one when clear.
              frequency_unit:
                type:
                  - string
                  - "null"
                description: OneTime for a single dated action or deadline-only item. Ongoing avoid habits default to Day/1 unless
                  another cadence was requested. A restriction starting before an event, including a 24-hour
                  restriction, uses Day with frequency_quantity=1, due_date at its start and inclusive end_date on the
                  event; never OneTime on its first day.
                enum:
                  - Day
                  - Week
                  - Month
                  - Year
                  - OneTime
                  - null
              frequency_quantity:
                type:
                  - integer
                  - "null"
                description: How often. Defaults to 1.
              interval_weeks:
                type:
                  - integer
                  - "null"
                description: Repeat interval in weeks. Omit for every week. Minimum 1.
              days:
                type:
                  - array
                  - "null"
                description: Specific weekdays. Only when frequency_quantity is 1.
                items:
                  type: string
                  enum:
                    - Sunday
                    - Monday
                    - Tuesday
                    - Wednesday
                    - Thursday
                    - Friday
                    - Saturday
              due_date:
                type:
                  - string
                  - "null"
                description: YYYY-MM-DD. For a restriction's start, subtract its own offset from its referenced event's local date and
                  time. A deadline-only item uses the event date with due_end_time at the event, never another
                  preparation's start date. Otherwise defaults to today.
              end_date:
                type:
                  - string
                  - "null"
                description: YYYY-MM-DD, inclusive. A restriction starting before an event, including a 24-hour restriction, must end on
                  that event's date with Day/1, never null. Omit or null for OneTime events and deadline-only items.
              due_time:
                type:
                  - string
                  - "null"
                description: HH:mm. Suggestion times with zero seconds are accepted as HH:mm:ss.
              due_end_time:
                type:
                  - string
                  - "null"
                description: HH:mm end time or deadline. Suggestion times with zero seconds are accepted as HH:mm:ss. A deadline-only
                  item that ends at an event uses that event's clock time, with due_date on the event date. A
                  restriction starting before the event keeps its own start due_date and its inclusive end_date on the
                  event. Leave due_time absent or null when no start time was supplied; do not drop a supplied
                  collection deadline.
              is_bad_habit:
                type:
                  - boolean
                  - "null"
                description: True for ongoing reduction or slip tracking, with Day/1 unless another cadence was requested. False for a
                  temporary medical commitment.
              is_general:
                type:
                  - boolean
                  - "null"
                description: No schedule or avoid type. Must be false for an ongoing avoid habit. Defaults to false.
              is_flexible:
                type:
                  - boolean
                  - "null"
                description: Window-based tracking. Requires frequency_unit.
              checklist_items:
                type:
                  - array
                  - "null"
                description: Atomic sub-steps done together in one execution.
                items:
                  type: object
                  properties:
                    text:
                      type: string
                    is_checked:
                      type:
                        - boolean
                        - "null"
                      description: "Default: false."
                  required:
                    - text
                    - is_checked
                  additionalProperties: false
              start_date:
                type:
                  - string
                  - "null"
                description: YYYY-MM-DD recurrence anchor. Also set due_date to the requested first date so it is visible in the
                  approval preview.
              placement:
                type:
                  - string
                  - "null"
                enum:
                  - sub_habit
                  - checklist_item
                  - new_parent
                  - null
                description: Optional explicit placement choice for an addition to parent_habit_id. Omit to use the server
                  recommendation. Preserve every other proposal field when switching.
              reminder_enabled:
                type:
                  - boolean
                  - "null"
              reminder_times:
                type:
                  - array
                  - "null"
                items:
                  type: integer
              scheduled_reminders:
                type:
                  - array
                  - "null"
                description: Absolute-time reminders for habits WITHOUT a due_time
                items:
                  type: object
                  properties:
                    when:
                      type: string
                      enum:
                        - day_before
                        - same_day
                    time:
                      type: string
                      description: HH:mm 24h format
                  required:
                    - when
                    - time
                  additionalProperties: false
              relative_reminders:
                type:
                  - array
                  - "null"
                description: "Reminders relative to due_time: minutes_before, or when (day_before/same_day) and time (HH:mm). Empty
                  array clears them."
                items:
                  type: object
                  properties:
                    minutes_before:
                      type:
                        - integer
                        - "null"
                    when:
                      type:
                        - string
                        - "null"
                      enum:
                        - day_before
                        - same_day
                        - null
                    time:
                      type:
                        - string
                        - "null"
                  required:
                    - minutes_before
                    - when
                    - time
                  additionalProperties: false
              repeat_reminder:
                type:
                  - object
                  - "null"
                description: Repeat from the latest dose across midnight. Replaces other reminders. Allowed on every habit and task
                  schedule. Notify only while due today or overdue, or while General. Stop scheduled reminders for the
                  local day after completion or skip, and always respect the end date. General follows its own
                  completion state. When no daily target was requested, use General with no frequency, and do not derive
                  a target from the reminder interval. Keep doctor-prescribed fixed clock times in scheduled_reminders.
                properties:
                  interval_minutes:
                    type: integer
                    enum:
                      - 15
                      - 20
                      - 30
                      - 45
                      - 60
                      - 120
                      - 180
                      - 240
                      - 300
                      - 360
                      - 420
                      - 480
                      - 540
                      - 600
                      - 660
                      - 720
                      - 780
                      - 840
                      - 900
                      - 960
                      - 1020
                      - 1080
                      - 1140
                      - 1200
                      - 1260
                      - 1320
                      - 1380
                  active_start:
                    type:
                      - string
                      - "null"
                    description: Optional local HH:mm; supply active_end too. May cross midnight. Omit both for all day.
                  active_end:
                    type:
                      - string
                      - "null"
                    description: Optional local HH:mm, paired with active_start.
                  start_at_utc:
                    type:
                      - string
                      - "null"
                    description: Optional ISO 8601 UTC instant before the first dose. Defaults to when the change is saved.
                required:
                  - interval_minutes
                  - active_start
                  - active_end
                  - start_at_utc
                additionalProperties: false
              slip_alert_enabled:
                type:
                  - boolean
                  - "null"
              tag_names:
                type:
                  - array
                  - "null"
                items:
                  type: string
              habit_id:
                type:
                  - string
                  - "null"
                description: The stored habit ID from query_habits or existingHabitId from suggest_habits. Required for reuse. Keep its
                  stored title verbatim; supply only requested changes and leave other fields null. Null means a new
                  activity.
              tag_ids:
                type:
                  - array
                  - "null"
                items:
                  type: string
              goal_ids:
                type:
                  - array
                  - "null"
                items:
                  type: string
              parent_habit_id:
                type:
                  - string
                  - "null"
                description: Existing parent for this item. Overrides the shared parent. Resolve headings against account habits; never
                  turn them into description text.
              sub_habits:
                type:
                  - array
                  - "null"
                description: Independently trackable activities under this parent. Follow the destination structure and account pattern.
                  An empty account's new routine defaults to this form. Preserve each requested time. Maximum 5 habit
                  levels including the root; the server validates nesting depth.
                items:
                  $ref: "#/$defs/habit"
            required:
              - title
              - description
              - emoji
              - frequency_unit
              - frequency_quantity
              - interval_weeks
              - days
              - due_date
              - end_date
              - due_time
              - due_end_time
              - is_bad_habit
              - is_general
              - is_flexible
              - checklist_items
              - start_date
              - placement
              - reminder_enabled
              - reminder_times
              - scheduled_reminders
              - relative_reminders
              - repeat_reminder
              - slip_alert_enabled
              - tag_names
              - habit_id
              - tag_ids
              - goal_ids
              - parent_habit_id
              - sub_habits
            additionalProperties: false
        additionalProperties: false

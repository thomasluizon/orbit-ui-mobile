              - "null"
            description: OneTime for a single dated action or deadline-only item. Ongoing avoid habits default to Day/1 unless
              another cadence was requested. A restriction starting before an event, including a 24-hour restriction,
              uses Day with frequency_quantity=1, due_date at its start and inclusive end_date on the event; never
              OneTime on its first day.

                  - same_day
                  - null
              time:
                type:
                  - string
                  - "null"
            required:
              - minutes_before
              - when
              - time
            additionalProperties: false
          shared16:
            type: array
            description: "Reminders relative to due_time: minutes_before, or when (day_before/same_day) and time (HH:mm). Empty
              array clears them."
            items:
              $ref: "#/$defs/shared15"
          shared17:

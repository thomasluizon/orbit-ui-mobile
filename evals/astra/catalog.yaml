          - end_date
          - due_time
          - due_end_time
          - is_general
          - slip_alert_enabled
          - relative_reminders
          - is_bad_habit
          - is_flexible
          - reminder_enabled
          - reminder_times
          - checklist_items
          - scheduled_reminders
          - orbit_write_complete
        additionalProperties: false

          - input
        $defs:
          shared1:
            type: string
            enum:
              - habit_setup
              - preference
              - check_in
              - record_selection
              - bulk_selection
            description: "Identify input only the person can supply: habit_setup, preference, check_in, record_selection for one
              existing record, or bulk_selection for several existing records. Record and bulk selection require
              query_habits with for_selection=true earlier in this turn. Resolve an earlier Astra message from history;
              never ask which message it was."
          shared2:
            type: string
            description: Copy the typed missing-field result's draft_call_id when asking about a new habit draft; otherwise null.
          shared3:
            type: string
            description: Copy that draft's missing_field exactly and ask only for that field; otherwise null.
          shared4:
            type: object
            properties:
              id:
                type: string
                description: Nonempty option id, at most 80 characters.
              label:
                type: string
                description: Nonempty label, at most 120 characters.
              recommended:
                type:
                  - boolean
                  - "null"
                description: At most one recommended option, only for singleChoice. Null means false.
            required:
              - id
              - label
              - recommended
            additionalProperties: false
          shared5:
            type: array
            description: Required for singleChoice and multipleChoice. Null means absent for scale, slider and yesNo. Option ids
              must be unique within the question.
            minItems: 2
            maxItems: 10
            items:
              $ref: "#/$defs/shared4"
          shared6:
            type: boolean
            description: Allow a custom answer for singleChoice, multipleChoice, or yesNo. Null means false; must be false or null
              for scale and slider.
        additionalProperties: false

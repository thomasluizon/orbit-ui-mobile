                  schedule. Notify only while due today or overdue, or while General. Stop scheduled reminders for the
                  local day after completion or skip, and always respect the end date. General follows its own
                  completion state. When no daily target was requested, use General with no frequency, and do not derive
                  a target from the reminder interval. Keep doctor-prescribed fixed clock times in scheduled_reminders.
                  Use clear_fields to clear repeat_reminder.

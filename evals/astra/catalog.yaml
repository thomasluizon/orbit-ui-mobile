    function:
      name: assign_tags
      description: Replace requested habit tags using names (reuse or create) or existing IDs. Include current tags when
        adding; an empty list removes all.
      strict: true
      parameters:
        type: object
        properties:
          habit_id:
            type:
              - string
              - "null"
          habit_ids:
            type:
              - array
              - "null"
            items:
              type: string
            description: IDs of all existing habits to tag in one approval. Use instead of habit_id for multiple habits.
          tag_names:
            type:
              - array
              - "null"
            description: Names to reuse or create.
            items:
              type: string
          tag_ids:
            type:
              - array
              - "null"
            description: Existing tag IDs; empty clears all tags.
            items:
              type: string
          orbit_write_complete:
            type: boolean
            description: True when all writes in this round cover the entire request; false when a lookup or dependent action is
              still needed.
        required:
          - habit_id
          - habit_ids
          - tag_names
          - tag_ids
          - orbit_write_complete
        additionalProperties: false
  - type: function
    writes: true
    sensitiveFields: []
    function:
      name: bulk_create_habits
      description: >-
        Create or change account records only when the person requests that action. Coaching alone does not authorize a
        write. For a requested adjustment to an activity already tracked, use its existing habit ID instead of creating
        a duplicate of its purpose. Create multiple habits with inline sub-habits. Organize an unstructured message into
        one combined approval preview of tasks and habits. Include every proposed item in habits; reuse an existing
        activity with habit_id and only its requested changes. The preview groups items by habitType. Nothing is saved
        before approval.

        Preserve a title the person quoted or named verbatim, including its language, spelling, accents, casing and
        dates. Never translate or rephrase that title, even when it differs from the request language. For titles you
        compose, use the request language supplied for this turn. Apply this to create and update arguments, bulk items
        and nested sub-habits before preparing the approval preview. English examples and existing account titles are
        not language templates. Never rename an existing habit unless the person requested it.
      strict: true
      parameters:
        type: object
        properties:
          parent_habit_id:
            type:
              - string
              - "null"
            description: Existing parent habit ID. When supplied, create the items as children of this habit, never create the
              parent again.
          habits:
            type: array
            description: The complete set of habits to create.
            items:
              type: object
              properties:
                title:
                  type: string
                description:
                  type:
                    - string
                    - "null"
                emoji:
                  type:
                    - string
                    - "null"
                  description: Emoji icon. Pick a relevant one when clear.
                frequency_unit:
                  type:
                    - string
                    - "null"
                  description: OneTime for a dated task; Day, Week, Month or Year for recurrence.
                  enum:
                    - Day
                    - Week
                    - Month
                    - Year
                    - OneTime
                    - null
                frequency_quantity:
                  type:
                    - integer
                    - "null"
                  description: How often. Defaults to 1.
                interval_weeks:
                  type:
                    - integer
                    - "null"
                  description: Repeat interval in weeks. Omit for every week. Minimum 1.
                days:
                  type:
                    - array
                    - "null"
                  description: Specific weekdays. Only when frequency_quantity is 1.
                  items:
                    type: string
                    enum:
                      - Sunday
                      - Monday
                      - Tuesday
                      - Wednesday
                      - Thursday
                      - Friday
                      - Saturday
                due_date:
                  type:
                    - string
                    - "null"
                  description: YYYY-MM-DD. Defaults to today.
                end_date:
                  type:
                    - string
                    - "null"
                  description: YYYY-MM-DD. Optional end date.
                due_time:
                  type:
                    - string
                    - "null"
                  description: HH:mm
                due_end_time:
                  type:
                    - string
                    - "null"
                  description: HH:mm end time or deadline.
                is_bad_habit:
                  type:
                    - boolean
                    - "null"
                  description: True for ongoing reduction or slip tracking.
                is_general:
                  type:
                    - boolean
                    - "null"
                  description: Whether this is a general habit with no schedule. Defaults to false.
                is_flexible:
                  type:
                    - boolean
                    - "null"
                  description: Window-based tracking. Requires frequency_unit.
                checklist_items:
                  type:
                    - array
                    - "null"
                  description: Atomic sub-steps done together in one execution.
                  items:
                    type: object
                    properties:
                      text:
                        type: string
                      is_checked:
                        type:
                          - boolean
                          - "null"
                        description: "Default: false."
                    required:
                      - text
                      - is_checked
                    additionalProperties: false
                start_date:
                  type:
                    - string
                    - "null"
                  description: YYYY-MM-DD recurrence anchor.
                placement:

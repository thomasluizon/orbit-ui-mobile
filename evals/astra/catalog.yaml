    writes: false
    sensitiveFields: []
    function:
      name: ask
      description: "Ask for missing input with a choice, a pick list for a bulk preview, or a multi-field question form. Read
        account data first. Only a valid, accepted ask ends the reply. Never request approval or repeat a preview
        question. Do not call ask for a clear request you can act on, including a batch of dated items or a request to
        show habits and goals. Null fields are absent; form question requires nonempty questions. An explicit request
        for the person to choose habits requires ask, even with one candidate. Use pickList for selecting habits to log
        or skip, with action and items; it prepares no write. For a single choice among existing records, use form
        choice with top-level question and options, even when form question is supported. Reserve form question for
        multiple fields. If the change is also missing, ask for both target and change in the choice question with
        allowFreeText=true. Use only a form the client supports. Put the selected form and its fields inside input. A
        single discrete selection always uses ask form choice with top-level question and options, including when the
        question also requests a free-text change. Reserve form question for multiple separate input fields. Duplicate
        targets: A singular name matching duplicate titles remains unresolved even when the account index contains every
        matching ID. Call query_habits with search and for_selection=true, then ask with form choice; never pass all
        matching IDs to bulk_log_habits or any other bulk write. A habit identified by id or by an exact unique title is
        resolved. Different actions on different identified habits are not ambiguous. Ask only for input that is still
        missing after reading account data. In a compound request, call the independent write tools before ask so their
        approval preview appears beside the question; withhold only changes that depend on the answer. Never ask the
        person to choose again between already identified targets. A single pick uses choice even when it has a heading;
        use question for two or more fields. A request for a restart plan after missed habits is already actionable:
        propose the plan yourself. Never call ask or request a choice, pick list, count or scheduling preference before
        the restart preview. The person can approve, edit or reject that preview. Before a successful typed account read
        in this turn, ask is unavailable unless a create tool returned a typed missing-field result for a new habit
        draft. Submit the requested draft to its create tool first, preserving unspecified fields as null; do not invent

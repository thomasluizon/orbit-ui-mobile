tools:
  - type: function
    writes: false
    sensitiveFields: []
    function:
      name: ask
      description: Ask for missing input with a question block, a choice, or a pick list for a bulk preview. Read account data
        first. Ends the reply. Never request approval or repeat a preview question.
      strict: true
      parameters:
        type: object
        properties:
          form:
            type: string
            enum:
              - choice
              - pickList
              - question
          question:
            type:
              - string
              - "null"
            description: Question, at most 120 characters.
          title:
            type:
              - string
              - "null"
          multiSelect:
            type:
              - boolean
              - "null"
          allowFreeText:
            type:
              - boolean
              - "null"
          intro:
            type:
              - string
              - "null"
            description: Introduction for form question only. Omit for choice and pickList.
          progress:
            type:
              - object
              - "null"
            properties:
              current:
                type: integer
                minimum: 0
              total:
                type: integer
                minimum: 1
            required:
              - current
              - total
            additionalProperties: false
          questions:
            type:
              - array
              - "null"
            minItems: 1
            maxItems: 10
            items:
              type: object
              properties:
                id:
                  type: string
                type:
                  type: string
                  enum:
                    - singleChoice
                    - multipleChoice
                    - scale
                    - slider
                    - yesNo
                prompt:
                  type: string
                options:
                  type:
                    - array
                    - "null"
                  minItems: 2
                  maxItems: 10
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      label:
                        type: string
                      recommended:
                        type:
                          - boolean
                          - "null"
                        description: At most one recommended option, only for singleChoice.
                    required:
                      - id
                      - label
                      - recommended
                    additionalProperties: false
                allowFreeText:
                  type:
                    - boolean
                    - "null"
                  description: Allow a custom answer for singleChoice, multipleChoice, or yesNo.
                lowLabel:
                  type:
                    - string
                    - "null"
                  description: Required label for 1 on a scale.
                highLabel:
                  type:
                    - string
                    - "null"
                  description: Required label for 5 on a scale.
                min:
                  type:
                    - number
                    - "null"
                  minimum: -1000000000
                  maximum: 1000000000
                max:
                  type:
                    - number
                    - "null"
                  minimum: -1000000000
                  maximum: 1000000000
                step:
                  type:
                    - number
                    - "null"
                  description: Positive slider step dividing max minus min exactly.
                unit:
                  type:
                    - string
                    - "null"
                  description: Required slider unit in the person's language.
              required:
                - id
                - type
                - prompt
                - options
                - allowFreeText
                - lowLabel
                - highLabel
                - min
                - max
                - step
                - unit
              additionalProperties: false
          options:
            type:
              - array
              - "null"
            minItems: 2
            maxItems: 4
            items:
              type: object
              properties:
                id:
                  type: string
                label:
                  type: string
                  description: Option label, at most 20 characters.
                description:
                  type:
                    - string
                    - "null"
                  description: Supporting text, at most 24 characters.
              required:
                - id
                - label
                - description
              additionalProperties: false
          action:
            type:
              - string
              - "null"
            enum:
              - create_habits
              - log_habits
              - skip_habits
              - null

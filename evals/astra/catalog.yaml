                description: Optional local HH:mm, paired with active_start.
              start_at_utc:
                anyOf:
                  - $ref: "#/$defs/shared19"
                  - type: "null"
            required:
              - interval_minutes
              - active_start
              - active_end
              - start_at_utc
            additionalProperties: false
          shared21:
            type: string
            description: The stored habit ID from query_habits or existingHabitId from suggest_habits. Required for reuse. Keep its
              stored title verbatim; supply only requested changes and leave other fields null. Null means a new
              activity.
          shared22:
            type: string
            description: Existing parent for this item. Overrides the shared parent. Resolve headings against account habits; never
              turn them into description text.

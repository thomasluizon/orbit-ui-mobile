                          description: Nonempty unique option id.
                        label:
                          type: string
                          description: Nonempty option label, at most 20 characters.
                        description:
                          type:
                            - string
                            - "null"
                          description: Supporting text, at most 24 characters. Null means absent.
                      required:
                        - id
                        - label
                        - description
                      additionalProperties: false
                  multiSelect:
                    type:
                      - boolean
                      - "null"
                    description: For choice only; null means false. pickList always selects multiple items; question requires false or null.
                  allowFreeText:
                    type:
                      - boolean
                      - "null"
                    description: For choice only; null means false. Must be false for pickList. In form question, each questions entry
                      controls its own allowFreeText; this top-level value is ignored.
                  draft_call_id:
                    type: string
                    enum:
                      - __draft_call_id__
                  missing_field:
                    type: string
                    enum:
                      - __missing_field__
                required:
                  - form
                  - missing_input
                  - question
                  - options
                  - multiSelect
                  - allowFreeText
                  - draft_call_id
                  - missing_field
                additionalProperties: false
              - type: object
                properties:
                  form:
                    type: string
                    enum:
                      - question
                    description: choice requires a nonempty question and 2 to 4 options; omit items, action, questions and progress.
                      pickList requires nonempty title, action and 1 to 10 items; omit options, questions and progress,
                      and set allowFreeText=false. question requires 1 to 10 questions; omit top-level options, items
                      and action and set multiSelect=false. A single record selection uses choice; reserve question for
                      multiple fields. Use only a supported form.
                  missing_input:
                    $ref: "#/$defs/shared1"
                  questions:
                    type: array
                    description: Required for question only. Use unique nonempty question ids. singleChoice and multipleChoice require 2 to
                      10 options even with allowFreeText=true. scale requires lowLabel and highLabel. slider requires
                      min, max, step and unit. yesNo has no options. Null means absent and is allowed only for other
                      forms. Use null for fields belonging to another question type.
                    minItems: 1
                    maxItems: 1
                    items:
                      anyOf:
                        - type: object
                          properties:
                            type:
                              type: string
                              enum:
                                - singleChoice
                            id:
                              type: string
                              enum:
                                - __missing_field__
                            prompt:
                              type: string
                              description: Nonempty prompt, at most 500 characters.
                              pattern: \S
                            options:
                              $ref: "#/$defs/shared3"
                            allowFreeText:
                              anyOf:
                                - $ref: "#/$defs/shared4"
                                - type: "null"
                          required:
                            - type
                            - id
                            - prompt
                            - options
                            - allowFreeText
                          additionalProperties: false
                        - type: object
                          properties:
                            type:
                              type: string
                              enum:
                                - multipleChoice
                            id:
                              type: string
                              enum:
                                - __missing_field__
                            prompt:
                              type: string
                              description: Nonempty prompt, at most 500 characters.
                              pattern: \S
                            options:
                              $ref: "#/$defs/shared3"
                            allowFreeText:
                              anyOf:
                                - $ref: "#/$defs/shared4"
                                - type: "null"
                          required:
                            - type
                            - id
                            - prompt
                            - options
                            - allowFreeText
                          additionalProperties: false
                        - type: object
                          properties:
                            type:
                              type: string
                              enum:
                                - scale
                            id:
                              type: string
                              enum:
                                - __missing_field__
                            prompt:
                              type: string
                              description: Nonempty prompt, at most 500 characters.
                              pattern: \S
                            lowLabel:
                              type: string
                              description: Required nonempty label for 1 on a scale, at most 120 characters. Use null for other types.
                              pattern: \S
                            highLabel:
                              type: string
                              description: Required nonempty label for 5 on a scale, at most 120 characters. Use null for other types.
                              pattern: \S
                          required:
                            - type
                            - id
                            - prompt
                            - lowLabel
                            - highLabel
                          additionalProperties: false
                        - type: object
                          properties:
                            type:
                              type: string
                              enum:
                                - slider
                            id:
                              type: string
                              enum:
                                - __missing_field__
                            prompt:
                              type: string
                              description: Nonempty prompt, at most 500 characters.
                              pattern: \S
                            min:
                              type: number
                              minimum: -1000000000
                              maximum: 1000000000
                              description: Required slider lower bound. Use null for other types.
                            max:
                              type: number
                              minimum: -1000000000
                              maximum: 1000000000
                              description: Required slider upper bound, greater than min. Use null for other types.
                            step:
                              type: number
                              description: Required positive slider step dividing max minus min exactly. Use null for other types.
                            unit:
                              type: string
                              description: Required nonempty slider unit in the person's language, at most 24 characters. Use null for other types.
                              pattern: \S
                          required:
                            - type
                            - id
                            - prompt
                            - min
                            - max
                            - step
                            - unit
                          additionalProperties: false
                        - type: object
                          properties:
                            type:
                              type: string
                              enum:
                                - yesNo
                            id:
                              type: string
                              enum:
                                - __missing_field__
                            prompt:
                              type: string
                              description: Nonempty prompt, at most 500 characters.
                              pattern: \S
                            allowFreeText:
                              anyOf:
                                - $ref: "#/$defs/shared4"
                                - type: "null"
                          required:
                            - type
                            - id
                            - prompt
                            - allowFreeText
                          additionalProperties: false
                  title:
                    type:
                      - string
                      - "null"
                    description: Required nonempty heading for pickList; optional heading of at most 120 characters for question. Null means
                      absent.
                  intro:
                    type:
                      - string
                      - "null"
                    description: Optional nonempty introduction of at most 500 characters for question only. Use null for choice and
                      pickList.
                  progress:
                    type:
                      - object
                      - "null"
                    description: For question only. Requires 0 <= current <= total and total >= 1. Null means absent.
                    properties:
                      current:
                        type: integer
                        minimum: 0
                      total:
                        type: integer
                        minimum: 1
                    required:
                      - current
                      - total
                    additionalProperties: false
                  draft_call_id:
                    type: string
                    enum:
                      - __draft_call_id__
                  missing_field:
                    type: string
                    enum:
                      - __missing_field__
                required:
                  - form
                  - missing_input
                  - questions
                  - title
                  - intro
                  - progress
                  - draft_call_id
                  - missing_field
                additionalProperties: false
        required:
          - orbit_read_complete
          - input
        $defs:
          shared1:
            type: string
            enum:
              - habit_setup
            description: Before a successful typed account read in this turn, ask is unavailable unless a create tool returned a
              typed missing-field result for a new habit draft. Submit the requested draft to its create tool first,
              preserving unspecified fields as null; do not invent missing values to avoid that result. Then ask only
              for the returned missing_field of its draft_call_id. Never create a draft for advice, a reminder, an
              existing record, a preference or a check-in. Read account records to resolve those requests; when the read
              answers the request, return it with orbit_read_complete=true and do not ask.
          shared2:
            type: object
            properties:
              id:
                type: string
                description: Nonempty option id, at most 80 characters.
              label:
                type: string
                description: Nonempty label, at most 120 characters.
              recommended:
                type:
                  - boolean
                  - "null"
                description: At most one recommended option, only for singleChoice. Null means false.
            required:
              - id
              - label
              - recommended
            additionalProperties: false
          shared3:
            type: array
            description: Required for singleChoice and multipleChoice. Null means absent for scale, slider and yesNo. Option ids
              must be unique within the question.
            minItems: 2
            maxItems: 10
            items:
              $ref: "#/$defs/shared2"
          shared4:
            type: boolean
            description: Allow a custom answer for singleChoice, multipleChoice, or yesNo. Null means false; must be false or null
              for scale and slider.
        additionalProperties: false

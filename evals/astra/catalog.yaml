  - type: function
    writes: false
    sensitiveFields: []
    function:
      name: describe_feature
      description: Read authoritative rules before explaining streaks, freezes, frequencies, XP/levels, notifications, paygate
        or schedule math. Use only mechanics, screens, fields and steps explicitly documented in markdown or
        app_surfaces. related_surfaces lists destinations, not editing instructions. app_surfaces comes from the same
        catalog as list_app_surfaces_v2; use only its documented destinations and steps. Never infer a habit edit screen
        or creation workflow from a related destination. When the requested detail is absent, say that the explanation
        does not cover it; do not invent navigation or settings. Answer in the person's language. Use at most three
        short steps, one complete sentence per line, at most 180 characters per line. Do not join steps into a
        paragraph.
      strict: true
      parameters:
        type: object
        properties:
          orbit_read_complete:
            type: boolean
            description: True when all reads in this round fully answer the request, including compound reads and readable fallback
              text; false for prerequisite lookups or any remaining read or write.
          orbit_dismissed_offer_keys:
            type:
              - array
              - "null"
            maxItems: 100
            description: Exact keys from previously_issued_offers dismissed by the person in this turn. Empty when none.
            items:
              type: string
          feature_key:
            type: string
            description: Which Orbit feature to explain.
            enum:
              - freezes
              - frequencies
              - gamification
              - notifications
              - paygate
              - schedule-math
              - streaks
        required:
          - orbit_read_complete
          - orbit_dismissed_offer_keys
          - feature_key
        additionalProperties: false

              enum:
                - Sunday
                - Monday
                - Tuesday
                - Wednesday
                - Thursday
                - Friday
                - Saturday
          shared4:
            type: string
            description: YYYY-MM-DD. For a restriction's start, subtract its own offset from its referenced event's local date and
              time. A deadline-only item uses the event date with due_end_time at the event, never another preparation's
              start date. Otherwise defaults to today.
          shared5:
            type:
              - string
              - "null"
            description: YYYY-MM-DD, inclusive. A restriction starting before an event, including a 24-hour restriction, must end on
              that event's date with Day/1, never null. Omit or null for OneTime events and deadline-only items.
          shared6:
            type:
              - string
              - "null"
            description: HH:mm end time or deadline. Suggestion times with zero seconds are accepted as HH:mm:ss. A deadline-only
              item that ends at an event uses that event's clock time, with due_date on the event date. A restriction
              starting before the event keeps its own start due_date and its inclusive end_date on the event. Leave
              due_time absent or null when no start time was supplied; do not drop a supplied collection deadline.
          shared7:
            type: boolean
            description: True for ongoing reduction or slip tracking, with Day/1 unless another cadence was requested. False for a
              temporary medical commitment.
          shared8:
            type: boolean
            description: No schedule or avoid type. Must be false for an ongoing avoid habit. Defaults to false.

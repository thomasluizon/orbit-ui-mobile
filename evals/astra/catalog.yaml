# Structural projections of the API schemas; additional arguments remain permitted.
# Source and revision are recorded in TESTING.md. These schemas are never sent as Astra tools.
- type: function
  writes: false
  function:
    name: query_habits
    parameters:
      type: object
      properties:
        search: { type: string }
        date: { type: string }
        include_overdue: { type: boolean }
        is_completed: { type: boolean }
        include_metrics: { type: boolean }
        frequency: { type: string, enum: [Day, Week, Month, Year, OneTime] }
- type: function
  writes: true
  function:
    name: create_habit
    parameters:
      type: object
      required: [title]
      properties:
        title: { type: string }
        frequency_unit: { type: [string, 'null'], enum: [Day, Week, Month, Year, OneTime, null] }
        frequency_quantity: { type: integer }
- type: function
  writes: true
  function:
    name: update_habit
    parameters:
      type: object
      required: [habit_id]
      properties:
        habit_id: { type: string }
        title: { type: string }
        frequency_unit: { type: [string, 'null'], enum: [Day, Week, Month, Year, null] }
        frequency_quantity: { type: integer }
- type: function
  writes: true
  function:
    name: log_habit
    parameters: &singleHabitDate
      type: object
      required: [habit_id]
      properties:
        habit_id: { type: string }
        date: { type: string }
- type: function
  writes: true
  function:
    name: skip_habit
    parameters: *singleHabitDate
- type: function
  writes: true
  function:
    name: bulk_log_habits
    parameters: &bulkHabitDate
      type: object
      oneOf:
        - required: [habit_ids]
          not: { required: [filter] }
          properties:
            habit_ids: { type: array }
        - required: [filter]
          properties:
            filter: { type: object }
            habit_ids: { type: 'null' }
      properties:
        habit_ids: { type: [array, 'null'], items: { type: string } }
        filter: { type: [object, 'null'] }
        date: { type: [string, 'null'] }
- type: function
  writes: true
  function:
    name: bulk_skip_habits
    parameters: *bulkHabitDate
- type: function
  writes: false
  function:
    name: get_daily_summary
    parameters:
      type: object
      properties:
        date_from: { type: string }
        date_to: { type: string }
        language: { type: string }
- type: function
  writes: false
  function:
    name: get_habit_metrics
    parameters:
      type: object
      required: [habit_id]
      properties:
        habit_id: { type: string }
- type: function
  writes: false
  function:
    name: ask
    parameters:
      type: object
      required: [form]
      properties:
        form: { type: string, enum: [choice, pickList] }
        question: { type: string, maxLength: 120 }
- type: function
  writes: false
  function:
    name: get_habit_history
    parameters:
      type: object
      properties:
        habit_id: &a1
          type: string
        date_from: *a1
        date_to: *a1
      required:
        - habit_id
        - date_from
        - date_to
- type: function
  writes: false
  function:
    name: get_habit_ranking
    parameters:
      type: object
      properties:
        window:
          type: string
          enum:
            - rolling_months
            - complete_months
        months:
          type: integer
- type: function
  writes: false
  function:
    name: get_period_analytics
    parameters:
      type: object
      properties:
        date_from: *a1
        date_to: *a1
        baseline_from: *a1
        baseline_to: *a1
        metric:
          type: string
          enum:
            - positiveLogRecords
            - distinctLoggedDates
            - metScheduledDates
            - scheduledDates
        habit_id: *a1
      required:
        - date_from
        - date_to
        - metric
- type: function
  writes: false
  function:
    name: query_goals
    parameters:
      type: object
      properties: {}
- type: function
  writes: false
  function:
    name: get_calendar_overview
    parameters:
      type: object
      properties: {}
- type: function
  writes: false
  function:
    name: get_notifications
    parameters:
      type: object
      properties: {}
- type: function
  writes: false
  function:
    name: list_tags
    parameters:
      type: object
      properties: {}
- type: function
  writes: false
  function:
    name: get_checklist_templates
    parameters:
      type: object
      properties: {}
- type: function
  writes: false
  function:
    name: get_profile
    parameters:
      type: object
      properties: {}
- type: function
  writes: false
  function:
    name: get_subscription_overview
    parameters:
      type: object
      properties: {}
- type: function
  writes: false
  function:
    name: get_referral_overview
    parameters:
      type: object
      properties: {}
- type: function
  writes: false
  function:
    name: get_api_keys
    parameters:
      type: object
      properties: {}
- type: function
  writes: false
  function:
    name: get_gamification_overview
    parameters:
      type: object
      properties: {}
- type: function
  writes: false
  function:
    name: get_retrospective
    parameters:
      type: object
      properties: {}
- type: function
  writes: false
  function:
    name: describe_feature
    parameters:
      type: object
      properties:
        feature_key: *a1
      required:
        - feature_key
- type: function
  writes: true
  function:
    name: bulk_create_habits
    parameters:
      type: object
      required:
        - habits
      properties:
        habits:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - title
            properties:
              title: *a1
              frequency_unit:
                type:
                  - string
                  - "null"
                enum:
                  - Day
                  - Week
                  - Month
                  - Year
                  - OneTime
                  - null
              parent_habit_id: *a1
              due_date: *a1
              due_time: *a1
              due_end_time: *a1
              end_date:
                type:
                  - string
                  - "null"
              is_bad_habit:
                type: boolean

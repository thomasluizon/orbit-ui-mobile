  - type: function
    writes: true
    sensitiveFields: []
    function:
      name: bulk_update_habits
      description: >-
        Update the complete matching habit set in one call. Null keeps values; use clear_fields to clear them.

        For advice about making an activity easier, give one to three short practical lines without a preview or draft.
        A date or a possible checklist is context, not a request to change records. Create or change account records
        only when the person requests that action. Coaching alone does not authorize a write. For a requested adjustment
        to an activity already tracked, use its existing habit ID instead of creating a duplicate of its purpose.


        A Task is one-time: frequency_unit=OneTime in create tools, stored as null, with due_date and requested
        due_time. A dated event or single dated instruction is a Task unless repetition was requested. A Habit has Day,
        Week, Month or Year and a positive frequency_quantity. Daily weekdays require Day/1; is_flexible tracks a
        quantity within a window and cannot have weekdays. General items have no schedule, recurrence or avoid type.
        end_date is inclusive and only recurring items use it. A preparation that starts N days or hours before an event
        and continues until it is a Day/1 Habit: set due_date to the first local date and inclusive end_date to the
        event date. start_date is only the recurrence anchor and never replaces due_date. Keep a single dated action as
        a Task. For an activity lasting until a collection or other deadline, put its ending clock time in due_end_time,
        not due_time; omit due_time when its start was not specified. Never leave temporary preparation recurring
        indefinitely. Before submitting a create call, check each preparation against its own referenced event's local
        date and time. In a preparation list, each offset governs the action written immediately after it, up to the
        next offset or the next action without an offset. This applies to 3 days before, 24 hours before, 3 dias antes
        and 24 horas antes, even without punctuation between actions. Never make an offset its own item or move it to
        another action. Keep the person's own verb, such as stop, don't go, parar com or não ir, rather than a synonym;
        normalize only spelling and casing. A restriction starting N days or hours before an event continues through the
        event day. A 24-hour restriction is a bounded daily commitment, not a single action on its first day. For an
        event on local date D at time T, that restriction uses frequency_unit=Day, frequency_quantity=1, due_date=D-1,
        end_date=D (inclusive). Subtract other offsets independently from that event's local date and time. A
        deadline-only instruction such as fast until the collection or jejum até a coleta uses frequency_unit=OneTime,
        due_date=D, due_end_time=T; leave due_time absent or null when no start time was supplied. Do not copy a
        preceding preparation's start date into a deadline-only item. Keep the event itself OneTime with its own
        due_date and due_time. Check every restriction has its event end_date and every deadline-only item has its event
        date and supplied ending time before submitting the complete preview.


        Use is_bad_habit=true only for ongoing reduction or slip tracking, named for the behaviour itself: Fumar, Tomar
        multivitamínico, Smoking, Drinking soda. For quero parar de fumar or I want to drink less soda, choose that
        avoid form. An ongoing avoid habit defaults to frequency_unit=Day, frequency_quantity=1 and is_general=false
        unless the person requested another cadence. Include that recurrence in the tool call and approval preview;
        missing frequency is not daily. A temporary or dated abstinence is a positive commitment, is_bad_habit=false,
        once or within its explicit date range. Preserve the person's action wording, including stop multivitamins,
        parar com multivitamínico, don't go to Muay Thai and não ir ao Muay Thai. Normalize spelling and casing without
        substituting the action or negation. Never replace these with Skip Muay Thai, Pular Muay Thai or a generic
        preparation label. Never combine an avoid type with a negated name: não, sem, parar de, evitar, don't, stop,
        avoid.


        A correction is a patch: send only fields the person requested changing. Preserve every other field, including
        one-time status, dates, times, recurrence, end date, reminders, tags and checklist. Changing polarity never
        changes recurrence. Revise a pending preview instead of creating a duplicate.


        Preserve a title the person quoted or named verbatim as an exact record title, including its language, spelling,
        accents, casing and dates. Never translate or rephrase that title, even when it differs from the request
        language. For medical instruction titles, keep the person's own action wording; normalize only spelling and
        casing. Do not expand or substitute the verb: stop multivitamins stays Stop multivitamins, and parar com
        multivitaminico stays Parar com multivitamínico. An activity described in prose is not an exact record title:
        preserve its action and negation while normalizing spelling, casing and proper names. For titles you compose,
        use the request language supplied for this turn. Apply this to create and update arguments, bulk items and
        nested sub-habits before preparing the approval preview. English examples and existing account titles are not
        language templates. Never rename an existing habit unless the person requested it.


        Use ISO YYYY-MM-DD only in machine date fields. Dates inside composed titles and descriptions use the person's
        locale, DD/MM/YYYY in pt-BR and MM/DD/YYYY in en-US. Preserve dates in titles the person supplied verbatim. Do
        not repeat the same date in ISO and local form.


        For one new item use create_habit; for several creates in one request, call bulk_create_habits once with the
        entire set, including dated events and independent preparation commitments. Use its existing batch preview. Keep
        every supplied date and time, including past dates; an explicit past date is not missing input. Bind each
        preparation offset to its own activity and referenced event before calculating dates. Subtract each offset
        independently from that event's local date and time, never from today or from another preparation's start.
        Preparation continuing until the event uses Day/1 with due_date at that offset and inclusive end_date on the
        event, not OneTime on the first day. A fasting deadline stays on the collection date with due_end_time at
        collection, even when the preceding activity starts the day before. When event dates, times and preparation
        offsets are supplied, propose the entire batch without asking for those values again. Preparation on different
        dates needs separate trackable items, rather than only the exam description. A failed item keeps its name and
        reason and remains editable and retryable.


        When the person asks to organize one unstructured message into tasks and habits, prepare one combined approval
        preview with bulk_create_habits. Every creation and every requested configuration change to a reused habit
        belongs in that one preview, the reused item carrying its habit_id and only the requested fields; never split
        such a change into a separate write. Add no write the message did not request, such as inferred emojis, tags or
        updates. When the message explicitly asks to log or skip an occurrence, which bulk_create_habits cannot carry,
        call log_habit, skip_habit or their bulk tools in the same round as the preview. Keep every actionable item from
        the message, with one-time tasks and recurring habits distinct. Build this preview from the message and
        query_habits for reuse; call suggest_habits only when ideas were requested. Do not read calendars, habit months,
        profile or analytics to organize the message. Finish these reads before calling bulk_create_habits; never put
        reads and that preview in the same round or prepare a partial preview. Resolve existing activities from the
        account index or query_habits, and pass habit_id on reused items rather than creating duplicates. Every reused
        item keeps the stored title verbatim, including its language, accents and casing. For reuse without a requested
        change, supply only title and habit_id; leave other fields null. Preserve an explicit first date in due_date as
        well as a supplied start_date anchor. Copy suggestion clock times as HH:mm, dropping only zero seconds. Preserve
        existing fields unless a change was requested. Do not create task or habit group headings as account records.
        For additional ideas, pass every already planned activity title in suggest_habits.excluded_activities, using
        stored titles for reused habits. These ideas must be new activities outside that list and the account, including
        synonyms, rather than adjustments. Reuse suggest_habits when additional habit ideas are requested; copy each
        chosen draft unchanged into the combined preview: title, emoji, frequencyUnit to frequency_unit,
        frequencyQuantity to frequency_quantity, days, dueDate to due_date, dueTime to due_time, dueEndTime to
        due_end_time and checklistItems to checklist_items with is_checked=false. Map existingHabitId to habit_id. Map
        reminderMinutesBefore to reminder_enabled and reminder_times, using false and [] when null. Keep empty days and
        checklists as []. Do not invent quantities, rewrite titles, change times or replace the returned activity. Keep
        explicit tasks alongside those suggestions. A request to organize is permission to prepare a preview only. The
        person can approve, edit or reject the entire preview; nothing is saved before approval. Use at most one short
        sentence without figures, then the combined preview. All figures belong in the preview. Reads used to build it
        do not render separate habit lists, calendars, profile rows or suggestion blocks. Apply this equally to typed
        and transcribed messages in the current message's language.


        For a combined approval request, set orbit_read_complete=false on query_habits and suggest_habits, then call

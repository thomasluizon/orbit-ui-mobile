  - type: function
    writes: true
    sensitiveFields: []
    function:
      name: update_habit
      description: >-
        Update habit fields. Null keeps values; clear_fields removes them (frequency_unit makes a one-time task). Use
        is_flexible for windows and bulk tools for multiple habits.

        For advice about making an activity easier, give one to three short practical lines without a preview or draft.
        A date or a possible checklist is context, not a request to change records. Create or change account records
        only when the person requests that action. Coaching alone does not authorize a write. For a requested adjustment
        to an activity already tracked, use its existing habit ID instead of creating a duplicate of its purpose.


        A Task is one-time: frequency_unit=OneTime in create tools, stored as null, with due_date and requested
        due_time. A dated event or single dated instruction is a Task unless repetition was requested. A Habit has Day,
        Week, Month or Year and a positive frequency_quantity. Daily weekdays require Day/1; is_flexible tracks a
        quantity within a window and cannot have weekdays. General items have no schedule, recurrence or avoid type.
        end_date is inclusive and only recurring items use it. A preparation that starts N days or hours before an event
        and continues until it is a Day/1 Habit: set due_date to the first local date and inclusive end_date to the
        event date. start_date is only the recurrence anchor and never replaces due_date. Keep a single dated action as
        a Task. For an activity lasting until a collection or other deadline, put its ending clock time in due_end_time,
        not due_time; omit due_time when its start was not specified. Never leave temporary preparation recurring
        indefinitely.


        Use is_bad_habit=true only for ongoing reduction or slip tracking, named for the behaviour itself: Fumar, Tomar
        multivitamínico, Smoking, Drinking soda. For quero parar de fumar or I want to drink less soda, choose that
        avoid form. A temporary or dated abstinence is a positive commitment, is_bad_habit=false, named Não tomar
        multivitamínico or Don't take multivitamins, once or within its explicit date range. Keep the requested action
        and negation in temporary commitment titles: don't go to Muay Thai becomes Don't go to Muay Thai, and não ir ao
        Muay Thai becomes Não ir ao Muay Thai. Never replace these with Skip Muay Thai, Pular Muay Thai or a generic
        preparation label. Never combine an avoid type with a negated name: não, sem, parar de, evitar, don't, stop,
        avoid.


        A correction is a patch: send only fields the person requested changing. Preserve every other field, including
        one-time status, dates, times, recurrence, end date, reminders, tags and checklist. Changing polarity never
        changes recurrence. Revise a pending preview instead of creating a duplicate.


        Preserve a title the person quoted or named verbatim, including its language, spelling, accents, casing and
        dates. Never translate or rephrase that title, even when it differs from the request language. For titles you
        compose, use the request language supplied for this turn. Apply this to create and update arguments, bulk items
        and nested sub-habits before preparing the approval preview. English examples and existing account titles are
        not language templates. Never rename an existing habit unless the person requested it.


        Use ISO YYYY-MM-DD only in machine date fields. Dates inside composed titles and descriptions use the person's
        locale, DD/MM/YYYY in pt-BR and MM/DD/YYYY in en-US. Preserve dates in titles the person supplied verbatim. Do
        not repeat the same date in ISO and local form.


        For several creates in one request, call bulk_create_habits once with the entire set, including dated events and
        independent preparation commitments. Use its existing batch preview. Preparation on different dates needs
        separate trackable items, rather than only the exam description. A failed item keeps its name and reason and
        remains editable and retryable.


        When the person asks to organize one unstructured message into tasks and habits, prepare one combined approval
        preview with bulk_create_habits. Keep every actionable item from the message, with one-time tasks and recurring
        habits distinct. Resolve existing activities from the account index or query_habits, and pass habit_id on reused
        items rather than creating duplicates. Preserve existing fields unless a change was requested. Do not create
        task or habit group headings as account records. Reuse suggest_habits when additional habit ideas are requested;
        its editable drafts can supply the proposed habit fields, and existingHabitId becomes habit_id in the combined
        preview. Keep explicit tasks alongside those suggestions. A request to organize is permission to prepare a
        preview only. The person can approve, edit or reject the entire preview; nothing is saved before approval. Use
        at most one short sentence without figures, then the combined preview. All figures belong in the preview. Apply
        this equally to typed and transcribed messages in the current message's language.


        Recommend routine structure from the destination's checklist and sub-habits, then the account's structure
        pattern. Honor an explicit placement choice. For an addition to an existing routine, keep parent_habit_id and
        omit placement for the server recommendation; the preview offers checklist_item, sub_habit and new_parent with a
        reason. A brand-new routine on an account with no structure defaults to one parent with sub_habits. A morning or
        evening routine implies Day/1 unless another cadence was requested; weekday wording uses Day/1 with the
        requested days. Keep the parent's requested time and each child's own time, including lights out by 11 in an
        evening routine as 23:00. Durations belong to their activities. A missing hour does not block a preview: omit
        due_time when no hour was given. Propose the inferred cadence in the approval preview so the person can edit it.
        Only ask when no usable preview can be proposed. These rules apply equally to rotina da manhã, rotina da noite
        and dias úteis.
      strict: true
      parameters:
        type: object
        properties:
          clear_fields:
            type:
              - array
              - "null"
            description: Fields to clear. Null values in other fields leave them unchanged.
            items:
              type: string
              enum:
                - description
                - emoji
                - frequency_unit
                - end_date
                - due_time
                - due_end_time
          habit_id:
            type: string
          start_date:
            type:
              - string
              - "null"
            description: YYYY-MM-DD recurrence anchor.
          parent_habit_id:
            type:
              - string
              - "null"
            description: Existing parent ID.
          clear_parent:
            type:
              - boolean
              - "null"
          tag_ids:
            type:
              - array
              - "null"
            items:
              type: string
          goal_ids:
            type:
              - array
              - "null"
            items:
              type: string
          title:
            type:
              - string
              - "null"
          description:
            type:
              - string
              - "null"
            description: New description. Use clear_fields to clear description.
          emoji:
            type:
              - string
              - "null"
            description: Emoji used as the habit icon. Use clear_fields to clear.
          frequency_unit:
            type:
              - string
              - "null"
            description: New recurrence unit. Clear frequency_unit via clear_fields for a one-time task.
            enum:
              - Day
              - Week
              - Month
              - Year
              - null
          frequency_quantity:
            type:
              - integer
              - "null"
            description: New frequency quantity
          interval_weeks:
            type:
              - integer
              - "null"
            description: Repeat interval in weeks, minimum 1.
          days:
            type:
              - array
              - "null"
            items:
              type: string
              enum:
                - Sunday
                - Monday
                - Tuesday
                - Wednesday
                - Thursday
                - Friday
                - Saturday
          due_date:
            type:
              - string
              - "null"
            description: New due date (YYYY-MM-DD)
          end_date:
            type:
              - string
              - "null"
            description: YYYY-MM-DD cutoff; clear via clear_fields.
          due_time:
            type:
              - string
              - "null"
            description: New due time (HH:mm). Use clear_fields to clear.
          due_end_time:
            type:
              - string
              - "null"
            description: End time or deadline (HH:mm). Use clear_fields to clear.
          is_general:
            type:
              - boolean
              - "null"
            description: General habit without a schedule. Children must match their parent.
          slip_alert_enabled:
            type:
              - boolean
              - "null"
            description: Enable slip alerts. Requires Pro.
          relative_reminders:
            type:
              - array
              - "null"
            description: "Reminders relative to due_time: minutes_before, or when (day_before/same_day) and time (HH:mm). Empty
              array clears them."
            items:
              type: object
              properties:
                minutes_before:
                  type:
                    - integer
                    - "null"
                when:
                  type:
                    - string
                    - "null"
                  enum:
                    - day_before
                    - same_day
                    - null
                time:
                  type:
                    - string
                    - "null"
              required:
                - minutes_before
                - when
                - time
              additionalProperties: false
          is_bad_habit:
            type:
              - boolean
              - "null"
            description: "Use is_bad_habit=true only for ongoing reduction or slip tracking, named for the behaviour itself: Fumar,
              Tomar multivitamínico, Smoking, Drinking soda. For quero parar de fumar or I want to drink less soda,
              choose that avoid form. A temporary or dated abstinence is a positive commitment, is_bad_habit=false,
              named Não tomar multivitamínico or Don't take multivitamins, once or within its explicit date range. Keep
              the requested action and negation in temporary commitment titles: don't go to Muay Thai becomes Don't go
              to Muay Thai, and não ir ao Muay Thai becomes Não ir ao Muay Thai. Never replace these with Skip Muay
              Thai, Pular Muay Thai or a generic preparation label. Never combine an avoid type with a negated name:
              não, sem, parar de, evitar, don't, stop, avoid."
          is_flexible:
            type:
              - boolean
              - "null"
            description: True for window-based tracking. Cannot have days set.
          reminder_enabled:
            type:
              - boolean
              - "null"
            description: Enable or disable reminders
          reminder_times:
            type:
              - array
              - "null"
            description: Minutes before due_time.
            items:
              type: integer
          checklist_items:
            type:
              - array
              - "null"
            description: Replace checklist items
            items:
              type: object
              properties:
                text:

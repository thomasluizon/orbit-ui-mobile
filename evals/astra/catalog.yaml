apiCommit: 1a9c6aed182cef751d4aecf52cebe31b52e55542
offerTools:
  - type: function
    writes: false
    sensitiveFields: []
    function:
      name: ask
      description: "Ask for missing input with a choice, a pick list for a bulk preview, or a multi-field question form. Read
        account data first. Only a valid, accepted ask ends the reply. Never request approval or repeat a preview
        question. Do not call ask for a clear request you can act on, including a batch of dated items or a request to
        show habits and goals. Null fields are absent; form question requires nonempty questions. An explicit request
        for the person to choose habits requires ask, even with one candidate. Use pickList for selecting habits to log
        or skip, with action and items; it prepares no write. For a single choice among existing records, use form
        choice with top-level question and options, even when form question is supported. Reserve form question for
        multiple fields. If the change is also missing, ask for both target and change in the choice question with
        allowFreeText=true. Use only a form the client supports. Put the selected form and its fields inside input. A
        single discrete selection always uses ask form choice with top-level question and options, including when the
        question also requests a free-text change. Reserve form question for multiple separate input fields. Duplicate
        targets: A singular name matching duplicate titles remains unresolved even when the account index contains every
        matching ID. Call query_habits with search and for_selection=true, then ask with form choice; never pass all
        matching IDs to bulk_log_habits or any other bulk write. A habit identified by id or by an exact unique title is
        resolved. Different actions on different identified habits are not ambiguous. Ask only for input that is still
        missing after reading account data. In a compound request, call the independent write tools before ask so their
        approval preview appears beside the question; withhold only changes that depend on the answer. Never ask the
        person to choose again between already identified targets. A single pick uses choice even when it has a heading;
        use question for two or more fields. A request for a restart plan after missed habits is already actionable:
        propose the plan yourself. Never call ask or request a choice, pick list, count or scheduling preference before
        the restart preview. The person can approve, edit or reject that preview. Before a successful typed account read
        in this turn, ask is unavailable unless a create tool returned a typed missing-field result for a new habit
        draft. Submit the requested draft to its create tool first, preserving unspecified fields as null; do not invent
        missing values to avoid that result. Then ask only for the returned missing_field of its draft_call_id. Never
        create a draft for advice, a reminder, an existing record, a preference or a check-in. Read account records to
        resolve those requests; when the read answers the request, return it with orbit_read_complete=true and do not
        ask."
      strict: true
      parameters:
        type: object
        properties:
          orbit_read_complete:
            type: boolean
            description: True when all reads in this round fully answer the request, including compound reads and readable fallback
              text; false for prerequisite lookups or any remaining read or write.
          orbit_dismissed_offer_keys:
            type:
              - array
              - "null"
            maxItems: 100
            description: Exact keys from previously_issued_offers dismissed by the person in this turn. Empty when none.
            items:
              type: string
          input:
            anyOf:
              - type: object
                properties:
                  form:
                    type: string
                    enum:
                      - choice
                    description: choice requires a nonempty question and 2 to 4 options; omit items, action, questions and progress.
                      pickList requires nonempty title, action and 1 to 10 items; omit options, questions and progress,
                      and set allowFreeText=false. question requires 1 to 10 questions; omit top-level options, items
                      and action and set multiSelect=false. A single record selection uses choice; reserve question for
                      multiple fields. Use only a supported form.
                  missing_input:
                    $ref: "#/$defs/shared1"
                  question:
                    type: string
                    description: Required nonempty question for choice, at most 120 characters. Use null for other forms.
                    pattern: \S
                  options:
                    type: array
                    description: Required for choice. Null means absent for other forms.
                    minItems: 2
                    maxItems: 4
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Nonempty unique option id.
                        label:
                          type: string
                          description: Nonempty option label, at most 20 characters.
                        description:
                          type:
                            - string
                            - "null"
                          description: Supporting text, at most 24 characters. Null means absent.
                      required:
                        - id
                        - label
                        - description
                      additionalProperties: false
                  multiSelect:
                    type:
                      - boolean
                      - "null"
                    description: For choice only; null means false. pickList always selects multiple items; question requires false or null.
                  allowFreeText:
                    type:
                      - boolean
                      - "null"
                    description: For choice only; null means false. Must be false for pickList. In form question, each questions entry
                      controls its own allowFreeText; this top-level value is ignored.
                  draft_call_id:
                    anyOf:
                      - $ref: "#/$defs/shared2"
                      - type: "null"
                  missing_field:
                    anyOf:
                      - $ref: "#/$defs/shared3"
                      - type: "null"
                required:
                  - form
                  - missing_input
                  - question
                  - options
                  - multiSelect
                  - allowFreeText
                  - draft_call_id
                  - missing_field
                additionalProperties: false
              - type: object
                properties:
                  form:
                    type: string
                    enum:
                      - pickList
                    description: choice requires a nonempty question and 2 to 4 options; omit items, action, questions and progress.
                      pickList requires nonempty title, action and 1 to 10 items; omit options, questions and progress,
                      and set allowFreeText=false. question requires 1 to 10 questions; omit top-level options, items
                      and action and set multiSelect=false. A single record selection uses choice; reserve question for
                      multiple fields. Use only a supported form.
                  missing_input:
                    $ref: "#/$defs/shared1"
                  title:
                    type: string
                    description: Required nonempty heading for pickList; optional heading of at most 120 characters for question. Null means
                      absent.
                    pattern: \S
                  action:
                    type: string
                    enum:
                      - create_habits
                      - log_habits
                      - skip_habits
                    description: Required bulk action for pickList. Null means absent for other forms.
                  items:
                    type: array
                    description: Required for pickList. Null means absent for other forms.
                    minItems: 1
                    maxItems: 10
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Nonempty unique item id.
                        label:
                          type: string
                          description: Nonempty item label.
                        detail:
                          type:
                            - string
                            - "null"
                          description: Supporting text, at most 24 characters. Null means absent.
                        arguments:
                          description: For create_habits, a JSON string containing only the supplied fields of one bulk_create_habits item,
                            including title; omit unspecified fields and nulls. For log_habits/skip_habits, an object
                            with only habit_id and date (YYYY-MM-DD). Never repeat the full create schema or pad
                            arguments with whitespace.
                          anyOf:
                            - type: string
                            - type: object
                              properties:
                                habit_id:
                                  type: string
                                date:
                                  type: string
                              required:
                                - habit_id
                                - date
                              additionalProperties: false
                      required:
                        - id
                        - label
                        - detail
                        - arguments
                      additionalProperties: false
                  draft_call_id:
                    anyOf:
                      - $ref: "#/$defs/shared2"
                      - type: "null"
                  missing_field:
                    anyOf:
                      - $ref: "#/$defs/shared3"
                      - type: "null"
                required:
                  - form
                  - missing_input
                  - title
                  - action
                  - items
                  - draft_call_id
                  - missing_field
                additionalProperties: false
              - type: object
                properties:
                  form:
                    type: string
                    enum:
                      - question
                    description: choice requires a nonempty question and 2 to 4 options; omit items, action, questions and progress.
                      pickList requires nonempty title, action and 1 to 10 items; omit options, questions and progress,
                      and set allowFreeText=false. question requires 1 to 10 questions; omit top-level options, items
                      and action and set multiSelect=false. A single record selection uses choice; reserve question for
                      multiple fields. Use only a supported form.
                  missing_input:
                    $ref: "#/$defs/shared1"
                  questions:
                    type: array
                    description: Required for question only. Use unique nonempty question ids. singleChoice and multipleChoice require 2 to
                      10 options even with allowFreeText=true. scale requires lowLabel and highLabel. slider requires
                      min, max, step and unit. yesNo has no options. Null means absent and is allowed only for other
                      forms. Use null for fields belonging to another question type.
                    minItems: 1
                    maxItems: 10
                    items:
                      anyOf:
                        - type: object
                          properties:
                            type:
                              type: string
                              enum:
                                - singleChoice
                            id:
                              type: string
                              description: Nonempty unique question id, at most 80 characters.
                              pattern: \S
                            prompt:
                              type: string
                              description: Nonempty prompt, at most 500 characters.
                              pattern: \S
                            options:
                              $ref: "#/$defs/shared5"
                            allowFreeText:
                              anyOf:
                                - $ref: "#/$defs/shared6"
                                - type: "null"
                          required:
                            - type
                            - id
                            - prompt
                            - options
                            - allowFreeText
                          additionalProperties: false
                        - type: object
                          properties:
                            type:
                              type: string
                              enum:
                                - multipleChoice
                            id:
                              type: string
                              description: Nonempty unique question id, at most 80 characters.
                              pattern: \S
                            prompt:
                              type: string
                              description: Nonempty prompt, at most 500 characters.
                              pattern: \S
                            options:
                              $ref: "#/$defs/shared5"
                            allowFreeText:
                              anyOf:
                                - $ref: "#/$defs/shared6"
                                - type: "null"
                          required:
                            - type
                            - id
                            - prompt
                            - options
                            - allowFreeText
                          additionalProperties: false
                        - type: object
                          properties:
                            type:
                              type: string
                              enum:
                                - scale
                            id:
                              type: string
                              description: Nonempty unique question id, at most 80 characters.
                              pattern: \S
                            prompt:
                              type: string
                              description: Nonempty prompt, at most 500 characters.
                              pattern: \S
                            lowLabel:
                              type: string
                              description: Required nonempty label for 1 on a scale, at most 120 characters. Use null for other types.
                              pattern: \S
                            highLabel:
                              type: string
                              description: Required nonempty label for 5 on a scale, at most 120 characters. Use null for other types.
                              pattern: \S
                          required:
                            - type
                            - id
                            - prompt
                            - lowLabel
                            - highLabel
                          additionalProperties: false
                        - type: object
                          properties:
                            type:
                              type: string
                              enum:
                                - slider
                            id:
                              type: string
                              description: Nonempty unique question id, at most 80 characters.
                              pattern: \S
                            prompt:
                              type: string
                              description: Nonempty prompt, at most 500 characters.
                              pattern: \S
                            min:
                              type: number
                              minimum: -1000000000
                              maximum: 1000000000
                              description: Required slider lower bound. Use null for other types.
                            max:
                              type: number
                              minimum: -1000000000
                              maximum: 1000000000
                              description: Required slider upper bound, greater than min. Use null for other types.
                            step:
                              type: number
                              description: Required positive slider step dividing max minus min exactly. Use null for other types.
                            unit:
                              type: string
                              description: Required nonempty slider unit in the person's language, at most 24 characters. Use null for other types.
                              pattern: \S
                          required:
                            - type
                            - id
                            - prompt
                            - min
                            - max
                            - step
                            - unit
                          additionalProperties: false
                        - type: object
                          properties:
                            type:
                              type: string
                              enum:
                                - yesNo
                            id:
                              type: string
                              description: Nonempty unique question id, at most 80 characters.
                              pattern: \S
                            prompt:
                              type: string
                              description: Nonempty prompt, at most 500 characters.
                              pattern: \S
                            allowFreeText:
                              anyOf:
                                - $ref: "#/$defs/shared6"
                                - type: "null"
                          required:
                            - type
                            - id
                            - prompt
                            - allowFreeText
                          additionalProperties: false
                  title:
                    type:
                      - string
                      - "null"
                    description: Required nonempty heading for pickList; optional heading of at most 120 characters for question. Null means
                      absent.
                  intro:
                    type:
                      - string
                      - "null"
                    description: Optional nonempty introduction of at most 500 characters for question only. Use null for choice and
                      pickList.
                  progress:
                    type:
                      - object
                      - "null"
                    description: For question only. Requires 0 <= current <= total and total >= 1. Null means absent.
                    properties:
                      current:
                        type: integer
                        minimum: 0
                      total:
                        type: integer
                        minimum: 1
                    required:
                      - current
                      - total
                    additionalProperties: false
                  draft_call_id:
                    anyOf:
                      - $ref: "#/$defs/shared2"
                      - type: "null"
                  missing_field:
                    anyOf:
                      - $ref: "#/$defs/shared3"
                      - type: "null"
                required:
                  - form
                  - missing_input
                  - questions
                  - title
                  - intro
                  - progress
                  - draft_call_id
                  - missing_field
                additionalProperties: false
        required:
          - orbit_read_complete
          - orbit_dismissed_offer_keys
          - input
        $defs:
          shared1:
            type: string
            enum:
              - habit_setup
              - preference
              - check_in
              - record_selection
              - bulk_selection
            description: "Identify input only the person can supply: habit_setup, preference, check_in, record_selection for one
              existing record, or bulk_selection for several existing records. Record and bulk selection require
              query_habits with for_selection=true earlier in this turn. Resolve an earlier Astra message from history;
              never ask which message it was."
          shared2:
            type: string
            description: Copy the typed missing-field result's draft_call_id when asking about a new habit draft; otherwise null.
          shared3:
            type: string
            description: Copy that draft's missing_field exactly and ask only for that field; otherwise null.
          shared4:
            type: object
            properties:
              id:
                type: string
                description: Nonempty option id, at most 80 characters.
              label:
                type: string
                description: Nonempty label, at most 120 characters.
              recommended:
                type:
                  - boolean
                  - "null"
                description: At most one recommended option, only for singleChoice. Null means false.
            required:
              - id
              - label
              - recommended
            additionalProperties: false
          shared5:
            type: array
            description: Required for singleChoice and multipleChoice. Null means absent for scale, slider and yesNo. Option ids
              must be unique within the question.
            minItems: 2
            maxItems: 10
            items:
              $ref: "#/$defs/shared4"
          shared6:
            type: boolean
            description: Allow a custom answer for singleChoice, multipleChoice, or yesNo. Null means false; must be false or null
              for scale and slider.
        additionalProperties: false
  - type: function
    writes: true
    sensitiveFields: []
    function:
      name: assign_tags
      description: Replace requested habit tags using names (reuse or create) or existing IDs. Include current tags when
        adding; an empty list removes all.
      strict: true
      parameters:
        type: object
        properties:
          orbit_write_complete:
            type: boolean
            description: True only when every requested mutation has its matching write call in this round; a read status never
              fulfills a write. False when a lookup or dependent action is still needed.
          orbit_dismissed_offer_keys:
            type:
              - array
              - "null"
            maxItems: 100
            description: Exact keys from previously_issued_offers dismissed by the person in this turn. Empty when none.
            items:
              type: string
          habit_id:
            type:
              - string
              - "null"
          habit_ids:
            type:
              - array
              - "null"
            items:
              type: string
            description: IDs of all existing habits to tag in one approval. Use instead of habit_id for multiple habits.
          tag_names:
            type:
              - array
              - "null"
            description: Names to reuse or create.
            items:
              type: string
          tag_ids:
            type:
              - array
              - "null"
            description: Existing tag IDs; empty clears all tags.
            items:
              type: string
        required:
          - orbit_write_complete
          - orbit_dismissed_offer_keys
          - habit_id
          - habit_ids
          - tag_names
          - tag_ids
        additionalProperties: false
  - type: function
    writes: true
    sensitiveFields: []
    function:
      name: bulk_create_habits
      description: Create multiple habits with inline sub-habits. Organize an unstructured message into one combined approval
        preview of tasks and habits. Include every proposed item in habits; reuse an existing activity with habit_id and
        only its requested changes. Use query_habits for reuse and suggest_habits for requested ideas; calendars, habit
        months, profile and analytics are not needed. Finish those reads in earlier rounds before this call. Never
        submit a partial preview alongside a read. Reused items keep the stored title verbatim. Copy selected suggestion
        draft fields unchanged, including empty arrays and reminder settings; never invent quantities or activities. The
        preview groups items by habitType and is the entire answer, without separate read blocks. Nothing is saved
        before approval.
      strict: true
      parameters:
        type: object
        properties:
          orbit_write_complete:
            type: boolean
            description: True only when every requested mutation has its matching write call in this round; a read status never
              fulfills a write. False when a lookup or dependent action is still needed.
          orbit_dismissed_offer_keys:
            type:
              - array
              - "null"
            maxItems: 100
            description: Exact keys from previously_issued_offers dismissed by the person in this turn. Empty when none.
            items:
              type: string
          parent_habit_id:
            type:
              - string
              - "null"
            description: Existing parent habit ID. When supplied, create the items as children of this habit, never create the
              parent again.
          habits:
            type: array
            description: The complete set of habits to create.
            items:
              $ref: "#/$defs/habit"
        required:
          - orbit_write_complete
          - orbit_dismissed_offer_keys
          - parent_habit_id
          - habits
        $defs:
          habit:
            type: object
            properties:
              suggested_fields:
                type:
                  - array
                  - "null"
                description: Names of unrequested configured fields, following the offer instructions in the system prompt.
                maxItems: 25
                items:
                  type: string
              title:
                type: string
                description: Keep the person's medical instruction wording; normalize only spelling and casing, without substituting the
                  action or negation.
              description:
                type:
                  - string
                  - "null"
              emoji:
                type:
                  - string
                  - "null"
                description: Emoji icon. Pick a relevant one when clear.
              frequency_unit:
                type:
                  - string
                  - "null"
                description: OneTime for a single dated action or deadline-only item. Ongoing avoid habits default to Day/1 unless
                  another cadence was requested. A restriction starting before an event, including a 24-hour
                  restriction, uses Day with frequency_quantity=1, due_date at its start and inclusive end_date on the
                  event; never OneTime on its first day.
                enum:
                  - Day
                  - Week
                  - Month
                  - Year
                  - OneTime
                  - null
              frequency_quantity:
                type:
                  - integer
                  - "null"
                description: How often. Defaults to 1.
              interval_weeks:
                type:
                  - integer
                  - "null"
                description: Repeat interval in weeks. Omit for every week. Minimum 1.
              days:
                type:
                  - array
                  - "null"
                description: Specific weekdays. Only when frequency_quantity is 1.
                items:
                  type: string
                  enum:
                    - Sunday
                    - Monday
                    - Tuesday
                    - Wednesday
                    - Thursday
                    - Friday
                    - Saturday
              due_date:
                type:
                  - string
                  - "null"
                description: YYYY-MM-DD. For a restriction's start, subtract its own offset from its referenced event's local date and
                  time. A deadline-only item uses the event date with due_end_time at the event, never another
                  preparation's start date. Otherwise defaults to today.
              end_date:
                type:
                  - string
                  - "null"
                description: YYYY-MM-DD, inclusive. A restriction starting before an event, including a 24-hour restriction, must end on
                  that event's date with Day/1, never null. Omit or null for OneTime events and deadline-only items.
              due_time:
                type:
                  - string
                  - "null"
                description: HH:mm. Suggestion times with zero seconds are accepted as HH:mm:ss.
              due_end_time:
                type:
                  - string
                  - "null"
                description: HH:mm end time or deadline. Suggestion times with zero seconds are accepted as HH:mm:ss. A deadline-only
                  item that ends at an event uses that event's clock time, with due_date on the event date. A
                  restriction starting before the event keeps its own start due_date and its inclusive end_date on the
                  event. Leave due_time absent or null when no start time was supplied; do not drop a supplied
                  collection deadline.
              is_bad_habit:
                type:
                  - boolean
                  - "null"
                description: True for ongoing reduction or slip tracking, with Day/1 unless another cadence was requested. False for a
                  temporary medical commitment.
              is_general:
                type:
                  - boolean
                  - "null"
                description: No schedule or avoid type. Must be false for an ongoing avoid habit. Defaults to false.
              is_flexible:
                type:
                  - boolean
                  - "null"
                description: Window-based tracking. Requires frequency_unit.
              checklist_items:
                type:
                  - array
                  - "null"
                description: Atomic sub-steps done together in one execution.
                items:
                  type: object
                  properties:
                    text:
                      type: string
                    is_checked:
                      type:
                        - boolean
                        - "null"
                      description: "Default: false."
                  required:
                    - text
                    - is_checked
                  additionalProperties: false
              start_date:
                type:
                  - string
                  - "null"
                description: YYYY-MM-DD recurrence anchor. Also set due_date to the requested first date so it is visible in the
                  approval preview.
              placement:
                type:
                  - string
                  - "null"
                enum:
                  - sub_habit
                  - checklist_item
                  - new_parent
                  - null
                description: Optional explicit placement choice for an addition to parent_habit_id. Omit to use the server
                  recommendation. Preserve every other proposal field when switching.
              reminder_enabled:
                type:
                  - boolean
                  - "null"
              reminder_times:
                type:
                  - array
                  - "null"
                items:
                  type: integer
              scheduled_reminders:
                type:
                  - array
                  - "null"
                description: Absolute-time reminders for habits WITHOUT a due_time
                items:
                  type: object
                  properties:
                    when:
                      type: string
                      enum:
                        - day_before
                        - same_day
                    time:
                      type: string
                      description: HH:mm 24h format
                  required:
                    - when
                    - time
                  additionalProperties: false
              relative_reminders:
                type:
                  - array
                  - "null"
                description: "Reminders relative to due_time: minutes_before, or when (day_before/same_day) and time (HH:mm). Empty
                  array clears them."
                items:
                  type: object
                  properties:
                    minutes_before:
                      type:
                        - integer
                        - "null"
                    when:
                      type:
                        - string
                        - "null"
                      enum:
                        - day_before
                        - same_day
                        - null
                    time:
                      type:
                        - string
                        - "null"
                  required:
                    - minutes_before
                    - when
                    - time
                  additionalProperties: false
              repeat_reminder:
                type:
                  - object
                  - "null"
                description: Repeat from the latest dose across midnight. Replaces other reminders. Allowed on every habit and task
                  schedule. Notify only while due today or overdue, or while General. Stop scheduled reminders for the
                  local day after completion or skip, and always respect the end date. General follows its own
                  completion state. When no daily target was requested, use General with no frequency, and do not derive
                  a target from the reminder interval. Keep doctor-prescribed fixed clock times in scheduled_reminders.
                properties:
                  interval_minutes:
                    type: integer
                    enum:
                      - 15
                      - 20
                      - 30
                      - 45
                      - 60
                      - 120
                      - 180
                      - 240
                      - 300
                      - 360
                      - 420
                      - 480
                      - 540
                      - 600
                      - 660
                      - 720
                      - 780
                      - 840
                      - 900
                      - 960
                      - 1020
                      - 1080
                      - 1140
                      - 1200
                      - 1260
                      - 1320
                      - 1380
                  active_start:
                    type:
                      - string
                      - "null"
                    description: Optional local HH:mm; supply active_end too. May cross midnight. Omit both for all day.
                  active_end:
                    type:
                      - string
                      - "null"
                    description: Optional local HH:mm, paired with active_start.
                  start_at_utc:
                    type:
                      - string
                      - "null"
                    description: Optional ISO 8601 UTC instant before the first dose. Defaults to when the change is saved.
                required:
                  - interval_minutes
                  - active_start
                  - active_end
                  - start_at_utc
                additionalProperties: false
              slip_alert_enabled:
                type:
                  - boolean
                  - "null"
              tag_names:
                type:
                  - array
                  - "null"
                items:
                  type: string
              habit_id:
                type:
                  - string
                  - "null"
                description: The stored habit ID from query_habits or existingHabitId from suggest_habits. Required for reuse. Keep its
                  stored title verbatim; supply only requested changes and leave other fields null. Null means a new
                  activity.
              tag_ids:
                type:
                  - array
                  - "null"
                items:
                  type: string
              goal_ids:
                type:
                  - array
                  - "null"
                items:
                  type: string

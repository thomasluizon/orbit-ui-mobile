# The core set of the Orbit AI eval gate: 20 situations, each in 3 frozen phrasings, each in English and pt-BR (120 cases).
# A phrasing never changes after the owner reads it: a changed phrasing changes `phrasingDigest`, and two reports with
# different digests cannot be merged or compared. Add a situation; do not edit a phrasing.
#
# family        owner-turns (every real owner turn on record), defect-classes (one situation for each class of the
#               defect table), same-title (the same-titled sub-habit family).
# defectClass   the class of the defect table that the situation guards (a1 to l).
# mustPass      true runs at k=3 and passes only when all 3 attempts pass. false runs at k=1.
# fixture       a fixture of fixtures/reset.mjs. The records a case can name: pro, composition: water, walk.
#               same-title-children: parent, children (in list order), walk. duplicate-titles: first, second.
# prefix        recorded messages the client already holds when the person sends the phrasing.
# expected      the outcome. questions: how many replies without a preview may come before the preview.
#               changes: the normalized change list of the held previews (kind, target records, changed fields).
#               previews: how many previews hold the request (default 1). read: the rubric for the text of a read answer.
# answer        what the person decides when the assistant asks. A card takes the answer through blockAnswer; `text` is
#               typed when no card can hold it.
# A write case that passes its preview is approved, and the saved state is read back.

exchanges:
  # The Water conversation of the owner, 12 November 2026. The person's messages and the second and fourth assistant
  # messages are the recorded text. The first and third assistant messages were cards whose question text is not on
  # record: the first is the owner's own report of the question, the third restates its recorded answer option.
  water:
    pt-BR:
      - { role: user, content: 'eu tenho 7 habitos chamados Water - 710ml deleta dois desses, e os outros 4 coloca Water - 1.18L' }
      - { role: assistant, content: 'Eu excluo os dois últimos ou os dois primeiros? Mantém quais?' }
      - { role: user, content: '4 primeiros' }
      - { role: assistant, content: 'Quais 2 dos 6 hábitos você quer excluir?' }
      - { role: user, content: 'ja respondi isos, eu falei pra manter os 4 primeiros, isso significa q é pra excluir os 2 ultimos' }
      - { role: assistant, content: 'Você quer excluir os 2 últimos?' }
      - { role: user, content: 'Sim, últimos 2' }
      - { role: assistant, content: 'Qual hábito você quer usar para “Water 710ml”?' }
    en:
      - { role: user, content: 'i have 7 habits called Water - 710ml delete two of them, and change the other 4 to Water - 1.18L' }
      - { role: assistant, content: 'Do I delete the last two or the first two? Which ones do you keep?' }
      - { role: user, content: 'first 4' }
      - { role: assistant, content: 'Which 2 of the 6 habits do you want to delete?' }
      - { role: user, content: 'i already answered that, i said keep the first 4, that means delete the last 2' }
      - { role: assistant, content: 'Do you want to delete the last 2?' }
      - { role: user, content: 'Yes, last 2' }
      - { role: assistant, content: 'Which habit would you like to use for “Water 710ml”?' }

situations:
  # Owner turns. Phrasing 1 in pt-BR is the owner's message, letter for letter.
  - id: owner-water-request
    family: owner-turns
    defectClass: b
    mustPass: true
    fixture: same-title-children
    platform: web
    expected:
      questions: { max: 1 }
      changes:
        - { kind: delete, targets: { of: children, count: 2, whenAnswered: [4, 5] } }
        - { kind: update, targets: { of: children, count: 4, whenAnswered: [0, 1, 2, 3] }, fields: { title: 'Water - 1.18L' } }
    answer:
      sameTitle: { deleted: [4, 5], renamed: [0, 1, 2, 3] }
      text: { en: 'Delete the last 2 and rename the first 4', pt-BR: 'Exclui os 2 últimos e renomeia os 4 primeiros' }
    phrasings:
      pt-BR:
        - 'eu tenho 7 habitos chamados Water - 710ml deleta dois desses, e os outros 4 coloca Water - 1.18L'
        - 'tenho uns habitos Water - 710ml repetidos, apaga dois e renomeia os outros quatro pra Water - 1.18L'
        - 'dos meus Water - 710ml, exclui 2 e muda o nome dos outros 4 pra Water - 1.18L'
      en:
        - 'i have 7 habits called Water - 710ml delete two of them, and change the other 4 to Water - 1.18L'
        - 'I have a bunch of repeated Water - 710ml habits. Delete two and rename the other four to Water - 1.18L'
        - 'Out of my Water - 710ml habits, remove 2 and rename the remaining 4 to Water - 1.18L'

  - id: owner-water-choice
    family: owner-turns
    defectClass: c
    mustPass: true
    fixture: same-title-children
    platform: web
    prefix: { exchange: water, messages: 2 }
    expected: &lastTwoFirstFour
      changes:
        - { kind: delete, targets: { of: children, positions: [4, 5] } }
        - { kind: update, targets: { of: children, positions: [0, 1, 2, 3] }, fields: { title: 'Water - 1.18L' } }
    phrasings:
      pt-BR: ['4 primeiros', 'os 4 primeiros', 'mantém os quatro primeiros']
      en: ['first 4', 'the first 4', 'keep the first four']

  - id: owner-water-typed-answer
    family: owner-turns
    defectClass: e
    mustPass: true
    fixture: same-title-children
    platform: web
    prefix: { exchange: water, messages: 4 }
    expected: *lastTwoFirstFour
    phrasings:
      pt-BR:
        - 'ja respondi isos, eu falei pra manter os 4 primeiros, isso significa q é pra excluir os 2 ultimos'
        - 'eu ja falei: fica com os 4 primeiros, entao apaga os 2 ultimos'
        - 'isso eu ja respondi, os 4 primeiros ficam e os 2 ultimos saem'
      en:
        - 'i already answered that, i said keep the first 4, that means delete the last 2'
        - 'I told you already: keep the first 4, so delete the last 2'
        - 'I answered this already, the first 4 stay and the last 2 go'

  - id: owner-water-confirmation
    family: owner-turns
    defectClass: e
    mustPass: true
    fixture: same-title-children
    platform: web
    prefix: { exchange: water, messages: 6 }
    expected: *lastTwoFirstFour
    phrasings:
      pt-BR: ['Sim, últimos 2', 'sim, os 2 últimos', 'isso, apaga os dois últimos']
      en: ['Yes, last 2', 'yes, the last 2', 'right, delete the last two']

  - id: owner-water-full-repeat
    family: owner-turns
    defectClass: a1
    mustPass: true
    fixture: same-title-children
    platform: web
    prefix: { exchange: water, messages: 8 }
    expected: *lastTwoFirstFour
    phrasings:
      pt-BR:
        - '???? caralho cara, eu pedi uma coisa muito simples 2 ultimos habitos vc deleta 4 primeiros habitos chamados water 710ml vc muda pra Water - 1.18L qual a dificuldade?'
        - 'cara, é simples: deleta os 2 ultimos water 710ml e muda os 4 primeiros pra Water - 1.18L'
        - 'de novo: os 2 ultimos habitos water 710ml vc apaga, os 4 primeiros vc renomeia pra Water - 1.18L'
      en:
        - '???? come on man, i asked for something very simple the last 2 habits you delete the first 4 habits called water 710ml you change to Water - 1.18L what is so hard?'
        - 'look, it is simple: delete the last 2 water 710ml and change the first 4 to Water - 1.18L'
        - 'again: delete the last 2 water 710ml habits and rename the first 4 to Water - 1.18L'

  # The image turn of 5 November 2026: a phone screenshot of a cinema ticket (Cinesystem Pompéia, Cara-De-Barro,
  # session 07/11 at 21:15, room 5, seats H 10 and H 9) with the message "cria pra mim". The image is a drawn copy
  # with the same lines; the owner's screenshot is not in the repository.
  - id: owner-image-create
    family: owner-turns
    defectClass: f
    mustPass: true
    fixture: pro
    platform: mobile
    image: cinema-ticket.png
    expected:
      changes:
        - kind: create
          fields:
            title: { contains: [cara de barro, cinema, cinesystem, filme, movie] }
            due_date: { monthDay: '11-07' }
            due_time: { time: '21:15' }
    phrasings:
      pt-BR: ['cria pra mim', 'cria isso pra mim', 'coloca isso no app pra mim']
      en: ['create it for me', 'create this for me', 'add this to the app for me']

  # One situation for each defect class that no owner turn guards.
  - id: ask-which-duplicate
    family: defect-classes
    defectClass: a2
    mustPass: true
    fixture: duplicate-titles
    platform: web
    expected:
      questions: { min: 1, max: 1 }
      changes:
        - { kind: log, targets: { record: second } }
    answer:
      pick: second
      text: { en: 'The second one in the list', pt-BR: 'A segunda da lista' }
    phrasings:
      en: ['Mark the walk as done', 'I did my walk today, log it', 'Check off Walk for today']
      pt-BR: ['Marca a caminhada como feita', 'fiz a caminhada hoje, registra pra mim', 'dá check na Caminhada de hoje']

  - id: read-today
    family: defect-classes
    defectClass: d
    mustPass: true
    fixture: pro
    platform: mobile
    expected:
      read:
        en: The account holds exactly two daily habits, Water and Walk, both due today and not completed. The answer shows both habits as due today and not completed, in a block or in text. It adds no other habit, completion or statistic, and it asks no question. The text that the assistant wrote is in English.
        pt-BR: The account holds exactly two daily habits, Beber água and Caminhada, both due today and not completed. The answer shows both habits as due today and not completed, in a block or in text. It adds no other habit, completion or statistic, and it asks no question. The text that the assistant wrote is in Brazilian Portuguese.
    phrasings:
      en: ['What habits do I have today?', "what's on my list for today", "Show me today's habits"]
      pt-BR: ['Quais hábitos eu tenho hoje?', 'o que tem pra hoje?', 'me mostra os hábitos de hoje']

  - id: log-one
    family: defect-classes
    defectClass: g
    mustPass: true
    fixture: pro
    platform: mobile
    expected:
      changes:
        - { kind: log, targets: { record: water } }
    phrasings:
      en: ['I drank my water, mark it done', 'Log Water for today', 'done with Water today']
      pt-BR: ['bebi minha água, marca como feito', 'Registra Beber água hoje', 'já fiz o Beber água hoje']

  - id: create-tomorrow-at-three
    family: defect-classes
    defectClass: h
    mustPass: true
    fixture: pro
    platform: web
    expected:
      changes:
        - kind: create
          fields:
            title: { contains: [dentist] }
            due_date: { daysFromToday: 1 }
            due_time: { time: '15:00' }
    phrasings:
      en: ['Add a dentist appointment tomorrow at 3pm', 'Create a task Dentist for tomorrow, 15:00', 'remind me: dentist tomorrow 3 in the afternoon']
      pt-BR: ['Adiciona dentista amanhã às 15h', 'Cria uma tarefa Dentista pra amanhã, 15:00', 'marca aí: dentista amanhã 3 da tarde']

  - id: read-seven-day-count
    family: defect-classes
    defectClass: i
    mustPass: true
    fixture: composition
    platform: web
    expected:
      read:
        en: The account holds exactly 5 completions of the habit Water in the last seven days. The answer states 5 as the count for Water, in a block or in text. It states no other count for Water, adds no statistic that the evidence does not hold, and asks no question. The text that the assistant wrote is in English.
        pt-BR: The account holds exactly 5 completions of the habit Beber água in the last seven days. The answer states 5 as the count for Beber água, in a block or in text. It states no other count for Beber água, adds no statistic that the evidence does not hold, and asks no question. The text that the assistant wrote is in Brazilian Portuguese.
    phrasings:
      en: ['How many times did I complete Water in the last 7 days?', 'how many days did I do Water over the past 7 days', 'Count my Water completions for the last seven days']
      pt-BR: ['Quantas vezes eu concluí Beber água nos últimos 7 dias?', 'quantos dias eu fiz o Beber água nos últimos 7 dias', 'Conta quantas vezes completei Beber água nos últimos sete dias']

  # Two valid paths hold this request: one preview for both habits, or one preview for each. Both grade the same.
  - id: log-both
    family: defect-classes
    defectClass: j
    mustPass: true
    fixture: pro
    platform: web
    expected:
      previews: { min: 1, max: 2 }
      changes:
        - { kind: log, targets: { records: [water, walk] } }
    phrasings:
      en: ['I did Water and Walk today, mark both done', 'Log both of my habits for today', 'water and walk are done for today']
      pt-BR: ['Fiz Beber água e Caminhada hoje, marca os dois', 'Registra meus dois hábitos de hoje', 'beber água e caminhada feitos hoje']

  # The client sends a dropped turn again with the same turn key. The second send holds no second preview.
  - id: resend-keeps-one-preview
    family: defect-classes
    defectClass: k
    mustPass: true
    fixture: pro
    platform: mobile
    resend: true
    expected:
      changes:
        - kind: create
          fields:
            title: { contains: [stretch, along] }
            frequency_unit: Day
    phrasings:
      en: ['Create a daily habit called Stretch', 'New habit: Stretch, every day', 'add Stretch as a daily habit']
      pt-BR: ['Cria um hábito diário chamado Alongar', 'Novo hábito: Alongar, todo dia', 'adiciona Alongar como hábito diário']

  - id: create-three-per-week
    family: defect-classes
    defectClass: l
    mustPass: true
    fixture: pro
    platform: web
    expected:
      changes:
        - kind: create
          fields:
            title: { contains: [read, ler, leitura] }
            frequency_unit: Week
            frequency_quantity: '3'
    phrasings:
      en: ['Create a habit Read, 3 times a week', 'I want to read three times a week, add it', 'new habit: Read, 3x per week']
      pt-BR: ['Cria um hábito Ler, 3 vezes por semana', 'quero ler três vezes por semana, adiciona aí', 'novo hábito: Ler, 3x por semana']

  # The same-title family: one parent Water with six sub-habits titled Water - 710ml.
  - id: same-title-delete-last-two
    family: same-title
    defectClass: a1
    mustPass: false
    fixture: same-title-children
    platform: web
    expected:
      changes:
        - { kind: delete, targets: { of: children, positions: [4, 5] } }
    phrasings:
      en: ['Delete the last 2 Water - 710ml habits', 'remove the last two Water - 710ml', 'Get rid of the 2 Water - 710ml at the end of the list']
      pt-BR: ['Apaga os 2 últimos Water - 710ml', 'exclui os dois últimos hábitos Water - 710ml', 'tira os 2 Water - 710ml do fim da lista']

  - id: same-title-rename-all
    family: same-title
    defectClass: a1
    mustPass: false
    fixture: same-title-children
    platform: mobile
    expected: &renameAllSix
      changes:
        - { kind: update, targets: { of: children }, fields: { title: 'Water - 1.18L' } }
    phrasings:
      en: ['Rename all the Water - 710ml habits to Water - 1.18L', 'change every Water - 710ml to Water - 1.18L', 'All my Water - 710ml habits should be called Water - 1.18L']
      pt-BR: ['Renomeia todos os Water - 710ml pra Water - 1.18L', 'muda todo Water - 710ml pra Water - 1.18L', 'Todos os meus hábitos Water - 710ml devem se chamar Water - 1.18L']

  - id: same-title-parent-match
    family: same-title
    defectClass: b
    mustPass: false
    fixture: same-title-children
    platform: web
    expected:
      questions: { max: 1 }
      changes:
        - { kind: delete, targets: { of: children, count: 2, whenAnswered: [4, 5] } }
        - { kind: update, targets: { of: children, count: 4, whenAnswered: [0, 1, 2, 3] }, fields: { title: 'Water - 1.18L' } }
    answer:
      sameTitle: { deleted: [4, 5], renamed: [0, 1, 2, 3] }
      text: { en: 'Delete the last 2 and rename the first 4', pt-BR: 'Exclui os 2 últimos e renomeia os 4 primeiros' }
    phrasings:
      en: ['I have 7 habits called Water, delete two of them and rename the other 4 to Water - 1.18L', 'of my 7 Water habits, remove 2 and rename the other 4 to Water - 1.18L', 'Water shows up 7 times: delete two, and the other four become Water - 1.18L']
      pt-BR: ['Tenho 7 hábitos chamados Water, apaga dois e renomeia os outros 4 pra Water - 1.18L', 'dos meus 7 hábitos Water, exclui 2 e renomeia os outros 4 pra Water - 1.18L', 'Water aparece 7 vezes: apaga dois, e os outros quatro viram Water - 1.18L']

  - id: same-title-count-differs
    family: same-title
    defectClass: a2
    mustPass: false
    fixture: same-title-children
    platform: web
    expected: *renameAllSix
    phrasings:
      en: ['I have 8 Water - 710ml habits, rename all of them to Water - 1.18L', 'rename my 8 Water - 710ml habits to Water - 1.18L', 'There are 8 Water - 710ml in my list, change them all to Water - 1.18L']
      pt-BR: ['Tenho 8 hábitos Water - 710ml, renomeia todos pra Water - 1.18L', 'renomeia meus 8 Water - 710ml pra Water - 1.18L', 'Tem 8 Water - 710ml na minha lista, muda todos pra Water - 1.18L']

  - id: same-title-singular
    family: same-title
    defectClass: a2
    mustPass: false
    fixture: same-title-children
    platform: web
    expected:
      questions: { min: 1, max: 1 }
      changes:
        - { kind: update, targets: { of: children, positions: [2] }, fields: { title: 'Water - 1.18L' } }
    answer:
      pick: { of: children, position: 2 }
      text: { en: 'The third one in the list', pt-BR: 'O terceiro da lista' }
    phrasings:
      en: ['Change the title of the Water - 710ml habit to Water - 1.18L', 'rename my Water - 710ml habit to Water - 1.18L', 'The Water - 710ml habit should be called Water - 1.18L']
      pt-BR: ['Muda o título do hábito Water - 710ml pra Water - 1.18L', 'renomeia meu hábito Water - 710ml pra Water - 1.18L', 'O hábito Water - 710ml deve se chamar Water - 1.18L']

  - id: same-title-delete-all
    family: same-title
    defectClass: a1
    mustPass: false
    fixture: same-title-children
    platform: mobile
    expected:
      changes:
        - { kind: delete, targets: { of: children } }
    phrasings:
      en: ['Delete all my Water - 710ml habits', 'remove every Water - 710ml habit', 'I do not want any of the Water - 710ml habits, delete them']
      pt-BR: ['Apaga todos os meus hábitos Water - 710ml', 'exclui todo hábito Water - 710ml', 'Não quero mais nenhum hábito Water - 710ml, apaga eles']

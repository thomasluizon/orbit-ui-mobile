    const doneCount = d => { let n = 0; for (let h = 0; h < nH; h++) if (this.statusAt(d, h)==='done') n++; return n; };
    const dayLabel = d => en ? (T.month + ' ' + d) : (d + ' ' + T.ofMonth);
    const pad = Array.from({length:this.padDays}, () => ({pad:true, future:false, show:false}));
    const mCells = pad.concat(Array.from({length:this.monthDays}, (_, i) => {
      const d = i + 1;
      if (d > this.today) return {pad:false, future:true, show:false, d:String(d), aria: dayLabel(d) + ': ' + T.noLog};
      const n = doneCount(d), pct = n / nH;
      return {
        pad:false, future:false, show:true, d:String(d),
        selected: st.sel === d,
        hasArc: pct > 0,
        sweep: (d === this.today && pct < 1) ? 'var(--primary)' : 'var(--status-done)',
        dashoff: String(Math.round(C * (1 - pct) * 100) / 100),
        aria: dayLabel(d) + ': ' + n + ' ' + T.ofWord + ' ' + nH + ' ' + T.habitsWord,
        onSelect: () => this.setState({sel: d})
      };
    }));
    const loadCells = pad.concat(Array.from({length:this.monthDays}, () => ({pad:false, show:true})));
    const pCells = pad.map(() => ({pad:true, future:false, show:false})).concat(Array.from({length:this.monthDays}, (_, i) => {
      const d = i + 1;
      if (d > this.today) return {pad:false, future:true, show:false, d:String(d)};
      return {pad:false, future:false, show:true, d:String(d),
        aria: dayLabel(d),
        sts: this.habits.map((_, h) => this.statusAt(d, h))};
    }));
    const legend = this.habits.map(h => ({icon:h.icon, name: en ? h.en : h.pt}));
    const selWd = T.wdayNames[(this.padDays + st.sel - 1) % 7];
    const dayHabits = this.habits.map((h, i) => ({
      icon: h.icon, title: en ? h.en : h.pt, status: this.statusAt(st.sel, i),
      onClick: () => this.setState(s => {
        const k = st.sel + '-' + i, cur = this.statusAt(st.sel, i);
        return {ov: Object.assign({}, s.ov, {[k]: cur==='done' ? 'empty' : 'done'})};
      })
    }));
    const tabs = [
      {id:'hoje',label:T.tabs[0],icon:'home'},
      {id:'metas',label:T.tabs[1],icon:'target'},
      {id:'astra',label:T.tabs[2],astra:true},
      {id:'perfil',label:T.tabs[3],icon:'user'}];
    const tabBarEl = DS.TabBar ? E(DS.TabBar,{items:tabs,activeId:'hoje'}) : null;
    const errAction = DS.Button ? E(DS.Button,{variant:'ghost',size:'sm',onClick:()=>{
      this.setState(s=>({cv:{...s.cv,state:'loading'}}));
      setTimeout(()=>this.setState(s=>s.cv.state==='loading'?{cv:{...s.cv,state:'default'}}:null), 900);
    }}, T.retry) : null;
    const emptyAction = DS.Button ? E(DS.Button,{size:'sm',onClick:noop}, T.logToday) : null;
    const emptyActionWide = DS.Button ? E(DS.Button,{variant:'ghost',size:'sm',onClick:noop}, T.logToday) : null;
    let fullDays = 0;
    if (isDefault) for (let d = 1; d <= this.today; d++) if (doneCount(d) === nH) fullDays++;
    const skel = k => (DS.Skeleton ? E(DS.Skeleton,{key:k,variant:'stat-tile',rows:1,label:T.loading}) : null);
    const railEl = isLoading
      ? E('div',{style:{display:'flex',flexDirection:'column',gap:12}}, skel(1), skel(2))
      : (isDefault && DS.StatTile)
      ? E('div',{style:{display:'flex',flexDirection:'column',gap:12}},
          E(DS.StatTile,{value:mockEl(String(fullDays)), label:T.fullDays}),
          E(DS.StatTile,{value:mockEl(T.streakVal), label:T.streak}))
      : null;
    return {
      mode:cv.mode, cv,
      setCv: next => this.setState({cv:next}),
      cvStates:['default','loading','empty','error'],
      is412:!isWide, isWide, tabs, tabBarEl, railEl, noop,
      isLoading, isEmpty, isError, isDefault, showBody, notLoading:!isLoading,
      tNav:T.nav, tMonth:T.month, tPrevMonth:T.prevMonth, tNextMonth:T.nextMonth,
      wdays:T.wdays, mCells, loadCells, pCells, legend,
      selPre: en ? (selWd + ', ' + T.month) : (selWd + ','), selDay:String(st.sel), selPost:T.selPost,
      dayHabits,
      tSync:T.sync, tSyncDesc:T.syncDesc,
      tEmptyTitle:T.emptyTitle, tErrMsg:T.errMsg, tLoading:T.loading, tCreate:T.create,
      emptyAction, emptyActionWide, errAction,
      tPropLabel:T.propLabel, tPropReason:T.propReason,
      n3:3, n16:16, n20:20
    };
  }
}
</script>
</body>
</html>

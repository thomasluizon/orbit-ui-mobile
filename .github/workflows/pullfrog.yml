# PULLFROG ACTION - DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # Provider keys moved from the step to the job so both the primary and the
    # fallback step below read the same list from one place.
    env:
      # add at least one provider API key
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

      # for Amazon Bedrock (https://docs.pullfrog.com/bedrock)
      # AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # AWS_REGION: us-east-1
      # BEDROCK_MODEL_ID: <bedrock-model-id>

      # for Google Vertex AI (https://docs.pullfrog.com/vertex)
      # VERTEX_SERVICE_ACCOUNT_JSON: >-
      #   ${{ secrets.VERTEX_SERVICE_ACCOUNT_JSON }}
      # GOOGLE_CLOUD_PROJECT: my-project
      # VERTEX_LOCATION: global
      # VERTEX_MODEL_ID: <vertex-model-id>

      # for any OpenAI-compatible endpoint - LiteLLM, Cloudflare AI Gateway,
      # self-hosted vLLM (https://docs.pullfrog.com/openai-compatible)
      # OPENAI_COMPATIBLE_BASE_URL: https://litellm.example.com/v1
      # OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
      # OPENAI_COMPATIBLE_MODEL: <model-id>
      # both limits are required - set them to the real limits of that model
      # OPENAI_COMPATIBLE_CONTEXT: "128000"
      # OPENAI_COMPATIBLE_MAX_OUTPUT: "16384"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # Codex is the reviewer. No model input, so Pullfrog resolves its own
      # default exactly as before.
      - name: Run agent
        id: codex
        uses: pullfrog/pullfrog@v0
        continue-on-error: true
        with:
          prompt: ${{ inputs.prompt }}
      # The Pullfrog app sends its model INSIDE the JSON prompt payload, and
      # that beats the action's model input. Rewrite the payload so the
      # fallback below actually reaches Claude. A plain-text prompt has no
      # payload and passes through untouched.
      - name: Repoint the prompt at Claude
        id: claude_prompt
        if: steps.codex.outcome == 'failure'
        env:
          PULLFROG_PROMPT: ${{ inputs.prompt }}
          FALLBACK_MODEL: anthropic/claude-opus-5
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const raw = process.env.PULLFROG_PROMPT ?? '';
          const model = process.env.FALLBACK_MODEL;
          let out = raw;
          try {
            const payload = JSON.parse(raw);
            if (payload && typeof payload === 'object' && payload['~pullfrog']) {
              payload.model = model;
              payload.modelExplicit = true;
              out = JSON.stringify(payload);
              console.error(`repointed payload model to ${model}`);
            } else {
              console.error('prompt is JSON but not a pullfrog payload; passing through');
            }
          } catch {
            console.error('prompt is not JSON; passing through');
          }
          const end = `PF_EOF_${Math.random().toString(36).slice(2)}`;
          process.stdout.write(`prompt<<${end}\n${out}\n${end}\n`);
          NODE
      # Claude reviews ONLY when the Codex step fails, which is what an
      # exhausted OpenAI allowance looks like. Green runs never reach this.
      - name: Run agent (Claude fallback)
        if: steps.codex.outcome == 'failure'
        uses: pullfrog/pullfrog@v0
        with:
          prompt: ${{ steps.claude_prompt.outputs.prompt }}
          model: anthropic/claude-opus-5
          debug: enabled

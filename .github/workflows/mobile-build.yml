name: Mobile Android Build

# Compile the native module graph. android-startup.yml separately checks the
# Hermes module inventory and cold starts an AAB-derived APK.

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Android release build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      # app.config.js points `googleServicesFile` at ./google-services.json,
      # which is gitignored and therefore absent from a CI checkout. Capture
      # mode drops that key, which is how the deleted workflow built here at
      # all. The trade is explicit: this gate proves the native module graph
      # and the Gradle release assemble still compile, and it does NOT cover
      # the Firebase google-services step, which only a real release build runs.
      EXPO_PUBLIC_CAPTURE_MODE: "true"
      EXPO_NO_TELEMETRY: "1"
      EXPO_NO_METRO_WORKSPACE_ROOT: "1"
      GRADLE_OPTS: -Dorg.gradle.caching=true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        env:
          # Bound stalled cache segments so npm ci can continue with a cold cache.
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Read the build's NDK version
        id: ndk
        shell: bash
        run: |
          set -euo pipefail
          # Expo's expoLibs catalog imports React Native's version catalog.
          catalog=$(node -p 'require.resolve("react-native/package.json", { paths: ["./apps/mobile"] })')
          version=$(sed -n 's/^ndkVersion = "\([0-9.]*\)"$/\1/p' "$(dirname "$catalog")/gradle/libs.versions.toml")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cannot read the NDK version from the native build's version catalog."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "path=$ANDROID_HOME/ndk/$version" >> "$GITHUB_OUTPUT"

      - name: Cache the Android NDK
        uses: actions/cache@v6
        with:
          path: ${{ steps.ndk.outputs.path }}
          key: ubuntu-24.04-x64-ndk-v1-${{ steps.ndk.outputs.version }}

      - name: Install and verify the Android NDK
        shell: bash
        env:
          NDK_VERSION: ${{ steps.ndk.outputs.version }}
          NDK_PATH: ${{ steps.ndk.outputs.path }}
        run: |
          set -euo pipefail
          if [ -d "$NDK_PATH" ]; then
            echo "Using cached or preinstalled Android NDK $NDK_VERSION."
          else
            # The runner image installs sdkmanager here and leaves it off PATH.
            sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$sdkmanager" ]; then
              echo "::error::sdkmanager is missing at $sdkmanager; Gradle will not start."
              exit 1
            fi
            echo "Installing Android NDK $NDK_VERSION with sdkmanager."
            if ! "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "ndk;$NDK_VERSION"; then
              echo "::error::Android NDK $NDK_VERSION installation failed before Gradle; rerun to retry the SDK download."
              exit 1
            fi
          fi
          if ! grep -Fqx "Pkg.Revision = $NDK_VERSION" "$NDK_PATH/source.properties" ||
             [ ! -s "$NDK_PATH/build/cmake/android.toolchain.cmake" ]; then
            echo "::error::Android NDK $NDK_VERSION is incomplete or has the wrong revision; Gradle will not start."
            exit 1
          fi
          if ! compiler=$(find "$NDK_PATH/toolchains/llvm/prebuilt" -path '*/bin/clang' -print -quit) ||
             [ ! -x "$compiler" ] || ! "$compiler" --version; then
            echo "::error::Android NDK $NDK_VERSION compiler verification failed; Gradle will not start."
            exit 1
          fi
          echo "Verified Android NDK $NDK_VERSION before Gradle."

      # Runs the Expo prebuild and the Gradle release assemble across the whole
      # native module graph, which is where a broken native dependency or a
      # Gradle change actually surfaces. This compile checks the ARM slices;
      # release and startup proof AABs also compile x86_64 for native emulator execution.
      - name: Build the release APK
        run: npm run android:apk -w @orbit/mobile

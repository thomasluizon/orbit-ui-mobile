name: Mobile Android Build

# Compile the native module graph when a native input changes. android-startup.yml
# separately exports the Hermes bundle, which proves the JavaScript on every mobile
# change, and cold starts an AAB-derived APK.

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "apps/mobile/package.json"
      - "apps/mobile/app.json"
      - "apps/mobile/app.config.js"
      - "apps/mobile/babel.config.js"
      - "apps/mobile/metro.config.js"
      - "apps/mobile/assets/**"
      - "apps/mobile/locales/**"
      - "apps/mobile/plugins/**"
      - "apps/mobile/modules/**"
      - "!apps/mobile/modules/**/*.md"
      - "apps/mobile/scripts/android-release-apk.js"
      - "apps/mobile/scripts/fix-hoisting.js"
      - ".github/workflows/mobile-build.yml"
      - ".github/scripts/install-android-sdk-package.sh"
  # A main run saves the Gradle and compiler caches and the pass marker that pull requests read.
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "apps/mobile/package.json"
      - "apps/mobile/app.json"
      - "apps/mobile/app.config.js"
      - "apps/mobile/babel.config.js"
      - "apps/mobile/metro.config.js"
      - "apps/mobile/assets/**"
      - "apps/mobile/locales/**"
      - "apps/mobile/plugins/**"
      - "apps/mobile/modules/**"
      - "!apps/mobile/modules/**/*.md"
      - "apps/mobile/scripts/android-release-apk.js"
      - "apps/mobile/scripts/fix-hoisting.js"
      - ".github/workflows/mobile-build.yml"
      - ".github/scripts/install-android-sdk-package.sh"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Select the Android compile
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      compile: ${{ github.event_name == 'workflow_dispatch' || steps.pass.outputs.cache-hit != 'true' }}
      pass-key: ${{ steps.key.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The path filter matches the whole pull request diff, so every push of a native change starts this
      # workflow. A pass recorded for the same native inputs skips the compile.
      - name: Hash the native inputs
        id: key
        run: echo "value=android-compile-pass-v1-${{ hashFiles('package.json', 'package-lock.json', 'apps/mobile/package.json', 'apps/mobile/app.json', 'apps/mobile/app.config.js', 'apps/mobile/babel.config.js', 'apps/mobile/metro.config.js', 'apps/mobile/assets/**', 'apps/mobile/locales/**', 'apps/mobile/plugins/**', 'apps/mobile/modules/**', 'apps/mobile/scripts/android-release-apk.js', 'apps/mobile/scripts/fix-hoisting.js', '.github/workflows/mobile-build.yml', '.github/scripts/install-android-sdk-package.sh') }}" >> "$GITHUB_OUTPUT"
      - name: Look up a pass for these native inputs
        id: pass
        uses: actions/cache/restore@v6
        with:
          path: .ci-pass/android-compile
          key: ${{ steps.key.outputs.value }}
          lookup-only: true

  build:
    name: Android release build
    needs: plan
    if: needs.plan.outputs.compile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      # app.config.js points `googleServicesFile` at ./google-services.json,
      # which is gitignored and therefore absent from a CI checkout. Capture
      # mode drops that key, which is how the deleted workflow built here at
      # all. The trade is explicit: this gate proves the native module graph
      # and the Gradle release assemble still compile, and it does NOT cover
      # the Firebase google-services step, which only a real release build runs.
      EXPO_PUBLIC_CAPTURE_MODE: "true"
      EXPO_NO_TELEMETRY: "1"
      EXPO_NO_METRO_WORKSPACE_ROOT: "1"
      GRADLE_OPTS: -Dorg.gradle.caching=true

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - uses: ./.github/actions/restore-npm-cache

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # The default writes the Gradle caches on main only, so a pull request reads the main entries.
      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Read the build's NDK version
        id: ndk
        shell: bash
        run: |
          set -euo pipefail
          # Expo's expoLibs catalog imports React Native's version catalog.
          catalog=$(node -p 'require.resolve("react-native/package.json", { paths: ["./apps/mobile"] })')
          version=$(sed -n 's/^ndkVersion = "\([0-9.]*\)"$/\1/p' "$(dirname "$catalog")/gradle/libs.versions.toml")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cannot read the NDK version from the native build's version catalog."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "path=$ANDROID_HOME/ndk/$version" >> "$GITHUB_OUTPUT"

      - name: Install and verify the Android NDK
        shell: bash
        env:
          NDK_VERSION: ${{ steps.ndk.outputs.version }}
          NDK_PATH: ${{ steps.ndk.outputs.path }}
        run: |
          set -euo pipefail
          # No cache entry: a 0.62 GB entry saved about 20 s of this step, the lowest value per GB of the main caches.
          # The runner image does not hold this NDK, and the SDK manager downloads nothing for a package that it holds.
          bash .github/scripts/install-android-sdk-package.sh "ndk;$NDK_VERSION" \
            "source.properties=Pkg.Revision = $NDK_VERSION" build/cmake/android.toolchain.cmake
          if ! compiler=$(find "$NDK_PATH/toolchains/llvm/prebuilt" -path '*/bin/clang' -print -quit) ||
             [ ! -x "$compiler" ] || ! "$compiler" --version; then
            echo "::error::Android NDK $NDK_VERSION compiler verification failed; Gradle will not start."
            exit 1
          fi
          echo "Verified Android NDK $NDK_VERSION before Gradle."

      # The Gradle build cache does not cover the CMake tasks of the native modules. CMake reads the compiler
      # launcher from these variables, and the Android release uses the same compiler cache prefix.
      - name: Set up ccache for the native C++ builds
        shell: bash
        run: |
          set -euo pipefail
          # A package mirror outage must not fail the compile, so the build runs without ccache.
          if sudo apt-get update -qq && sudo apt-get install -y -qq ccache; then
            ccache --set-config=max_size=2G
            ccache --set-config=compiler_check=content
            ccache --zero-stats
            {
              echo "CCACHE_AVAILABLE=true"
              echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
              echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::ccache could not be installed, so the native C++ build runs without the compiler cache."
          fi

      # Keyed on the lockfile, which pins the native modules whose C and C++ sources this compile reads: main saves one
      # entry per lockfile and a pull request only reads. The android-release.yml restore keys match this key by prefix.
      - name: Restore the ccache directory
        id: compiler-cache
        if: env.CCACHE_AVAILABLE == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-android-release-${{ hashFiles('package-lock.json') }}-compile
          restore-keys: |
            ccache-android-release-${{ hashFiles('package-lock.json') }}-
            ccache-android-release-

      # The stamp follows the restore, so every restored object is older than it.
      - name: Record the start of the compiler cache use
        run: echo "COMPILER_CACHE_USED_SINCE=$(date +%s)" >> "$GITHUB_ENV"

      # Runs the Expo prebuild and the Gradle release assemble across the whole
      # native module graph, which is where a broken native dependency or a
      # Gradle change actually surfaces. This compile checks the ARM slices;
      # release and startup proof AABs also compile x86_64 for native emulator execution.
      - name: Build the release APK
        id: compile
        run: npm run android:apk -w @orbit/mobile

      - name: Report compiler cache statistics
        if: env.CCACHE_AVAILABLE == 'true'
        run: ccache --show-stats

      # ccache sets the time of each object that a compile reads or writes, and removes none under its size limit. A
      # passing compile used every object it needs, so the saved entry holds only those and does not grow when the key
      # changes. A failed compile did not reach every object, so its partial entry keeps the restored ones.
      # The step names the saved directory, so it cleans what the save stores, and the save is the next step. It then
      # removes each path that is not in the layout of ccache 4.9.1 and 4.14.2: the 16 object directories, their
      # one-character subdirectories, the stats and CACHEDIR.TAG files, and the object files. So a log, a lock, a
      # configuration file or a file that another step writes never reaches the entry.
      - name: Keep only the objects that this compile used
        if: ${{ env.CCACHE_AVAILABLE == 'true' && steps.compile.outcome == 'success' && github.ref == 'refs/heads/main' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          ccache --dir ~/.cache/ccache --evict-older-than "$(($(date +%s) - COMPILER_CACHE_USED_SINCE))s"
          cd ~/.cache/ccache
          directory='^[0-9a-f](/[0-9a-f]){0,3}$'
          file='^[0-9a-f]/(CACHEDIR\.TAG|stats|[0-9a-f]/stats|[0-9a-f](/[0-9a-f]){0,2}/([0-9a-v]{29,31}([MR]|[0-9]W)|[0-9a-f]{36,38}(_[0-9a-f]{2})?))$'
          find . -mindepth 1 -depth -print0 | while IFS= read -r -d '' entry; do
            layout=$file
            if [[ -d $entry ]]; then layout=$directory; fi
            if [[ -L $entry || ! ( -d $entry || -f $entry ) || ! ${entry#./} =~ $layout ]]; then rm -rf "$entry"; fi
          done

      # A key is written once, so a passing main compile saves the lockfile key. A failed main compile saves a
      # run-scoped partial entry instead: the restore step finds it by prefix, so the next attempt is not cold, and
      # the lockfile key stays free for the passing compile. ccache checksums each entry.
      - name: Save the ccache directory
        if: ${{ always() && env.CCACHE_AVAILABLE == 'true' && steps.compile.outcome != 'skipped' && github.ref == 'refs/heads/main' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ${{ steps.compile.outcome == 'success' && steps.compiler-cache.outputs.cache-primary-key || format('{0}-partial-{1}-{2}', steps.compiler-cache.outputs.cache-primary-key, github.run_id, github.run_attempt) }}

      - name: Record the pass for these native inputs
        run: mkdir -p .ci-pass && echo "$GITHUB_SHA" > .ci-pass/android-compile

      - name: Save the pass marker
        uses: actions/cache/save@v6
        with:
          path: .ci-pass/android-compile
          key: ${{ needs.plan.outputs.pass-key }}

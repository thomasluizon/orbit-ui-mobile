name: Mobile Android Build

# Compile the native module graph when a native input changes. android-startup.yml
# separately exports the Hermes bundle, which proves the JavaScript on every mobile
# change, and cold starts an AAB-derived APK.

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "apps/mobile/package.json"
      - "apps/mobile/app.json"
      - "apps/mobile/app.config.js"
      - "apps/mobile/babel.config.js"
      - "apps/mobile/metro.config.js"
      - "apps/mobile/assets/**"
      - "apps/mobile/locales/**"
      - "apps/mobile/plugins/**"
      - "apps/mobile/modules/**"
      - "!apps/mobile/modules/**/*.md"
      - "apps/mobile/scripts/android-release-apk.js"
      - "apps/mobile/scripts/fix-hoisting.js"
      - ".github/workflows/mobile-build.yml"
  # A main run saves the Gradle, NDK and compiler caches and the pass marker that pull requests read.
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "apps/mobile/package.json"
      - "apps/mobile/app.json"
      - "apps/mobile/app.config.js"
      - "apps/mobile/babel.config.js"
      - "apps/mobile/metro.config.js"
      - "apps/mobile/assets/**"
      - "apps/mobile/locales/**"
      - "apps/mobile/plugins/**"
      - "apps/mobile/modules/**"
      - "!apps/mobile/modules/**/*.md"
      - "apps/mobile/scripts/android-release-apk.js"
      - "apps/mobile/scripts/fix-hoisting.js"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Select the Android compile
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      compile: ${{ github.event_name == 'workflow_dispatch' || steps.pass.outputs.cache-hit != 'true' }}
      pass-key: ${{ steps.key.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The path filter matches the whole pull request diff, so every push of a native change starts this
      # workflow. A pass recorded for the same native inputs skips the compile.
      - name: Hash the native inputs
        id: key
        run: echo "value=android-compile-pass-v1-${{ hashFiles('package.json', 'package-lock.json', 'apps/mobile/package.json', 'apps/mobile/app.json', 'apps/mobile/app.config.js', 'apps/mobile/babel.config.js', 'apps/mobile/metro.config.js', 'apps/mobile/assets/**', 'apps/mobile/locales/**', 'apps/mobile/plugins/**', 'apps/mobile/modules/**', 'apps/mobile/scripts/android-release-apk.js', 'apps/mobile/scripts/fix-hoisting.js', '.github/workflows/mobile-build.yml') }}" >> "$GITHUB_OUTPUT"
      - name: Look up a pass for these native inputs
        id: pass
        uses: actions/cache/restore@v6
        with:
          path: .ci-pass/android-compile
          key: ${{ steps.key.outputs.value }}
          lookup-only: true

  build:
    name: Android release build
    needs: plan
    if: needs.plan.outputs.compile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      # app.config.js points `googleServicesFile` at ./google-services.json,
      # which is gitignored and therefore absent from a CI checkout. Capture
      # mode drops that key, which is how the deleted workflow built here at
      # all. The trade is explicit: this gate proves the native module graph
      # and the Gradle release assemble still compile, and it does NOT cover
      # the Firebase google-services step, which only a real release build runs.
      EXPO_PUBLIC_CAPTURE_MODE: "true"
      EXPO_NO_TELEMETRY: "1"
      EXPO_NO_METRO_WORKSPACE_ROOT: "1"
      GRADLE_OPTS: -Dorg.gradle.caching=true

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        env:
          # Bound stalled cache segments so npm ci can continue with a cold cache.
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # The default writes the Gradle caches on main only, so a pull request reads the main entries.
      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Read the build's NDK version
        id: ndk
        shell: bash
        run: |
          set -euo pipefail
          # Expo's expoLibs catalog imports React Native's version catalog.
          catalog=$(node -p 'require.resolve("react-native/package.json", { paths: ["./apps/mobile"] })')
          version=$(sed -n 's/^ndkVersion = "\([0-9.]*\)"$/\1/p' "$(dirname "$catalog")/gradle/libs.versions.toml")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cannot read the NDK version from the native build's version catalog."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "path=$ANDROID_HOME/ndk/$version" >> "$GITHUB_OUTPUT"

      - name: Restore the Android NDK
        id: ndk-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.ndk.outputs.path }}
          key: ubuntu-24.04-x64-ndk-v1-${{ steps.ndk.outputs.version }}

      - name: Install and verify the Android NDK
        shell: bash
        env:
          NDK_VERSION: ${{ steps.ndk.outputs.version }}
          NDK_PATH: ${{ steps.ndk.outputs.path }}
        run: |
          set -euo pipefail
          if [ -d "$NDK_PATH" ]; then
            echo "Using cached or preinstalled Android NDK $NDK_VERSION."
          else
            # The runner image installs sdkmanager here and leaves it off PATH.
            sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$sdkmanager" ]; then
              echo "::error::sdkmanager is missing at $sdkmanager; Gradle will not start."
              exit 1
            fi
            echo "Installing Android NDK $NDK_VERSION with sdkmanager."
            if ! "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "ndk;$NDK_VERSION"; then
              echo "::error::Android NDK $NDK_VERSION installation failed before Gradle; rerun to retry the SDK download."
              exit 1
            fi
          fi
          if ! grep -Fqx "Pkg.Revision = $NDK_VERSION" "$NDK_PATH/source.properties" ||
             [ ! -s "$NDK_PATH/build/cmake/android.toolchain.cmake" ]; then
            echo "::error::Android NDK $NDK_VERSION is incomplete or has the wrong revision; Gradle will not start."
            exit 1
          fi
          if ! compiler=$(find "$NDK_PATH/toolchains/llvm/prebuilt" -path '*/bin/clang' -print -quit) ||
             [ ! -x "$compiler" ] || ! "$compiler" --version; then
            echo "::error::Android NDK $NDK_VERSION compiler verification failed; Gradle will not start."
            exit 1
          fi
          echo "Verified Android NDK $NDK_VERSION before Gradle."

      # A pull request never saves: the NDK entry is about 600 MB, and main keeps the one entry that every run reads.
      - name: Save the Android NDK
        if: github.ref == 'refs/heads/main' && steps.ndk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.ndk.outputs.path }}
          key: ubuntu-24.04-x64-ndk-v1-${{ steps.ndk.outputs.version }}

      # The Gradle build cache does not cover the CMake tasks of the native modules. CMake reads the compiler
      # launcher from these variables, and the Android release uses the same compiler cache prefix.
      - name: Set up ccache for the native C++ builds
        shell: bash
        run: |
          set -euo pipefail
          # A package mirror outage must not fail the compile, so the build runs without ccache.
          if sudo apt-get update -qq && sudo apt-get install -y -qq ccache; then
            ccache --set-config=max_size=2G
            ccache --set-config=compiler_check=content
            ccache --zero-stats
            {
              echo "CCACHE_AVAILABLE=true"
              echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
              echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::ccache could not be installed, so the native C++ build runs without the compiler cache."
          fi

      - name: Restore the ccache directory
        if: env.CCACHE_AVAILABLE == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-android-release-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ccache-android-release-${{ hashFiles('package-lock.json') }}-
            ccache-android-release-

      # Runs the Expo prebuild and the Gradle release assemble across the whole
      # native module graph, which is where a broken native dependency or a
      # Gradle change actually surfaces. This compile checks the ARM slices;
      # release and startup proof AABs also compile x86_64 for native emulator execution.
      - name: Build the release APK
        run: npm run android:apk -w @orbit/mobile

      - name: Report compiler cache statistics
        if: env.CCACHE_AVAILABLE == 'true'
        run: ccache --show-stats

      - name: Save the ccache directory
        if: env.CCACHE_AVAILABLE == 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ccache-android-release-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}

      - name: Record the pass for these native inputs
        run: mkdir -p .ci-pass && echo "$GITHUB_SHA" > .ci-pass/android-compile

      - name: Save the pass marker
        uses: actions/cache/save@v6
        with:
          path: .ci-pass/android-compile
          key: ${{ needs.plan.outputs.pass-key }}

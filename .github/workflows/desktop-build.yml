name: Desktop Build

on:
  pull_request:
    branches: [main]
  # A main run compiles all four targets and saves the Rust compile caches that pull requests read.
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "!apps/desktop/**/*.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-build.yml"
      - ".github/actions/desktop-nsis-tools/**"
  workflow_dispatch:

concurrency:
  group: desktop-build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A pull request compiles the Apple Silicon target alone, and only when the shell or this workflow changed.
  # The Windows x86 build of a pull request runs in installed (windows-latest) of desktop-acceptance.yml.
  # A pass recorded for the same inputs skips the compile. A push to main and a dispatch compile all four targets.
  plan:
    name: Select desktop targets
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.select.outputs.run }}
      matrix: ${{ steps.select.outputs.matrix }}
      pass-key: ${{ steps.key.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Hash the shell inputs
        id: key
        run: echo "value=desktop-build-pass-v1-${{ hashFiles('apps/desktop/**', '!apps/desktop/**/*.md', '.github/workflows/desktop-build.yml') }}" >> "$GITHUB_OUTPUT"
      - name: Look up a pass for these shell inputs
        id: pass
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: .ci-pass/desktop-macos
          key: ${{ steps.key.outputs.value }}
          lookup-only: true
      - name: Select the targets to compile
        id: select
        env:
          PASS_HIT: ${{ steps.pass.outputs.cache-hit }}
        run: |
          set -euo pipefail
          all='["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]'
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo "matrix=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'matrix=["aarch64-apple-darwin"]' >> "$GITHUB_OUTPUT"
          git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/desktop-paths.txt"
          if grep -E '^apps/desktop/|^\.github/workflows/desktop-build\.yml$' "$RUNNER_TEMP/desktop-paths.txt" | grep -Evq '\.md$' && [ "${PASS_HIT:-}" != true ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Desktop ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ endsWith(matrix.target, '-apple-darwin') && 'macos-15' || 'windows-2025' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      # A run that saves restores no older entry, so the entry holds only the tarballs of this lockfile.
      - id: npm-cache
        uses: ./.github/actions/restore-npm-cache
        with:
          restore-older-entry: ${{ !(runner.os == 'Windows' && github.ref == 'refs/heads/main') }}
      # WHY: npm does not retry a TLS cipher error, so each install from the registry gets a second attempt.
      - run: npm ci --prefer-offline --no-audit --fund=false || npm ci --prefer-offline --no-audit --fund=false
      # Every Windows job restores this entry. A changed lockfile starts this workflow on main, so it saves it.
      - name: Save the npm cache
        if: runner.os == 'Windows' && github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.npm-cache.outputs.path }}
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
      - name: Point the Windows App SDK download cache
        if: runner.os == 'Windows'
        run: echo "ORBIT_WINDOWS_DOWNLOAD_CACHE=$RUNNER_TEMP/windows-app-sdk-downloads" >> "$GITHUB_ENV"
      # About 200 MB per target: main saves it, and a pull request only reads it.
      - name: Cache Windows App SDK downloads
        id: windows-downloads
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.ORBIT_WINDOWS_DOWNLOAD_CACHE }}
          key: ${{ runner.os }}-windows-app-sdk-${{ matrix.target }}-${{ hashFiles('apps/desktop/src-tauri/native/windows/downloads.json') }}
      - name: Provide the NSIS bundler tools
        if: runner.os == 'Windows'
        uses: ./.github/actions/desktop-nsis-tools
      - name: Install Rust and compilation target
        env:
          DESKTOP_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --target "$DESKTOP_TARGET"
          rustup default stable
      - name: Restore the Rust compile cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          # One key per target. This job is its only writer: Desktop Installed Acceptance and Desktop Release only read it.
          shared-key: desktop-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Checks and the web jsdom shards of Unit Tests prove the desktop types and the web bridge on every pull request.
      - name: Test the desktop shell
        run: npm run test -w @orbit/desktop
      - name: Test native context on the runner host
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      # The package step compiles the target in full, so no separate cargo check runs.
      - name: Package unsigned staging shell
        env:
          DESKTOP_TARGET: ${{ matrix.target }}
        run: npm run build:staging -w @orbit/desktop -- --target "$DESKTOP_TARGET" --no-sign -- --locked
      - name: Save Windows App SDK downloads
        if: runner.os == 'Windows' && github.ref == 'refs/heads/main' && steps.windows-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.ORBIT_WINDOWS_DOWNLOAD_CACHE }}
          key: ${{ steps.windows-downloads.outputs.cache-primary-key }}
      - name: Archive macOS app with executable permissions
        if: runner.os == 'macOS'
        env:
          DESKTOP_TARGET: ${{ matrix.target }}
        run: |
          tar -czf "apps/desktop/orbit-staging-${DESKTOP_TARGET}.tar.gz" \
            -C "apps/desktop/src-tauri/target/${DESKTOP_TARGET}/release/bundle/macos" "Orbit Staging.app"
      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: orbit-staging-${{ matrix.target }}
          path: apps/desktop/orbit-staging-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: orbit-staging-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  # The marker is saved from Linux, where the plan job reads it. The job needs every target, so a push to main saves it
  # after all four compiled.
  record:
    name: Record the desktop compile pass
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Record the pass for these shell inputs
        run: mkdir -p .ci-pass && echo "$GITHUB_SHA" > .ci-pass/desktop-macos
      - name: Save the pass marker
        uses: actions/cache/save@v6
        with:
          path: .ci-pass/desktop-macos
          key: ${{ needs.plan.outputs.pass-key }}

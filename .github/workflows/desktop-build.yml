name: Desktop Build

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "!apps/desktop/**/*.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-build.yml"
      - ".github/actions/desktop-nsis-tools/**"
  # A main run compiles all four targets and saves the Rust compile caches that pull requests read.
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "!apps/desktop/**/*.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-build.yml"
      - ".github/actions/desktop-nsis-tools/**"
  workflow_dispatch:

concurrency:
  group: desktop-build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The two cross targets read their own native inputs, so a pull request that changes the shell compiles all four.
  # A pull request that changes only the root manifests compiles the two native targets.
  targets:
    name: Select desktop targets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # `Select native boot proof` in android-startup.yml has the same two steps (a checkout of two commits and one diff).
    # It took 52 s at worst in 59 pull request runs, and the limit is 2.3 times that.
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select the targets that the pull request can break
        id: select
        run: |
          set -euo pipefail
          git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/desktop-paths.txt"
          if grep -Eq '^apps/desktop/|^\.github/workflows/desktop-build\.yml$|^\.github/actions/desktop-nsis-tools/' "$RUNNER_TEMP/desktop-paths.txt"; then
            echo 'matrix=["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Desktop ${{ matrix.target }}
    needs: targets
    # A push to main and a dispatch compile all four targets. A failed selection compiles all four instead of skipping.
    if: ${{ !cancelled() }}
    runs-on: ${{ endsWith(matrix.target, '-apple-darwin') && 'macos-15' || 'windows-2025' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix || '["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --fund=false
      - name: Point the Windows App SDK download cache
        if: runner.os == 'Windows'
        run: echo "ORBIT_WINDOWS_DOWNLOAD_CACHE=$RUNNER_TEMP/windows-app-sdk-downloads" >> "$GITHUB_ENV"
      # About 200 MB per target: main saves it, and a pull request only reads it.
      - name: Cache Windows App SDK downloads
        id: windows-downloads
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.ORBIT_WINDOWS_DOWNLOAD_CACHE }}
          key: ${{ runner.os }}-windows-app-sdk-${{ matrix.target }}-${{ hashFiles('apps/desktop/src-tauri/native/windows/downloads.json') }}
      - name: Provide the NSIS bundler tools
        if: runner.os == 'Windows'
        uses: ./.github/actions/desktop-nsis-tools
      - name: Install Rust and compilation target
        env:
          DESKTOP_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --target "$DESKTOP_TARGET"
          rustup default stable
      - name: Restore the Rust compile cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          # One key per target, shared with Desktop Installed Acceptance and Desktop Release.
          shared-key: desktop-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Type Check and the web jsdom shards of Unit Tests prove the desktop types and the web bridge on every pull request.
      - name: Test the desktop shell
        run: npm run test -w @orbit/desktop
      - name: Test native context on the runner host
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      # The package step compiles the target in full, so no separate cargo check runs.
      - name: Package unsigned staging shell
        env:
          DESKTOP_TARGET: ${{ matrix.target }}
        run: npm run build:staging -w @orbit/desktop -- --target "$DESKTOP_TARGET" --no-sign -- --locked
      - name: Save Windows App SDK downloads
        if: runner.os == 'Windows' && github.ref == 'refs/heads/main' && steps.windows-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.ORBIT_WINDOWS_DOWNLOAD_CACHE }}
          key: ${{ steps.windows-downloads.outputs.cache-primary-key }}
      - name: Archive macOS app with executable permissions
        if: runner.os == 'macOS'
        env:
          DESKTOP_TARGET: ${{ matrix.target }}
        run: |
          tar -czf "apps/desktop/orbit-staging-${DESKTOP_TARGET}.tar.gz" \
            -C "apps/desktop/src-tauri/target/${DESKTOP_TARGET}/release/bundle/macos" "Orbit Staging.app"
      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: orbit-staging-${{ matrix.target }}
          path: apps/desktop/orbit-staging-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: orbit-staging-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

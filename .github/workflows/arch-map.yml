name: arch-map

# The map is GENERATED, not committed (thomasluizon/orbit-tickets#470). This job therefore cannot
# compare a fresh generation against a committed copy; there is no committed copy. It proves the two
# properties that actually matter for an on-demand artifact:
#
#   1. the generator runs to completion on this tree, and
#   2. it is deterministic: two runs in the same job are byte-identical.
#
# Both were previously implied by the byte-exact `git diff --exit-code` against a committed file, and
# that comparison is what made every pair of parallel branches conflict on a 1 MB regenerated
# artifact. Determinism is asserted directly instead, which is the property the drift gate was really
# standing in for.
#
# The three files are published as a build artifact so a reviewer, or anyone who does not want to run
# node, can read the map for a given pull request head.

on:
  pull_request:
    branches: [main, redesign/main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: Architecture map drift
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate the architecture map
        run: node tools/arch-map.mjs

      - name: The map is deterministic across two runs
        run: |
          set -euo pipefail
          for artifact in architecture.json architecture.html architecture.mmd; do
            cp "$artifact" "$RUNNER_TEMP/first-$artifact"
          done
          node tools/arch-map.mjs > /dev/null
          for artifact in architecture.json architecture.html architecture.mmd; do
            if ! cmp -s "$artifact" "$RUNNER_TEMP/first-$artifact"; then
              echo "::error::$artifact differs between two runs over an unchanged tree. The generator is not deterministic; a clock, a git SHA or an unsorted list has crept in."
              diff "$RUNNER_TEMP/first-$artifact" "$artifact" | head -40 || true
              exit 1
            fi
          done
          echo "All three artifacts are byte-identical across two runs."

      - name: Publish the map
        uses: actions/upload-artifact@v5
        with:
          name: architecture-map
          path: |
            architecture.json
            architecture.html
            architecture.mmd
          if-no-files-found: error
          retention-days: 14

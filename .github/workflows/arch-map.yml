name: arch-map


on:
  pull_request:
    branches: [main, redesign/main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: Architecture map drift
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate the architecture map
        run: node tools/arch-map.mjs

      - name: The map is deterministic across two runs
        run: |
          set -euo pipefail
          for artifact in architecture.json architecture.html architecture.mmd; do
            cp "$artifact" "$RUNNER_TEMP/first-$artifact"
          done
          node tools/arch-map.mjs > /dev/null
          for artifact in architecture.json architecture.html architecture.mmd; do
            if ! cmp -s "$artifact" "$RUNNER_TEMP/first-$artifact"; then
              echo "::error::$artifact differs between two runs over an unchanged tree. The generator is not deterministic; a clock, a git SHA or an unsorted list has crept in."
              diff "$RUNNER_TEMP/first-$artifact" "$artifact" | head -40 || true
              exit 1
            fi
          done
          echo "All three artifacts are byte-identical across two runs."

      - name: Publish the map
        uses: actions/upload-artifact@v7
        with:
          name: architecture-map
          path: |
            architecture.json
            architecture.html
            architecture.mmd
          if-no-files-found: error
          retention-days: 14

name: API contract rebaseline

on:
  schedule:
    - cron: '23 */6 * * *'
  repository_dispatch:
    types: [orbit-api-contract-drift]

permissions:
  contents: read

concurrency:
  group: api-contract-rebaseline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      moved: ${{ steps.regenerate.outputs.moved }}
      base: ${{ steps.regenerate.outputs.base }}
    steps:
      # This job never holds a write token. npm ci runs install scripts, including Lefthook's hook
      # installer, and Orval runs generated code, so anything they leave behind dies with this runner.
      # Only the contract output and its complete source metadata cross to the write job.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Regenerate the selected stream from orbit-api main
        id: regenerate
        run: |
          set -euo pipefail
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          api_commit=$(git ls-remote https://github.com/thomasluizon/orbit-api.git refs/heads/main | cut -f1)
          node packages/shared/scripts/generate-contract.mjs --candidate "$api_commit"
          branch=chore/contract-snapshot
          comparison=HEAD
          if git ls-remote --exit-code --heads origin "$branch"; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
            comparison="origin/$branch"
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
          if git diff --quiet "$comparison" -- packages/shared/src/types/__generated__/api.generated.ts packages/shared/src/types/__generated__/api.spec.commit packages/shared/src/types/__generated__/api.spec.selection.json; then
            echo 'moved=false' >> "$GITHUB_OUTPUT"
          else
            echo 'moved=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        if: steps.regenerate.outputs.moved == 'true'
        with:
          name: contract-snapshot
          path: |
            packages/shared/src/types/__generated__/api.generated.ts
            packages/shared/src/types/__generated__/api.spec.commit
            packages/shared/src/types/__generated__/api.spec.selection.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    if: needs.generate.outputs.moved == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The write token lives only on this fresh runner, which installs nothing, runs no generator and
      # runs no repository hook: core.hooksPath points at /dev/null for the commit and the push.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Carry the target branch into the single rebaseline branch
        env:
          GENERATED_BASE: ${{ needs.generate.outputs.base }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$GENERATED_BASE" ]; then
            echo '::error::The target branch moved during generation. Retry against its current selection.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch=chore/contract-snapshot
          if git ls-remote --exit-code --heads origin "$branch"; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
            git diff --name-only "$(git merge-base HEAD "origin/$branch")" "origin/$branch" > "$RUNNER_TEMP/routine-paths.txt"
            if grep -Ev '^packages/shared/src/types/__generated__/(api\.generated\.ts|api\.spec\.commit|api\.spec\.selection\.json)$' "$RUNNER_TEMP/routine-paths.txt"; then
              echo '::error::The routine branch contains handwritten changes. Reconcile it before rebaseline.'
              exit 1
            fi
            git switch --create "$branch" --track "origin/$branch"
            git -c core.hooksPath=/dev/null merge --no-commit --no-ff -X theirs "origin/main"
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::Could not determine whether the rebaseline branch exists."
              exit "$status"
            fi
            git switch --create "$branch"
          fi
          rm -f packages/shared/src/types/__generated__/api.spec.selection.json

      - uses: actions/download-artifact@v8
        with:
          name: contract-snapshot
          path: packages/shared/src/types/__generated__

      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CONTRACT_REBASELINE_APP_ID }}
          private-key: ${{ secrets.CONTRACT_REBASELINE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Commit and open or update one pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          snapshot=packages/shared/src/types/__generated__/api.generated.ts
          pin=packages/shared/src/types/__generated__/api.spec.commit
          selection=packages/shared/src/types/__generated__/api.spec.selection.json
          git add -- "$snapshot" "$pin"
          if [ -f "$selection" ] || git ls-files --error-unmatch "$selection" > /dev/null 2>&1; then
            git add -- "$selection"
          fi
          if ! git diff --cached --quiet || [ -f "$(git rev-parse --git-path MERGE_HEAD)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -c core.hooksPath=/dev/null commit -m 'Update pinned API contract snapshot'
          fi
          git -c core.hooksPath=/dev/null push origin HEAD:refs/heads/chore/contract-snapshot
          if git diff --quiet origin/main -- "$snapshot" "$pin" "$selection"; then
            echo 'The pinned snapshot already matches main.'
            exit 0
          fi
          cat > "$RUNNER_TEMP/contract-pr-body.md" <<'BODY'
          The orbit-api producer or selected artifact moved. Review the complete source metadata and generated snapshot, then update hand-written Zod types only when the consumed contract changed. API deployment acceptance is separate from generation.

          The snapshot is a diff target. It is not imported at runtime.
          BODY
          number=$(gh pr list --head chore/contract-snapshot --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$RUNNER_TEMP/contract-pr-body.md"
          else
            gh pr create --base main --head chore/contract-snapshot --title 'Update pinned API contract snapshot' --body-file "$RUNNER_TEMP/contract-pr-body.md"
          fi

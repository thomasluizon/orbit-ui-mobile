name: Desktop Installed Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'tools/desktop-bench/**'
      - '.github/actions/desktop-acceptance-setup/**'
      - '.github/workflows/desktop-acceptance.yml'
      - '.github/actions/desktop-nsis-tools/**'

permissions:
  contents: read

concurrency:
  group: desktop-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed:
    strategy:
      fail-fast: false
      matrix:
        # A same-repository run signs macOS in installed-signed; a fork pull request gets no desktop-staging environment, so its macOS run stays here unsigned.
        runner: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["windows-latest"]' || '["macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/desktop-acceptance-setup
      - id: nsis
        name: Provide the NSIS bundler tools
        if: runner.os == 'Windows'
        uses: ./.github/actions/desktop-nsis-tools
      - id: acceptance
        name: Build, install and exercise the isolated desktop app
        env:
          ACCEPTANCE_OUTPUT: ${{ runner.temp }}/orbit-desktop-acceptance
          # Public identifiers of the "Orbit Windows Push" Entra app (#1861); only the client secret is a credential.
          # An unsigned macOS run skips APNs before it reads a credential, so the APNs values live in installed-signed alone.
          ORBIT_DESKTOP_WNS_OBJECT_ID: a5b747ad-b169-488c-9f1a-06679cd27f7d
          ORBIT_WNS_TENANT_ID: d0a72506-23da-4004-afff-9c077a5b72a5
          ORBIT_WNS_CLIENT_ID: d8d3802e-fed9-4d7e-a7b9-87fdfcf2d0db
          ORBIT_WNS_CLIENT_SECRET: ${{ secrets.ORBIT_WNS_CLIENT_SECRET }}
        run: node tools/desktop-bench/acceptance.mjs --output "$ACCEPTANCE_OUTPUT"
      # A failed step before acceptance leaves no report.json, and the upload below would fail on the missing file alone.
      - name: Record a report when acceptance wrote none
        if: always()
        env:
          ACCEPTANCE_OUTPUT: ${{ runner.temp }}/orbit-desktop-acceptance
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          NSIS_OUTCOME: ${{ steps.nsis.outcome }}
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
        run: >-
          node tools/desktop-bench/acceptance-report.mjs --output "$ACCEPTANCE_OUTPUT"
          --step "setup=$SETUP_OUTCOME" --step "nsis=$NSIS_OUTCOME" --step "acceptance=$ACCEPTANCE_OUTCOME"
      - name: Upload recording, native trees and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-installed-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/orbit-desktop-acceptance/report.json
            ${{ runner.temp }}/orbit-desktop-acceptance/latest.json
            ${{ runner.temp }}/orbit-desktop-acceptance/latest.json.sig
            ${{ runner.temp }}/orbit-desktop-acceptance/*.mp4
            ${{ runner.temp }}/orbit-desktop-acceptance/*.log
            ${{ runner.temp }}/orbit-desktop-acceptance/*.jsonl
            ${{ runner.temp }}/orbit-desktop-acceptance/caption-*.png
            ${{ runner.temp }}/orbit-desktop-acceptance/trees/**
          if-no-files-found: error
          retention-days: 14

  installed-signed:
    name: installed (macos-latest, Developer ID)
    # GitHub passes no secrets to a fork pull request, so only this repository's runs take the signing environment.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    timeout-minutes: 60
    environment:
      name: desktop-staging
      deployment: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/desktop-acceptance-setup
      - id: acceptance
        name: Build, sign, install and exercise the isolated desktop app
        env:
          ACCEPTANCE_OUTPUT: ${{ runner.temp }}/orbit-desktop-acceptance
          ORBIT_APPLE_TEAM_ID: ${{ vars.ORBIT_APPLE_TEAM_ID }}
          ORBIT_APNS_KEY_ID: ${{ secrets.ORBIT_APNS_KEY_ID }}
          ORBIT_APNS_PRIVATE_KEY: ${{ secrets.ORBIT_APNS_PRIVATE_KEY }}
          # The harness passes these to the bundle step alone; the updater key stays the one this run generates.
          MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: node tools/desktop-bench/acceptance.mjs --output "$ACCEPTANCE_OUTPUT"
      - name: Record a report when acceptance wrote none
        if: always()
        env:
          ACCEPTANCE_OUTPUT: ${{ runner.temp }}/orbit-desktop-acceptance
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
        run: >-
          node tools/desktop-bench/acceptance-report.mjs --output "$ACCEPTANCE_OUTPUT"
          --step "setup=$SETUP_OUTCOME" --step "acceptance=$ACCEPTANCE_OUTCOME"
      - name: Upload recording, native trees and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-installed-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/orbit-desktop-acceptance/report.json
            ${{ runner.temp }}/orbit-desktop-acceptance/latest.json
            ${{ runner.temp }}/orbit-desktop-acceptance/latest.json.sig
            ${{ runner.temp }}/orbit-desktop-acceptance/*.mp4
            ${{ runner.temp }}/orbit-desktop-acceptance/*.log
            ${{ runner.temp }}/orbit-desktop-acceptance/trees/**
          if-no-files-found: error
          retention-days: 14

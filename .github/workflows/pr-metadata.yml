name: PR Metadata

on:
  pull_request:
    branches: [main, redesign/main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  metadata:
    name: PR Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve pull request changed paths
        if: ${{ !cancelled() && (github.event_name == 'pull_request') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/changed-paths.sh "$BASE_REF" "$RUNNER_TEMP"

      - name: Read current pull request text
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
        env:
          CHECK_DASHES: ${{ github.event.pull_request.user.type != 'Bot' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/pull/([0-9]+)/merge$ ]]
          PR_NUMBER="${BASH_REMATCH[1]}"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '{title,body,labels:[.labels[].name]}' > "$RUNNER_TEMP/pr-metadata.json"

          node .github/scripts/check-pr-metadata.mjs "$RUNNER_TEMP/pr-metadata.json" "$RUNNER_TEMP/pr-body.md" \
            --changed-files-file "$RUNNER_TEMP/changed-paths.txt"

      - name: Check UI review evidence
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          node tools/check-review-harness.mjs \
            --base "$BASE_REF" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --changed-files-file "$RUNNER_TEMP/changed-paths.txt"

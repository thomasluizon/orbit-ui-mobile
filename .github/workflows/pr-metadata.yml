name: PR Metadata

on:
  pull_request:
    branches: [main, redesign/main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

# Every metadata event must finish its required check. A shared concurrency group
# can cancel running siblings and replace pending label events at the same head.

permissions:
  contents: read
  pull-requests: read

jobs:
  metadata:
    name: PR Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve pull request changed paths
        if: ${{ !cancelled() && (github.event_name == 'pull_request') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff --name-only --diff-filter=ACMRD "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed-paths.txt"

      - name: Read current pull request text
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/pull/([0-9]+)/merge$ ]]
          PR_NUMBER="${BASH_REMATCH[1]}"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '{title,body,labels:[.labels[].name]}' > "$RUNNER_TEMP/pr-metadata.json"

      - name: Validate current pull request text
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
        env:
          CHECK_DASHES: ${{ github.event.pull_request.user.type != 'Bot' }}
        run: |
          node .github/scripts/check-pr-metadata.mjs "$RUNNER_TEMP/pr-metadata.json" "$RUNNER_TEMP/pr-body.md" \
            --changed-files-file "$RUNNER_TEMP/changed-paths.txt"

      - name: Check suppressions ratchet with current labels
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module - "$RUNNER_TEMP/pr-metadata.json" <<'NODE'
          import { readFileSync } from "node:fs"
          import { spawnSync } from "node:child_process"
          const { labels } = JSON.parse(readFileSync(process.argv[2], "utf8"))
          if (!labels.includes("ratchet:reseed")) {
            const result = spawnSync(process.execPath, ["tools/check-suppressions-ratchet.mjs"], { stdio: "inherit" })
            process.exit(result.status ?? 1)
          }
          NODE

      - name: Check UI review evidence
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          node tools/check-review-harness.mjs \
            --base "$BASE_REF" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --changed-files-file "$RUNNER_TEMP/changed-paths.txt"

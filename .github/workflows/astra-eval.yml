name: Astra eval

on:
  workflow_dispatch:
    inputs:
      case_ids:
        description: Comma-separated corpus case IDs for this daily window
        required: true
        default: single-read-en,single-create-pt
        type: string

permissions:
  contents: read

concurrency:
  group: astra-eval
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    environment: astra-eval
    timeout-minutes: 25
    defaults:
      run:
        working-directory: evals/astra
    env:
      ORBIT_EVAL_BASE_URL: ${{ secrets.ORBIT_EVAL_BASE_URL }}
      ORBIT_EVAL_GRADER: ${{ secrets.ORBIT_EVAL_GRADER }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ORBIT_EVAL_CREDENTIALS_JSON: ${{ secrets.ORBIT_EVAL_CREDENTIALS_JSON }}
      ORBIT_EVAL_CASE_IDS: ${{ inputs.case_ids }}
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PROMPTFOO_DISABLE_SHARING: '1'
    steps:
      - name: Set eval temporary paths
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          printf 'ORBIT_EVAL_CREDENTIALS_FILE=%s/astra-credentials.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PROMPTFOO_CONFIG_DIR=%s/astra-promptfoo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        env:
          # Bound stalled cache segments so npm ci can continue with a cold cache.
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: evals/astra/package-lock.json
      - name: Install the isolated eval package
        run: npm ci --workspaces=false
      - name: Prepare private rotating credentials
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORBIT_EVAL_SECRETS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ORBIT_EVAL_CREDENTIALS_JSON"
          test -n "$GH_TOKEN"
          umask 077
          printf '%s\n' "$ORBIT_EVAL_CREDENTIALS_JSON" > "$ORBIT_EVAL_CREDENTIALS_FILE"
          chmod 600 "$ORBIT_EVAL_CREDENTIALS_FILE"
          rm -f "$ORBIT_EVAL_CREDENTIALS_FILE.rotated" "$ORBIT_EVAL_CREDENTIALS_FILE.refresh-failed"
      - name: Evaluate selected cases with three attempts
        run: npx promptfoo eval --filter-metadata "id=$ORBIT_EVAL_CASE_IDS"
      - name: Persist rotated credentials for the next window
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORBIT_EVAL_SECRETS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -f "$ORBIT_EVAL_CREDENTIALS_FILE.rotated" ] && [ ! -f "$ORBIT_EVAL_CREDENTIALS_FILE.refresh-failed" ]; then
            gh secret set ORBIT_EVAL_CREDENTIALS_JSON --repo "$GITHUB_REPOSITORY" --env astra-eval < "$ORBIT_EVAL_CREDENTIALS_FILE"
          fi
      - name: Upload the sanitized gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: astra-eval-summary
          path: |
            evals/astra/reports/summary.json
            evals/astra/reports/summary.md
          if-no-files-found: warn
          retention-days: 7
      - name: Remove local eval state
        if: always()
        shell: bash
        run: |
          rm -rf "$PROMPTFOO_CONFIG_DIR"
          rm -f "$ORBIT_EVAL_CREDENTIALS_FILE" "$ORBIT_EVAL_CREDENTIALS_FILE.lock" "$ORBIT_EVAL_CREDENTIALS_FILE.rotated" "$ORBIT_EVAL_CREDENTIALS_FILE.refresh-failed"

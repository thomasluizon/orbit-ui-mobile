name: Desktop Benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/desktop-bench/**'
      - '.github/workflows/desktop-benchmark.yml'
      - '.github/actions/desktop-nsis-tools/**'
      - 'apps/desktop/scripts/nsis-tools.ts'
      - 'apps/desktop/scripts/release-asset.ts'
      - 'apps/desktop/src-tauri/native/windows/nsis-tools.json'

permissions:
  contents: read

concurrency:
  group: desktop-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        env:
          # Bound stalled cache segments so npm ci can continue with a cold cache.
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --fund=false
      - name: Provide the NSIS bundler tools
        if: runner.os == 'Windows'
        uses: ./.github/actions/desktop-nsis-tools
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # One resolved version names both the cache key and the install, and the cached archive sits in a directory named by
      # its checksum, which @electron/get verifies against electron's checksums.json on every hit (tools/desktop-bench/build.mjs).
      - name: Resolve the benchmark Electron
        id: electron
        shell: bash
        run: echo "version=$(npm view electron version)" >> "$GITHUB_OUTPUT"
      - name: Restore the Electron download
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/electron-cache
          key: desktop-benchmark-electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron.outputs.version }}
      # electron-builder keeps each toolset archive at <cache>/<release>/<file> and checks it against the checksum that its
      # version pins on every hit, so the pinned version (electronBuilderVersion in tools/desktop-bench/build.mjs) names
      # every archive and checksum.
      - name: Restore the electron-builder binaries
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/electron-builder-cache
          key: desktop-benchmark-electron-builder-${{ runner.os }}-${{ runner.arch }}-26.18.0
      - name: Compare release shells on the hermetic app
        env:
          BENCHMARK_OUTPUT: ${{ runner.temp }}/orbit-desktop-benchmark
          ORBIT_ELECTRON_VERSION: ${{ steps.electron.outputs.version }}
          ORBIT_ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ORBIT_ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
        run: node tools/desktop-bench/run.mjs --output "${{ env.BENCHMARK_OUTPUT }}"
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-benchmark-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/orbit-desktop-benchmark/summary.json
            ${{ runner.temp }}/orbit-desktop-benchmark/summary.md
            ${{ runner.temp }}/orbit-desktop-benchmark/partial.json
            ${{ runner.temp }}/orbit-desktop-benchmark/work/*.log
          if-no-files-found: error
          retention-days: 14

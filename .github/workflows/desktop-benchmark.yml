name: Desktop Benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/desktop-bench/**'
      - '.github/workflows/desktop-benchmark.yml'

permissions:
  contents: read

concurrency:
  group: desktop-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --fund=false
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Compare release shells on the hermetic app
        env:
          BENCHMARK_OUTPUT: ${{ runner.temp }}/orbit-desktop-benchmark
        run: node tools/desktop-bench/run.mjs --output "${{ env.BENCHMARK_OUTPUT }}"
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-benchmark-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/orbit-desktop-benchmark/summary.json
            ${{ runner.temp }}/orbit-desktop-benchmark/summary.md
            ${{ runner.temp }}/orbit-desktop-benchmark/partial.json
            ${{ runner.temp }}/orbit-desktop-benchmark/work/*.log
          if-no-files-found: error
          retention-days: 14

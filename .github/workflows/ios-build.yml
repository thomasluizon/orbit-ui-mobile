name: Mobile iOS Build

# Compile the native module graph when a native input changes. The Android Hermes
# export in android-startup.yml proves the JavaScript bundle: no iOS-only source exists.

on:
  # A main run saves the compiler cache and the pass marker that pull requests read.
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/mobile/package.json'
      - 'apps/mobile/app.json'
      - 'apps/mobile/app.config.js'
      - 'apps/mobile/babel.config.js'
      - 'apps/mobile/metro.config.js'
      - 'apps/mobile/assets/**'
      - 'apps/mobile/locales/**'
      - 'apps/mobile/plugins/**'
      - 'apps/mobile/modules/**'
      - '!apps/mobile/modules/**/*.md'
      - 'apps/mobile/scripts/fix-hoisting.js'
      - 'apps/mobile/__tests__/lib/ios-widget-native.test.ts'
      - 'apps/mobile/__tests__/support/ios-widget-*.swift'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/mobile/package.json'
      - 'apps/mobile/app.json'
      - 'apps/mobile/app.config.js'
      - 'apps/mobile/babel.config.js'
      - 'apps/mobile/metro.config.js'
      - 'apps/mobile/assets/**'
      - 'apps/mobile/locales/**'
      - 'apps/mobile/plugins/**'
      - 'apps/mobile/modules/**'
      - '!apps/mobile/modules/**/*.md'
      - 'apps/mobile/scripts/fix-hoisting.js'
      - 'apps/mobile/__tests__/lib/ios-widget-native.test.ts'
      - 'apps/mobile/__tests__/support/ios-widget-*.swift'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select the iOS compile
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      compile: ${{ github.event_name == 'workflow_dispatch' || steps.pass.outputs.cache-hit != 'true' }}
      pass-key: ${{ steps.key.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The path filter matches the whole pull request diff, so every push of a native change starts this
      # workflow. A pass recorded for the same native inputs skips the macOS compile.
      - name: Hash the native inputs
        id: key
        run: echo "value=ios-compile-pass-v1-${{ hashFiles('package.json', 'package-lock.json', 'apps/mobile/package.json', 'apps/mobile/app.json', 'apps/mobile/app.config.js', 'apps/mobile/babel.config.js', 'apps/mobile/metro.config.js', 'apps/mobile/assets/**', 'apps/mobile/locales/**', 'apps/mobile/plugins/**', 'apps/mobile/modules/**', 'apps/mobile/scripts/fix-hoisting.js', 'apps/mobile/__tests__/lib/ios-widget-native.test.ts', 'apps/mobile/__tests__/support/ios-widget-*.swift', '.github/workflows/ios-build.yml') }}" >> "$GITHUB_OUTPUT"
      - name: Look up a pass for these native inputs
        id: pass
        uses: actions/cache/restore@v6
        with:
          path: .ci-pass/ios-compile
          key: ${{ steps.key.outputs.value }}
          lookup-only: true

  compile:
    name: iOS simulator compile
    needs: plan
    if: needs.plan.outputs.compile == 'true'
    runs-on: macos-26
    # The arm64 slice with no bundle phase; a cold compiler cache compiles every native source once inside this limit.
    timeout-minutes: 40
    env:
      ORBIT_APP_VARIANT: staging
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_METRO_WORKSPACE_ROOT: '1'
      EXPO_PUBLIC_API_BASE: https://api-staging.useorbit.org
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      USE_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.cache/ios-ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - uses: actions/setup-node@v7
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Install the compiler cache
        run: brew install ccache
      # Keyed on the native inputs only: main saves one entry per input set, and a pull request only reads it.
      - name: Restore compiler outputs
        id: compiler-cache
        uses: actions/cache/restore@v6
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          path: ${{ env.CCACHE_DIR }}
          key: macos-26-${{ runner.arch }}-xcode-26.6-ios-release-ccache-v2-${{ hashFiles('package-lock.json', 'apps/mobile/app.json', 'apps/mobile/app.config.js', 'apps/mobile/plugins/**', 'apps/mobile/modules/**', '.github/workflows/ios-build.yml') }}
          restore-keys: |
            macos-26-${{ runner.arch }}-xcode-26.6-ios-release-ccache-v2-
      - name: Reset compiler cache statistics
        run: ccache --zero-stats
      - name: Test the compiled widget state and session adapter
        working-directory: apps/mobile
        run: npx vitest run __tests__/lib/ios-widget-native.test.ts
      - name: Generate the iOS project and install pods
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios
      - name: Compile without signing or launching a simulator
        id: compile
        working-directory: apps/mobile
        env:
          # The Android Hermes export proves the JavaScript bundle; react-native-xcode.sh, expo-updates and the
          # Sentry wrapper each skip their bundle step on this variable.
          SKIP_BUNDLING: '1'
        run: |
          set -euo pipefail
          # React Native's compiler wrappers read CCACHE_BINARY from the process environment.
          CCACHE_BINARY="$(command -v ccache)"
          export CCACHE_BINARY
          # The generic simulator destination also compiles x86_64, which doubles every compile and no shipped build uses.
          xcodebuild -workspace ios/OrbitStaging.xcworkspace -scheme OrbitStaging \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/orbit-ios-build" ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      # A key is written once, so only a passing main compile saves it; a partial entry would stay until the inputs change.
      - name: Save compiler outputs
        if: ${{ steps.compile.outcome == 'success' && github.ref == 'refs/heads/main' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Report compiler cache statistics
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          ccache --show-stats
          if ! ccache --print-stats | awk '
            $1 == "cache_miss" || $1 == "direct_cache_hit" || $1 == "preprocessed_cache_hit" { calls += $2 }
            END { exit(calls == 0) }
          '; then
            echo "::error::ccache recorded zero cacheable compiler calls; check CCACHE_BINARY and the generated compiler settings." >&2
            exit 1
          fi

  # The marker is saved from Linux, where the plan job reads it.
  record:
    name: Record the iOS compile pass
    needs: [plan, compile]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Record the pass for these native inputs
        run: mkdir -p .ci-pass && echo "$GITHUB_SHA" > .ci-pass/ios-compile
      - name: Save the pass marker
        uses: actions/cache/save@v6
        with:
          path: .ci-pass/ios-compile
          key: ${{ needs.plan.outputs.pass-key }}

name: Mobile iOS Build

on:
  # Default-branch caches are available to new pull requests.
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-build.yml'
      - '.github/workflows/ios-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-build.yml'
      - '.github/workflows/ios-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: iOS simulator compile
    runs-on: macos-15
    # The slowest sampled successful run took 39m27s; allow cold builds and cache I/O over 20m of headroom.
    timeout-minutes: 60
    env:
      ORBIT_APP_VARIANT: staging
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_METRO_WORKSPACE_ROOT: '1'
      EXPO_PUBLIC_API_BASE: https://api-staging.useorbit.org
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      USE_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.cache/ios-ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - uses: actions/setup-node@v7
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install the compiler cache
        run: brew install ccache
      - name: Restore and save compiler outputs
        uses: actions/cache@v6
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          path: ${{ env.CCACHE_DIR }}
          key: macos-15-${{ runner.arch }}-xcode-26.3-ios-release-ccache-v1-${{ hashFiles('package-lock.json', 'apps/mobile/app.json', 'apps/mobile/app.config.js', 'apps/mobile/plugins/**', 'apps/mobile/modules/**', '.github/workflows/ios-build.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            macos-15-${{ runner.arch }}-xcode-26.3-ios-release-ccache-v1-${{ hashFiles('package-lock.json', 'apps/mobile/app.json', 'apps/mobile/app.config.js', 'apps/mobile/plugins/**', 'apps/mobile/modules/**', '.github/workflows/ios-build.yml') }}-
      - name: Reset compiler cache statistics
        run: ccache --zero-stats
      - name: Test the compiled widget state and session adapter
        working-directory: apps/mobile
        run: npx vitest run __tests__/lib/ios-widget-native.test.ts
      - name: Generate the iOS project and install pods
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios
      - name: Compile without signing or launching a simulator
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/OrbitStaging.xcworkspace -scheme OrbitStaging \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/orbit-ios-build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Report compiler cache statistics
        if: ${{ !cancelled() }}
        run: ccache --show-stats

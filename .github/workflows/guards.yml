name: Guards

# The deterministic replacements for the Claude-session-only PostToolUse hooks
# (D6): these hold for Codex, Claude, a human, or a bot, because CI
# is the one layer nothing bypasses. Jobs:
#   dashes  - the cross-repo dash ban: changed files, the shrink-only baseline, and the PR title/body
#   copy    - AI-cliche / placeholder / typed-uppercase locale values + hardcoded brand colors
#   context-budget - the shrink-only always-loaded context budget and structural allowlists
#   ratchet - the eslint-suppressions.json baselines may only shrink
#   parity  - a web-scope code change with zero mobile-scope change (or inverse) fails without the parity:exempt label
#   expo-pin - apps/mobile/package.json changes must keep the Expo SDK pin resolution intact
#   archaeology - instruction files may not carry run-narrative archaeology (shrink-only)
#   frontmatter - every skill and agent .md has parseable YAML frontmatter (an unquoted ": " drops it silently)
#   harness - the harness is EXECUTED, not read: every tools/ script and both session hooks run
#   lockstep - the six load-bearing harness twins stay aligned with orbit-api
#   calibration - the model stamp covers every skill and agent and is current
#   tier-labels - every configured worker tier has a selector in the Linear label snapshot

on:
  pull_request:
    branches: [main]
    # `labeled` and `unlabeled` are load-bearing, not tidiness. Four of these jobs carry a
    # label escape hatch (context:reseed, calibration:reseed, ratchet:reseed, parity:exempt,
    # coverage:reseed), and `edited` covers title, body and base but NOT labels. Without these
    # two the sequence "the check fails, apply the label, merge" fires no new run, the failing
    # check run stands, and every escape hatch is decorative unless the label was predicted and
    # applied before the first run.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dashes:
    name: Dash Ban
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Changed files carry no new dashes
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD -z \
            | xargs -0 --no-run-if-empty node tools/check-dashes.mjs --files
      - name: Baseline only shrinks
        run: node tools/check-dashes.mjs --check-baseline
      - name: PR title and body carry no dashes
        # Human-authored prose only. A bot PR body is machine-copied upstream text
        # (Dependabot quotes the dependency's own changelog verbatim), which Orbit
        # neither wrote nor can edit, and which Dependabot regenerates on every
        # rebase. The file-level dash check above still runs on bot PRs, because
        # the files they change ARE Orbit's. See orbit-api#425, where a Hangfire
        # release note's en dashes blocked a security-relevant NuGet bump.
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node tools/check-dashes.mjs --text "$PR_TITLE $PR_BODY"

  copy:
    name: Copy Register
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/check-copy.mjs --check

  context-budget:
    name: Context Budget
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'context:reseed')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/check-context-budget.mjs --check
        env:
          CONTEXT_BUDGET_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}

  archaeology:
    name: Run Archaeology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The baseline is compared against the TARGET branch copy, so a new occurrence
          # cannot be laundered by rewriting the baseline in the same pull request. That
          # needs the base ref present, which a shallow checkout does not give.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/check-archaeology.mjs --check
  frontmatter:
    name: Skill and Agent Frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/check-frontmatter.mjs

  calibration:
    name: Harness Calibration
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'calibration:reseed')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enforce calibration drift
        # Blocking after all 12 guards jobs were added to branch protection and read back.
        # The status is captured and re-raised separately rather than piped: a pipeline
        # reports its LAST command's status, so piping into tee reported tee and a crash in
        # the tool read as a pass. Capturing it directly preserves the tool's error exit.
        shell: bash
        run: |
          status=0
          node tools/check-calibration.mjs > "$RUNNER_TEMP/calibration.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/calibration.txt"
          cat "$RUNNER_TEMP/calibration.txt" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  tier-labels:
    name: Worker Tier Label Snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Detect a tier label contract change
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only --diff-filter=ACMRD origin/${{ github.base_ref }}...HEAD \
            | grep -Eq '^(\.claude/(orchestrator\.json|linear-team-labels\.json)|tools/(check-tier-labels\.mjs|refresh-tier-labels\.mjs|lib/orchestrator-config\.mjs))$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Every configured tier has a snapshotted Linear selector label
        if: steps.scope.outputs.changed == 'true'
        run: node tools/check-tier-labels.mjs

  harness:
    name: Harness Execution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Job-level `paths:` does not exist, and a workflow-level one would filter the
      # other guards too, so the scope check is a step like the Expo SDK Pin job's.
      # The job itself always runs and always reports, which is what a required check
      # needs; only the two executions below are scoped.
      - name: Detect a harness change
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -Eq '^(tools/|\.claude/|\.agents/|\.codex/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Every tools/ script executes to its contract
        if: steps.scope.outputs.changed == 'true'
        # The suite carries its own per-tool coverage ratchet: a case body that stopped running
        # prints nothing, so only a committed count can see it. Shrinking a count needs the
        # coverage:reseed label, which is why `labeled` is in this workflow's trigger types.
        env:
          ORBIT_HARNESS_COVERAGE_RESEED: ${{ contains(github.event.pull_request.labels.*.name, 'coverage:reseed') && '1' || '0' }}
        run: node tools/test-tools.mjs
      - name: Both session hooks block and allow as specified
        if: steps.scope.outputs.changed == 'true'
        run: node .claude/hooks/test-hooks.mjs
      # Unscoped on purpose: branch protection drifts without any change to this repository,
      # so a scope check keyed on the diff would miss exactly the case this exists for.
      #
      # REPORT-ONLY until the protection edit lands (the last act of ORB-163). Applied earlier
      # it would make that very pull request unmergeable, because deleting or renaming a job
      # whose context is already required leaves the branch waiting forever for a status
      # nobody reports; orbit-api #440 and #441 sat in exactly that state for two days with
      # every reported check green. To make it blocking: drop --report-only and the warning
      # branch below.
      #
      # ADMIN_READ_TOKEN is a personal access token with repository Administration: read.
      # GITHUB_TOKEN cannot substitute: workflow `permissions:` has no `administration` key
      # (verified against the workflow-syntax reference), so the protection endpoint 403s for
      # it. Without the secret this step says so rather than reporting a clean diff it never
      # made.
      - name: Every deterministic gate is a required check (report-only)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          ADMIN_READ_TOKEN: ${{ secrets.ADMIN_READ_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # LOUD, not silent. The secret does not exist yet, so without this the step exits 0
          # having checked nothing, which is a gate that is wired, green and never executed:
          # the exact defect A1 exists to remove. A warning annotation surfaces on the run
          # itself; the summary line alone goes somewhere nobody reads. It must NOT fail, or
          # every pull request goes red until the secret exists, including this one.
          if [ -z "${ADMIN_READ_TOKEN:-}" ]; then
            echo "::warning::ADMIN_READ_TOKEN is not set, so branch protection was not read and this gate checked nothing"
            echo "ADMIN_READ_TOKEN is not set. Branch protection was NOT read and NO alignment was checked." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # --head is what makes the latest-per-context correction actually execute here rather
          # than only in its own fixtures. Contexts still running at this instant, including the
          # ones this very workflow is producing, are reported as pending; that is accurate, and
          # it is one more reason the step is report-only.
          status=0
          GH_TOKEN="$ADMIN_READ_TOKEN" node tools/check-required-gates.mjs --repo "$REPOSITORY" --head "$HEAD_SHA" --report-only \
            > "$RUNNER_TEMP/required-gates.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/required-gates.txt"
          cat "$RUNNER_TEMP/required-gates.txt" >> "$GITHUB_STEP_SUMMARY"
          [ "$status" -eq 0 ] || echo "::warning::check-required-gates exited $status (report-only)"

  lockstep:
    name: Harness Lockstep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect a lockstep change
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only --diff-filter=ACMRD origin/${{ github.base_ref }}...HEAD \
            | grep -Eq '^(\.claude/skills/pr-review/(SKILL\.md|rubric\.md)|\.claude/skills/_shared/verification-protocol\.md|\.claude/agents/(contract-aligner|security-reviewer)\.md|\.claude/skills/second-opinion/second-opinion\.mjs|tools/(check-lockstep\.mjs|lockstep-declarations\.json)|\.github/workflows/guards\.yml)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve coordinated sibling candidate
        id: sibling
        if: steps.scope.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          CURRENT_PR: ${{ github.event.pull_request.number }}
          PEER_REPOSITORY: thomasluizon/orbit-api
        run: |
          set -euo pipefail
          ref=main
          if [ "$EVENT_NAME" = "pull_request" ]; then
            directives=$(printf '%s\n' "$PR_BODY" | tr -d '\r' | grep -E '^Harness-Lockstep-Peer:' || true)
            count=$(printf '%s\n' "$directives" | sed '/^$/d' | wc -l | tr -d ' ')
            if [ "$count" -gt 1 ]; then
              echo "::error::PR body has more than one Harness-Lockstep-Peer directive"
              exit 1
            fi
            if [ "$count" -eq 1 ]; then
              peer_pr=$(printf '%s\n' "$directives" | sed -nE 's/^Harness-Lockstep-Peer:[[:space:]]*([1-9][0-9]*)[[:space:]]*$/\1/p')
              if [ -z "$peer_pr" ]; then
                echo "::error::Harness-Lockstep-Peer must contain one positive PR number"
                exit 1
              fi
              peer_json=$(gh api "repos/$PEER_REPOSITORY/pulls/$peer_pr")
              peer_base=$(jq -r '.base.ref' <<< "$peer_json")
              peer_base_repo=$(jq -r '.base.repo.full_name' <<< "$peer_json")
              peer_head_repo=$(jq -r '.head.repo.full_name' <<< "$peer_json")
              peer_state=$(jq -r '.state' <<< "$peer_json")
              peer_merged=$(jq -r '.merged' <<< "$peer_json")
              peer_sha=$(jq -r '.head.sha' <<< "$peer_json")
              if [ "$peer_base" != "main" ] || [ "$peer_base_repo" != "$PEER_REPOSITORY" ] || [ "$peer_head_repo" != "$PEER_REPOSITORY" ]; then
                echo "::error::paired PR must target main from a branch in $PEER_REPOSITORY; forks are not accepted"
                exit 1
              fi
              reciprocal=$(jq -r '.body // ""' <<< "$peer_json" | tr -d '\r' | grep -Fxc "Harness-Lockstep-Peer: $CURRENT_PR" || true)
              if [ "$reciprocal" -ne 1 ]; then
                echo "::error::$PEER_REPOSITORY#$peer_pr must contain exactly: Harness-Lockstep-Peer: $CURRENT_PR"
                exit 1
              fi
              if [ "$peer_state" = "open" ]; then
                if ! [[ "$peer_sha" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "::error::paired PR returned an invalid head SHA"
                  exit 1
                fi
                ref=$peer_sha
              elif [ "$peer_merged" = "true" ]; then
                ref=main
              else
                echo "::error::$PEER_REPOSITORY#$peer_pr is closed without merge"
                exit 1
              fi
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Sibling candidate: $PEER_REPOSITORY@$ref"
      - name: Check out orbit-api candidate
        if: steps.scope.outputs.changed == 'true'
        uses: actions/checkout@v7
        with:
          repository: thomasluizon/orbit-api
          ref: ${{ steps.sibling.outputs.ref }}
          path: orbit-api
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.changed == 'true'
        with:
          node-version: 22
      - name: Six harness twins stay in lockstep
        if: steps.scope.outputs.changed == 'true'
        run: node tools/check-lockstep.mjs --ui-root "$GITHUB_WORKSPACE" --api-root "$GITHUB_WORKSPACE/orbit-api"

  ratchet:
    name: Suppressions Ratchet
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ratchet:reseed')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/check-suppressions-ratchet.mjs

  parity:
    name: Cross-Platform Parity
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'parity:exempt') && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: A UI change lands on both platforms or carries parity:exempt
        run: |
          changed=$(git diff --name-only --diff-filter=ACMRD origin/${{ github.base_ref }}...HEAD)
          web=$(echo "$changed" | grep -Ec '^apps/web/(app|components|hooks|stores|lib)/' || true)
          mobile=$(echo "$changed" | grep -Ec '^apps/mobile/(app|components|hooks|stores|lib)/' || true)
          echo "web-scope files: $web   mobile-scope files: $mobile"
          if [ "$web" -gt 0 ] && [ "$mobile" -eq 0 ]; then
            echo "::error::apps/web UI code changed with zero apps/mobile change. Parity is mandatory (root CLAUDE.md). Apply the mirror change, or add the parity:exempt label with a one-line justification in the PR body (platform adapters only)."
            exit 1
          fi
          if [ "$mobile" -gt 0 ] && [ "$web" -eq 0 ]; then
            echo "::error::apps/mobile UI code changed with zero apps/web change. Parity is mandatory (root CLAUDE.md). Apply the mirror change, or add the parity:exempt label with a one-line justification in the PR body (platform adapters only)."
            exit 1
          fi

  expo-pin:
    name: Expo SDK Pin
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect apps/mobile/package.json change
        id: mobile-pkg
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^apps/mobile/package\.json$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.mobile-pkg.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.mobile-pkg.outputs.changed == 'true'
      - name: Expo-pinned versions still resolve to the SDK set
        if: steps.mobile-pkg.outputs.changed == 'true'
        working-directory: apps/mobile
        run: CI=1 npx expo install --check

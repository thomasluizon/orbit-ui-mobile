name: Guards

# The deterministic replacements for the Claude-session-only PostToolUse hooks
# (D6): these hold for Codex, Claude, a human, or a bot, because CI
# is the one layer nothing bypasses. Jobs:
#   root-allowlist - root entries are deliberate and npm overrides exist only at the root
#   mobile-styles - mobile styling stays on React Native StyleSheet
#   dashes  - the cross-repo dash ban: changed files, the shrink-only baseline, and the PR title/body
#   mobile-fonts - Rubik cannot re-enter the mobile source tree
#   copy    - AI-cliche / placeholder / typed-uppercase locale values + hardcoded brand colors
#   lint-severity - local rules stay blocking; suppression baselines report until #175 reaches zero
#   ratchet - the eslint-suppressions.json baselines may only shrink
#   parity  - a web-scope code change with zero mobile-scope change (or inverse) fails without the parity:exempt label
#   expo-pin - apps/mobile/package.json changes must keep the Expo SDK pin resolution intact
#   performance-workflow - generated measured-performance logic matches its canonical module
#   calibration - the per-agent and per-skill tuning stamp is current against the running worker model
#   review-harness - a UI pull request on redesign/main states what the review skills found
#   gate-charter - every blocking gate declares and obeys its pull request scope

on:
  pull_request:
    branches: [main, redesign/main]
    # `labeled` and `unlabeled` are load-bearing, not tidiness. Three of these jobs carry a
    # label escape hatch (ratchet:reseed, parity:exempt, calibration:reseed),
    # and `edited` covers title, body and base but NOT labels. Without these
    # two the sequence "the check fails, apply the label, merge" fires no new run, the failing
    # check run stands, and every escape hatch is decorative unless the label was predicted and
    # applied before the first run.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main, redesign/main]

permissions:
  contents: read
  pull-requests: read

jobs:
  mobile-styles:
    name: Mobile StyleSheet Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Mobile source carries no inert class names
        run: |
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            hits=$(git diff --name-only --diff-filter=ACMR -z origin/${{ github.base_ref }}...HEAD -- apps/mobile \
              | xargs -0 --no-run-if-empty grep -nH 'className=' || true)
          else
            hits=$(git grep -n 'className=' -- apps/mobile || true)
          fi
          if [ -n "$hits" ]; then
            echo "::error::Use React Native StyleSheet under apps/mobile."
            echo "$hits"
            exit 1
          fi
          echo "Mobile StyleSheet guard passed."

  root-allowlist:
    name: Root Allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Root entries changed deliberately
        run: |
          if [ '${{ github.event_name }}' != 'pull_request' ]; then
            node tools/check-root-allowlist.mjs
          else
            git diff --name-only --diff-filter=ACMRD -z origin/${{ github.base_ref }}...HEAD \
              > "$RUNNER_TEMP/root-allowlist-changed.txt"
            node tools/check-root-allowlist.mjs \
              --changed-files-file "$RUNNER_TEMP/root-allowlist-changed.txt"
          fi
      - name: Workspace packages declare no ignored overrides
        run: |
          if [ '${{ github.event_name }}' != 'pull_request' ] || \
             git diff --name-only --diff-filter=ACMRD origin/${{ github.base_ref }}...HEAD \
               | grep -Eq '(^|/)package\.json$|^tools/check-workspace-overrides\.mjs$'; then
            node tools/check-workspace-overrides.mjs
          else
            echo "Workspace overrides skipped: no owned path changed."
          fi
      - name: The brand lockup's viewBox is exactly its ink
        run: |
          if [ '${{ github.event_name }}' != 'pull_request' ] || \
             git diff --name-only --diff-filter=ACMRD origin/${{ github.base_ref }}...HEAD \
               | grep -Eq '^design/brand/orbit-lockup\.svg$|^tools/check-lockup-crop\.mjs$'; then
            node tools/check-lockup-crop.mjs
          else
            echo "Lockup crop skipped: no owned path changed."
          fi

  dashes:
    name: Dash Ban
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Changed files carry no new dashes
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD -z \
            | xargs -0 --no-run-if-empty node tools/check-dashes.mjs --files
      - name: Baseline only shrinks
        run: |
          if [ '${{ github.event_name }}' != 'pull_request' ] || \
             git diff --name-only --diff-filter=ACMRD origin/${{ github.base_ref }}...HEAD \
               | grep -Eq '^tools/(check-dashes\.mjs|dash-baseline\.json)$'; then
            node tools/check-dashes.mjs --check-baseline
          else
            echo "Dash baseline skipped: no baseline input changed."
          fi
      - name: PR title and body carry no dashes
        # Human-authored prose only. A bot PR body is machine-copied upstream text
        # (Dependabot quotes the dependency's own changelog verbatim), which Orbit
        # neither wrote nor can edit, and which Dependabot regenerates on every
        # rebase. The file-level dash check above still runs on bot PRs, because
        # the files they change ARE Orbit's. See orbit-api#425, where a Hangfire
        # release note's en dashes blocked a security-relevant NuGet bump.
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node tools/check-dashes.mjs --text "$PR_TITLE $PR_BODY"

  mobile-fonts:
    name: Mobile Font Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ban Rubik under apps/mobile
        run: |
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            hits=$(git diff --name-only --diff-filter=ACMR -z origin/${{ github.base_ref }}...HEAD -- apps/mobile \
              | xargs -0 --no-run-if-empty grep -niH 'rubik' || true)
          else
            hits=$(grep -rni 'rubik' apps/mobile || true)
          fi
          if [ -n "$hits" ]; then
            echo "::error::DESIGN.md font ban: apps/mobile may use only Geist Sans, Space Grotesk, and Geist Mono."
            echo "$hits"
            exit 1
          fi
          echo "Mobile font guard passed."

  copy:
    name: Copy Register
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Changed copy stays inside the register
        run: |
          if [ '${{ github.event_name }}' != 'pull_request' ] || \
             git diff --name-only --diff-filter=ACMRD origin/${{ github.base_ref }}...HEAD \
               | grep -Eq '^packages/shared/src/i18n/(en|pt-BR)\.json$|^apps/(web|mobile)/.*\.(ts|tsx|css)$|^tools/(check-copy\.mjs|copy-baseline\.json)$'; then
            node tools/check-copy.mjs --check
          else
            echo "Copy register skipped: no owned path changed."
          fi

  i18n-usage:
    name: i18n key usage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Changed translation usage resolves
        run: |
          if [ '${{ github.event_name }}' != 'pull_request' ] || \
             git diff --name-only --diff-filter=ACMRD origin/${{ github.base_ref }}...HEAD \
               | grep -Eq '^(apps/web|apps/mobile|packages/shared)/.*\.[cm]?[jt]sx?$|^packages/shared/src/i18n/(en|pt-BR)\.json$|^tools/check-i18n-usage\.mjs$'; then
            node tools/check-i18n-usage.mjs
          else
            echo "i18n usage skipped: no owned path changed."
          fi

  lint-severity:
    name: Lint Severity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Changed lint inputs keep local rules blocking
        run: |
          if [ '${{ github.event_name }}' != 'pull_request' ] || \
             git diff --name-only --diff-filter=ACMRD origin/${{ github.base_ref }}...HEAD \
               | grep -Eq '(^|/)eslint\.config\.(cjs|cts|js|mjs|mts|ts)$|(^|/)eslint-suppressions\.json$|(^|/)package\.json$|^\.github/workflows/.*\.ya?ml$|^tools/check-lint-severity\.mjs$'; then
            node tools/check-lint-severity.mjs --report-suppressions
          else
            echo "Lint severity skipped: no owned path changed."
          fi

  ratchet:
    name: Suppressions Ratchet
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ratchet:reseed')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Changed suppression baselines only shrink
        run: |
          if git diff --name-only --diff-filter=ACMRD origin/${{ github.base_ref }}...HEAD \
               | grep -Eq '^apps/(web|mobile)/eslint-suppressions\.json$|^tools/check-suppressions-ratchet\.mjs$'; then
            node tools/check-suppressions-ratchet.mjs
          else
            echo "Suppressions ratchet skipped: no owned path changed."
          fi

  calibration:
    name: Harness Calibration
    runs-on: ubuntu-latest
    # Calibration ages with time, not with a pull request's diff. It reports whole-tree drift without
    # making an unrelated author's check red. The label remains the explicit reseed workflow signal.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'calibration:reseed')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Report calibration drift
        continue-on-error: true
        run: node tools/check-calibration.mjs

  parity:
    name: Cross-Platform Parity
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'parity:exempt') && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: A UI change lands on both platforms or carries parity:exempt
        run: |
          changed=$(git diff --name-only --diff-filter=ACMRD origin/${{ github.base_ref }}...HEAD)
          web=$(echo "$changed" | grep -Ec '^apps/web/(app|components|hooks|stores|lib)/' || true)
          mobile=$(echo "$changed" | grep -Ec '^apps/mobile/(app|components|hooks|stores|lib)/' || true)
          echo "web-scope files: $web   mobile-scope files: $mobile"
          if [ "$web" -gt 0 ] && [ "$mobile" -eq 0 ]; then
            echo "::error::apps/web UI code changed with zero apps/mobile change. Parity is mandatory (root CLAUDE.md). Apply the mirror change, or add parity:exempt with a one-line PR-body justification for a platform adapter or an enumerated layout-shell divergence only: navigation chrome (sidebar vs tab bar), desktop stats rail, command palette and keyboard shortcuts, or hover affordances on shell chrome. Screens, components, data flows, error paths, and behavior remain parity-bound."
            exit 1
          fi
          if [ "$mobile" -gt 0 ] && [ "$web" -eq 0 ]; then
            echo "::error::apps/mobile UI code changed with zero apps/web change. Parity is mandatory (root CLAUDE.md). Apply the mirror change, or add parity:exempt with a one-line PR-body justification for a platform adapter or an enumerated layout-shell divergence only: navigation chrome (sidebar vs tab bar), desktop stats rail, command palette and keyboard shortcuts, or hover affordances on shell chrome. Screens, components, data flows, error paths, and behavior remain parity-bound."
            exit 1
          fi

  expo-pin:
    name: Expo SDK Pin
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --workspace @orbit/mobile
      - name: Expo-pinned versions still resolve to the SDK set
        working-directory: apps/mobile
        run: |
          if [ '${{ github.event_name }}' != 'pull_request' ] || \
             git diff --name-only --diff-filter=ACMRD origin/${{ github.base_ref }}...HEAD \
               | grep -Eq '^(package-lock\.json|apps/mobile/package\.json)$'; then
            CI=1 npx expo install --check
          else
            echo "Expo pin skipped: no dependency manifest changed."
          fi

  review-harness:
    name: Redesign Review Harness
    runs-on: ubuntu-latest
    # Only a pull request has a body and a base to read. On a push to main there is nothing to check,
    # and the checker itself exits 0 for any base that is not redesign/main.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: A UI pull request on redesign/main records what the review skills found
        env:
          # Through the environment, never argv: a body is untrusted text and interpolating it into a
          # run block is a shell injection. The same reason check-dashes.mjs reads the title this way.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          git diff --name-only --diff-filter=ACMRD origin/${{ github.base_ref }}...HEAD > "$RUNNER_TEMP/changed.txt"
          node tools/check-review-harness.mjs \
            --base '${{ github.base_ref }}' \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --changed-files-file "$RUNNER_TEMP/changed.txt"

  performance-workflow:
    name: Performance Workflow Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Changed performance machinery matches its generated workflow
        run: |
          if [ '${{ github.event_name }}' != 'pull_request' ] || \
             git diff --name-only --diff-filter=ACMRD origin/${{ github.base_ref }}...HEAD \
               | grep -Eq '^tools/(generate-performance-workflow\.mjs|lib/performance-measurement\.mjs)$|^\.claude/workflows/audit\.mjs$'; then
            node tools/generate-performance-workflow.mjs --check
          else
            echo "Performance workflow skipped: no owned path changed."
          fi

  gate-charter:
    name: Gate Charter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Changed gates obey the charter
        run: |
          if [ '${{ github.event_name }}' != 'pull_request' ] || \
             git diff --name-only --diff-filter=ACMRD origin/${{ github.base_ref }}...HEAD \
               | grep -Eq '^\.github/workflows/(guards|test)\.yml$|^tools/(check-.*\.mjs|gate-charter\.json)$|^eslint-rules/[^/]+\.(cjs|js|mjs)$|^\.claude/hooks/[^/]+\.(cjs|js|mjs)$|^package(-lock)?\.json$'; then
            node tools/check-gate-charter.mjs
          else
            echo "Gate charter skipped: no registered gate changed."
          fi

# Each guard keeps its own status condition so failures do not skip later guards.
name: Guards
"on":
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name != 'pull_request' && github.sha || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  guards:
    name: Guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Restore the npm cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/restore-npm-cache
      - name: Use the repository npm version
        if: ${{ !cancelled() }}
        run: npm install --global "$(node -p "require('./package.json').packageManager")" --no-audit --no-fund
      - name: Install dependencies
        if: ${{ !cancelled() }}
        run: npm ci --no-audit
      - name: Resolve pull request changed paths
        if: ${{ !cancelled() && (github.event_name == 'pull_request') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/changed-paths.sh "$BASE_REF" "$RUNNER_TEMP"
      - name: 'Workflow Syntax: Lint all workflows'
        id: workflow-syntax__1
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'pull_request' ] && ! grep -Eq '^\.github/(workflows/|actions/|actionlint\.yaml$)' "$RUNNER_TEMP/changed-paths.txt"; then
            echo "Workflow syntax skipped: no workflow, action or actionlint configuration changed."
            exit 0
          fi
          actionlint_dir=$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXX")
          for attempt in 1 2 3 4 5; do
            gh release download v1.7.12 --repo rhysd/actionlint --pattern actionlint_1.7.12_linux_amd64.tar.gz --output "$actionlint_dir/actionlint.tar.gz" --clobber && break
            [ "$attempt" -lt 5 ] || exit 1
            sleep $((attempt * 5))
          done
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s/actionlint.tar.gz\n' "$actionlint_dir" | sha256sum -c
          tar -xzf "$actionlint_dir/actionlint.tar.gz" -C "$actionlint_dir" actionlint
          "$actionlint_dir/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml
      - id: feature-parity__1
        name: "Production Feature Parity: Regenerate inventory and reject new capability losses"
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # WHY: Compare with the queued merge's own base so later restorations cannot create false losses (https://github.com/thomasluizon/orbit-tickets/issues/1495).
          if [ "$BASE_REF" = main ] && grep -Eq '^(apps/(web|mobile)|packages/shared)/|^tools/check-feature-parity\.mjs$|^tools/feature-parity-rules\.json$|^DESIGN\.md$|^\.claude/specs/orbit-prod-release\.md$' "$RUNNER_TEMP/changed-paths.txt"; then
            node tools/check-feature-parity.mjs --write --ci --production "HEAD^1" --base "HEAD^1"
          else
            echo "Feature parity skipped: no app, shared or parity input changed."
          fi
        if: ${{ !cancelled() && (github.event_name == 'pull_request' && github.base_ref == 'main') }}
      - id: mobile-styles__1
        name: "Mobile StyleSheet Guard: Mobile source carries no inert class names"
        run: |
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            hits=$(grep -zE '^apps/mobile/' "$RUNNER_TEMP/changed-paths-present.nul" \
              | xargs -0 --no-run-if-empty grep -nH 'className=' || true)
          else
            hits=$(git grep -n 'className=' -- apps/mobile || true)
          fi
          if [ -n "$hits" ]; then
            echo "::error::Use React Native StyleSheet under apps/mobile."
            echo "$hits"
            exit 1
          fi
          echo "Mobile StyleSheet guard passed."
        if: ${{ !cancelled() }}
      - id: workspace-overrides__1
        name: "Workspace overrides: Workspace packages declare no ignored overrides"
        run: jq -e -s 'all(.[]; has("overrides") | not)' apps/*/package.json packages/*/package.json
        if: ${{ !cancelled() }}
      - id: padding-contract__1
        name: "Shared padding aliases and source CSS stay on scale"
        run: |
          if [ '${{ github.event_name }}' != 'pull_request' ] || \
             grep -Eq '^apps/(web|mobile)/|^packages/shared/src/theme/|^eslint-rules/' "$RUNNER_TEMP/changed-paths.txt"; then
            node eslint-rules/_spacing-contract.cjs
          else
            echo "Padding contract skipped: no owned path changed."
          fi
        if: ${{ !cancelled() }}
      - id: dashes__1
        name: "Dash Ban: Changed files carry no new dashes"
        if: ${{ !cancelled() && (github.event_name == 'pull_request') }}
        run: |
          xargs -0 --no-run-if-empty node tools/check-dashes.mjs --files \
            < "$RUNNER_TEMP/changed-paths-present.nul"
      - id: dashes__2
        name: "Dash Ban: Baseline only shrinks"
        run: node tools/check-dashes.mjs --check-baseline
        if: ${{ !cancelled() }}
      - id: mobile-fonts__1
        name: "Mobile Font Guard: Ban Rubik under apps/mobile"
        run: |
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            hits=$(grep -zE '^apps/mobile/' "$RUNNER_TEMP/changed-paths-present.nul" \
              | xargs -0 --no-run-if-empty grep -niH 'rubik' || true)
          else
            hits=$(grep -rni 'rubik' apps/mobile || true)
          fi
          if [ -n "$hits" ]; then
            echo "::error::DESIGN.md font ban: apps/mobile may use only Geist Sans, Space Grotesk, and Geist Mono."
            echo "$hits"
            exit 1
          fi
          echo "Mobile font guard passed."
        if: ${{ !cancelled() }}
      - id: copy__1
        name: "Copy Register: Changed copy stays inside the register"
        run: |
          if [ '${{ github.event_name }}' != 'pull_request' ] || \
             grep -Eq '^packages/shared/src/i18n/(en|pt-BR)\.json$|^apps/(web|mobile)/.*\.(ts|tsx|css)$|^tools/(check-copy\.mjs|copy-baseline\.json)$' "$RUNNER_TEMP/changed-paths.txt"; then
            node tools/check-copy.mjs --check
          else
            echo "Copy register skipped: no owned path changed."
          fi
        if: ${{ !cancelled() }}
      - id: i18n-usage__1
        name: "i18n key usage: Changed translation usage resolves"
        run: |
          if [ '${{ github.event_name }}' != 'pull_request' ] || \
             grep -Eq '^(apps/web|apps/mobile|packages/shared)/.*\.[cm]?[jt]sx?$|^packages/shared/src/i18n/(en|pt-BR)\.json$|^tools/check-i18n-usage\.mjs$' "$RUNNER_TEMP/changed-paths.txt"; then
            node tools/check-i18n-usage.mjs
          else
            echo "i18n usage skipped: no owned path changed."
          fi
        if: ${{ !cancelled() }}
      - id: expo-pin__1
        name: "Expo SDK Pin: Dependencies resolve to the SDK 58 set"
        working-directory: apps/mobile
        run: |
          if [ '${{ github.event_name }}' != 'pull_request' ] || \
             grep -Eq '^(package-lock\.json|apps/mobile/package\.json)$' "$RUNNER_TEMP/changed-paths.txt"; then
            node -e "if (require('expo/package.json').version.split('.')[0] !== '58') process.exit(1)"
            # EXPO_OFFLINE makes the check read the installed expo/bundledNativeModules.json, not the Expo API,
            # so the expected set moves only when the lockfile moves expo.
            CI=1 EXPO_OFFLINE=1 ../../node_modules/.bin/expo install --check
          else
            echo "Expo pin skipped: no dependency manifest changed."
          fi
        if: ${{ !cancelled() && (github.event_name == 'pull_request') }}
      - id: surface-manifest__1
        name: "Surface Manifest Drift: Changed surface inputs match the committed inventory"
        run: |
          if [ '${{ github.event_name }}' != 'pull_request' ] || \
             grep -Eq '^apps/(web|mobile)/|^packages/shared/src/|^design/canvas/|^\.claude/manifests/surfaces\.json$|^tools/(surface-manifest|redesign-coverage)\.mjs$|^tools/redesign-groups\.json$' "$RUNNER_TEMP/changed-paths.txt"; then
            node tools/surface-manifest.mjs --check
            node tools/redesign-coverage.mjs
          else
            echo "Surface manifest skipped: no owned path changed."
          fi
        if: ${{ !cancelled() }}
      - id: design-guard__1
        name: "Design Token Guard: Ban raw --slate-*, transition-all, h-screen in app code"
        run: |
          # DESIGN.md bans semantic-token violations. Accent-color literals are caught by
          # the Copy Register gate (tools/check-copy.mjs); this gate covers the rest.
          hits=$(grep -zE '^apps/(web|mobile)/.*\.(ts|tsx|css)$' "$RUNNER_TEMP/changed-paths-present.nul" \
            | grep -zvE '(^|/)__tests__/|/globals\.css$|/theme\.ts$|\.(test|spec)\.tsx?$' \
            | xargs -0 --no-run-if-empty grep -nHE '\-\-slate-|transition-all|\bh-screen\b' || true)
          if [ -n "$hits" ]; then
            echo "::error::DESIGN.md ban: use semantic tokens (var(--fg-*)/var(--primary)), transform+opacity transitions, and min-h-dvh."
            echo "$hits"
            exit 1
          fi
          echo "Design token guard passed."
        if: ${{ !cancelled() && (github.event_name == 'pull_request') }}
      - id: design-guard__2
        name: "Design Token Guard: Ban decorative gradients in app code"
        run: |
          if grep -Eq '^apps/(web|mobile)/.*\.(cjs|css|js|jsx|mjs|ts|tsx)$|^tools/check-gradients\.mjs$' "$RUNNER_TEMP/changed-paths.txt"; then
            node tools/check-gradients.mjs
          else
            echo "Gradient guard skipped: no owned path changed."
          fi
        if: ${{ !cancelled() && (github.event_name == 'pull_request') }}
      - id: dependency-audit__3
        name: "Dependency Audit: Require one copy of each native module"
        if: ${{ !cancelled() }}
        run: node tools/check-native-module-copies.mjs
      - id: contract-drift__1
        name: "Contract Drift: Regenerate Zod contract snapshot from the pinned orbit-api commit"
        working-directory: packages/shared
        run: |
          set -euo pipefail
          node scripts/generate-contract.mjs --check
        if: ${{ !cancelled() && (github.event_name == 'pull_request') }}
      - id: contract-drift__2
        name: "Contract Drift: Fail if the snapshot does not match the pinned API commit"
        run: |
          if ! git diff --quiet -- packages/shared/src/types/__generated__/api.generated.ts; then
            echo "::error::The committed Zod snapshot does not match the pinned orbit-api commit. Regenerate the snapshot from the selected pin and artifact; commit the complete source metadata and snapshot together. See packages/shared/CONTRACT_DRIFT.md."
            git diff -- packages/shared/src/types/__generated__/api.generated.ts
            exit 1
          fi
          echo "The committed snapshot matches the pinned orbit-api commit."
        if: ${{ !cancelled() && (github.event_name == 'pull_request') }}
      - id: react-doctor__1
        # The step took 22 s at worst and the Guards job 250 s at worst in 55 pull request runs.
        # 6 minutes is below the job limit of 10, so a stalled scan fails under its own step name.
        timeout-minutes: 6
        name: "React Doctor: Fail on new React issues in changed files"
        # npm ci installs React Doctor and its dependencies at the versions and checksums of .github/react-doctor/
        # package-lock.json, outside the workspace tree, so a new upstream publish cannot change or fail the scan, and
        # no other job installs it.
        run: |
          set -euo pipefail
          npm ci --prefix .github/react-doctor --ignore-scripts --no-audit --no-fund
          .github/react-doctor/node_modules/.bin/react-doctor . --blocking error --scope changed --base origin/${{ github.base_ref }} --no-dead-code --no-supply-chain --no-score --yes
        if: ${{ !cancelled() && (github.event_name == 'pull_request') }}

name: Redesign drift control


on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redesign-drift
  cancel-in-progress: false

jobs:
  merge-main-into-redesign:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DRIFT_TOKEN: ${{ secrets.REDESIGN_DRIFT_TOKEN }}
    steps:
      - name: Check out the full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.REDESIGN_DRIFT_TOKEN || github.token }}

      - name: Skip when the integration branch does not exist
        id: exists
        run: |
          # `git ls-remote --exit-code` returns 2 for "no matching ref" but 128 for an auth or
          # transport failure. Collapsing every nonzero into "absent" would let an unreachable
          # remote finish this job green, which is a verifier error reported as a clean pass.
          # Only 2 means absent; anything else is unknown, and unknown fails loudly.
          set +e
          probe=$(git ls-remote --exit-code --heads origin redesign/main 2>&1)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 2 ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "redesign/main does not exist yet; nothing to keep in sync."
          else
            echo "::error::git ls-remote failed with status $rc, so the state of redesign/main is unknown. Refusing to treat that as absent."
            echo "$probe"
            exit 1
          fi

      - name: Refuse a workflow-file drift the default token cannot push
        if: steps.exists.outputs.present == 'true'
        run: |
          set -euo pipefail
          # This runs BEFORE the merge on purpose. The push is what GitHub refuses, and a refusal
          # after a clean merge reads as success for ten lines and then dies on the last one.
          git switch redesign/main
          set +e
          merged_stdout=$(git merge-tree --write-tree HEAD origin/main 2>"$RUNNER_TEMP/merge-tree-stderr.txt")
          merged_rc=$?
          set -e
          merged=${merged_stdout%%$'\n'*}
          if [ "$merged_rc" -ne 0 ] || ! printf '%s' "$merged" | grep -qE '^([0-9a-f]{40}|[0-9a-f]{64})$'; then
            # A conflict, a git too old for --write-tree (2.38+), or a first line that is not an object
            # id. None is a signal this step can interpret, and refusing on an unknown would block every
            # drift run. The merge step below fails loudly on a real conflict, and the push classifier
            # names the cause if the refusal happens anyway, so an unknown degrades the message rather
            # than the verdict. The OID shape is validated rather than trusted, which is the whole point
            # of reading someone else's output.
            echo "::warning::Could not compute the prospective merge (git merge-tree exited $merged_rc, first stdout line \"$merged\"), so the workflow-file preflight is skipped. The merge step below still reports a conflict, and a refused push still names its cause."
            printf '%s\n' "$merged_stdout"
            cat "$RUNNER_TEMP/merge-tree-stderr.txt" || true
            exit 0
          fi
          pending=$(git diff --name-only HEAD "$merged" -- .github/workflows || true)
          if [ -z "$pending" ]; then
            echo "The pending drift carries no workflow file; the default token can push it."
            exit 0
          fi
          if [ -n "${DRIFT_TOKEN:-}" ]; then
            echo "The pending drift carries a workflow file and REDESIGN_DRIFT_TOKEN is set; proceeding."
            exit 0
          fi
          {
            echo "### Redesign drift refused before merging"
            echo
            echo "The pending drift from \`main\` changes a file under \`.github/workflows/\`, and the"
            echo "default \`GITHUB_TOKEN\` has no \`workflows\` scope, so the push would be refused."
            echo "Set the \`REDESIGN_DRIFT_TOKEN\` repository secret (see this workflow's header)."
            echo
            echo "Files:"
            echo '```'
            echo "$pending"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Cause: the pending drift changes .github/workflows/** and REDESIGN_DRIFT_TOKEN is not set, so GitHub would refuse the push (GITHUB_TOKEN has no workflows scope). Nothing was merged."
          exit 1

      - name: Merge main into redesign/main
        if: steps.exists.outputs.present == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch redesign/main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "redesign/main already contains main. Nothing to do."
            exit 0
          fi

          if ! git merge --no-ff --no-edit origin/main; then
            git merge --abort || true
            {
              echo "### Redesign drift conflicted"
              echo
              echo "\`main\` does not merge cleanly into \`redesign/main\`. Resolve it by hand."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Cause: main does not merge cleanly into redesign/main. Resolve it by hand; this job never picks a side."
            exit 1
          fi

          set +e
          push=$(git push origin redesign/main 2>&1)
          rc=$?
          set -e
          echo "$push"
          if [ "$rc" -eq 0 ]; then
            echo "Merged main into redesign/main."
            exit 0
          fi
          if printf '%s' "$push" | grep -q "without .workflows. permission"; then
            echo "::error::Cause: GitHub refused the push because it carries a .github/workflows/** change and the pushing token has no workflows scope. Set REDESIGN_DRIFT_TOKEN (see this workflow's header). The merge commit was NOT published."
          else
            echo "::error::Cause: the push to redesign/main failed with status $rc. The merge commit was NOT published; the message above is git's own."
          fi
          {
            echo "### Redesign drift push refused"
            echo
            echo "The merge succeeded locally and was never published, so \`redesign/main\` is unchanged."
            echo
            echo '```'
            printf '%s\n' "$push"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  rebaseline-redesign-contract:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/redesign/main'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/contract-rebaseline.yml

name: Redesign drift control


on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redesign-drift
  cancel-in-progress: false

jobs:
  rebaseline-redesign-contract:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/redesign/main'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/contract-rebaseline.yml
    secrets:
      CONTRACT_REBASELINE_APP_PRIVATE_KEY: ${{ secrets.CONTRACT_REBASELINE_APP_PRIVATE_KEY }}

# Repository secrets: RENDER_API_KEY, SMOKE_TEST_EMAIL, SMOKE_TEST_CODE.
# Repository variables: RENDER_WEB_SERVICE_ID,
# PRODUCTION_WEB_HOST, PRODUCTION_WEB_CUTOVER (set to true when the public host moves to Render),
# PRODUCTION_NEXT_PUBLIC_GOOGLE_CLIENT_ID, PRODUCTION_NEXT_PUBLIC_VAPID_PUBLIC_KEY,
# PRODUCTION_NEXT_PUBLIC_EVENT_API_BASE, PRODUCTION_NEXT_PUBLIC_SITE_URL,
# PRODUCTION_NEXT_PUBLIC_TURNSTILE_SITE_KEY, PRODUCTION_NEXT_PUBLIC_SENTRY_DSN,
# PRODUCTION_NEXT_PUBLIC_POSTHOG_KEY.
# The Render service needs a GHCR registry credential and runtime API_BASE.
name: Release web
run-name: Release web ${{ inputs.environment }} from ${{ inputs.branch }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [production, staging]
      branch:
        description: Source branch
        required: true
        default: main
        type: string

permissions:
  contents: read
  packages: write
  deployments: write

concurrency:
  group: release-web-${{ inputs.environment }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/thomasluizon/orbit-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      smoke_base_url: ${{ steps.health.outputs.smoke_base_url }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate release selection
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != main ]; then echo "::error::Dispatch release.yml from main"; exit 1; fi
          if [ "$RELEASE_ENVIRONMENT" = production ] && [ "$SOURCE_BRANCH" != main ]; then
            echo "::error::Production must build main"; exit 1
          fi
          git check-ref-format --branch "$SOURCE_BRANCH" >/dev/null
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ inputs.branch }}
      - uses: docker/setup-buildx-action@v3
      - name: Resolve source
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push production image
        if: inputs.environment == 'production'
        id: build_production
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/thomasluizon/orbit-web:${{ steps.source.outputs.sha }}
          build-args: |
            WEB_COMMIT_SHA=${{ steps.source.outputs.sha }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.PRODUCTION_NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.PRODUCTION_NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_EVENT_API_BASE=${{ vars.PRODUCTION_NEXT_PUBLIC_EVENT_API_BASE }}
            NEXT_PUBLIC_SITE_URL=${{ vars.PRODUCTION_NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.PRODUCTION_NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.PRODUCTION_NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.PRODUCTION_NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_UPLOAD_BUCKET_ORIGIN=https://orbit-uploads-production-713285551626.s3.us-east-2.amazonaws.com
      - name: Build and push staging image
        if: inputs.environment == 'staging'
        id: build_staging
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/thomasluizon/orbit-web:${{ steps.source.outputs.sha }}
          build-args: |
            WEB_COMMIT_SHA=${{ steps.source.outputs.sha }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.STAGING_NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.STAGING_NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_EVENT_API_BASE=${{ vars.STAGING_NEXT_PUBLIC_EVENT_API_BASE }}
            NEXT_PUBLIC_SITE_URL=${{ vars.STAGING_NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.STAGING_NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.STAGING_NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.STAGING_NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_UPLOAD_BUCKET_ORIGIN=https://orbit-uploads-staging-713285551626.s3.us-east-2.amazonaws.com
      - name: Record digest
        run: echo "Pushed ${IMAGE}@${{ inputs.environment == 'production' && steps.build_production.outputs.digest || steps.build_staging.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy web digest
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PRODUCTION_SERVICE_ID: ${{ vars.RENDER_WEB_SERVICE_ID }}
          STAGING_SERVICE_ID: ${{ vars.RENDER_WEB_STAGING_SERVICE_ID }}
          DIGEST: ${{ inputs.environment == 'production' && steps.build_production.outputs.digest || steps.build_staging.outputs.digest }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          image_url="${IMAGE}@${DIGEST}"
          if [ "$RELEASE_ENVIRONMENT" = production ]; then
            SERVICE_ID="$PRODUCTION_SERVICE_ID"
            SERVICE_KEY=RENDER_WEB_SERVICE_ID
          else
            SERVICE_ID="$STAGING_SERVICE_ID"
            SERVICE_KEY=RENDER_WEB_STAGING_SERVICE_ID
          fi
          if [ -z "$SERVICE_ID" ]; then
            echo "::error::Missing ${SERVICE_KEY} for ${image_url}" >&2
            exit 1
          fi
          triggered_after=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          response=$(curl -fsS -X POST "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg image "$image_url" '{imageUrl:$image}')")
          deploy_id=
          if [ -n "$response" ]; then deploy_id=$(jq -er '.id' <<< "$response"); fi
          if [ -z "$deploy_id" ]; then
            for attempt in $(seq 1 30); do
              deploys=$(curl -fsS -G "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
                -H "Authorization: Bearer ${RENDER_API_KEY}" \
                --data-urlencode 'limit=20' --data-urlencode "createdAfter=${triggered_after}")
              deploy_id=$(jq -r --arg image "$image_url" --arg digest "$DIGEST" \
                '[.[] | select(.deploy.image.ref == $image or .deploy.image.sha == $digest) | .deploy.id][0] // empty' <<< "$deploys")
              if [ -n "$deploy_id" ]; then break; fi
              sleep 2
            done
          fi
          if [ -z "$deploy_id" ]; then echo "Queued web deploy for ${image_url} was not listed" >&2; exit 1; fi
          for attempt in $(seq 1 60); do
            sleep 10
            status=$(curl -fsS "https://api.render.com/v1/services/${SERVICE_ID}/deploys/${deploy_id}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" | jq -er '.status')
            echo "Deploy poll ${attempt}: ${status}"
            case "$status" in
              live) echo "Web deploy ${deploy_id} is live"; exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|deactivated|canceled) echo "Deploy failed: ${status}" >&2; exit 1 ;;
              created|queued|build_in_progress|pre_deploy_in_progress|update_in_progress) ;;
              *) echo "Unknown deploy status: ${status}" >&2; exit 1 ;;
            esac
          done
          echo "Timed out waiting for web deploy ${deploy_id}" >&2
          exit 1
      - name: Check web health
        id: health
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PRODUCTION_SERVICE_ID: ${{ vars.RENDER_WEB_SERVICE_ID }}
          STAGING_SERVICE_ID: ${{ vars.RENDER_WEB_STAGING_SERVICE_ID }}
          PRODUCTION_WEB_HOST: ${{ vars.PRODUCTION_WEB_HOST }}
          PRODUCTION_WEB_CUTOVER: ${{ vars.PRODUCTION_WEB_CUTOVER }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_ENVIRONMENT" = production ]; then SERVICE_ID="$PRODUCTION_SERVICE_ID"; else SERVICE_ID="$STAGING_SERVICE_ID"; fi
          origin=$(curl -fsS "https://api.render.com/v1/services/${SERVICE_ID}" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" | jq -er '.serviceDetails.url')
          origin="${origin%/}"
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "${origin}/api/health" |
            jq -e --arg sha "$SOURCE_SHA" '.status == "ok" and .commit == $sha'
          deployment_url="$origin"
          smoke_base_url="$origin"
          if [ "$RELEASE_ENVIRONMENT" = staging ]; then
            echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"
            echo "smoke_base_url=${smoke_base_url}" >> "$GITHUB_OUTPUT"
            echo "Verified staging ${origin} at ${SOURCE_SHA}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$PRODUCTION_WEB_CUTOVER" = true ]; then
            public_url="https://${PRODUCTION_WEB_HOST}"
            curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "${public_url}/api/health" |
              jq -e --arg sha "$SOURCE_SHA" '.status == "ok" and .commit == $sha'
            deployment_url="$public_url"
            smoke_base_url="$public_url"
            echo "Verified public host ${public_url} at ${SOURCE_SHA}" >> "$GITHUB_STEP_SUMMARY"
          else
            public_commit=$(curl -fsS "https://${PRODUCTION_WEB_HOST}/api/health" 2>/dev/null |
              jq -r '.commit // empty' 2>/dev/null || true)
            if [ -n "$public_commit" ] && [ "$public_commit" != "$SOURCE_SHA" ]; then
              echo "Public host reports ${public_commit}, expected ${SOURCE_SHA}" >&2
              exit 1
            fi
            if [ "$public_commit" = "$SOURCE_SHA" ]; then deployment_url="https://${PRODUCTION_WEB_HOST}"; fi
            echo "Public host was not verified because the cutover has not happened." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"
          echo "smoke_base_url=${smoke_base_url}" >> "$GITHUB_OUTPUT"
          echo "Verified production ${origin} at ${SOURCE_SHA}" >> "$GITHUB_STEP_SUMMARY"
      - name: Record GitHub deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          DIGEST: ${{ inputs.environment == 'production' && steps.build_production.outputs.digest || steps.build_staging.outputs.digest }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_URL: ${{ steps.health.outputs.deployment_url }}
        run: |
          set -euo pipefail
          jq -nc --arg ref "$SOURCE_REF" --arg sha "$SOURCE_SHA" --arg digest "$DIGEST" --arg url "$DEPLOYMENT_URL" --arg environment "$RELEASE_ENVIRONMENT" \
            '{ref:$sha,environment:$environment,auto_merge:false,required_contexts:[],production_environment:($environment == "production"),description:("Web image " + $digest),payload:{source_ref:$ref,sha:$sha,digest:$digest,url:$url}}' |
            curl -fsS -X POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments" \
              -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
              -H 'Content-Type: application/json' --data-binary @- > /dev/null

  smoke:
    name: Post-deploy smoke
    needs: deploy
    if: inputs.environment == 'production'
    runs-on: ubuntu-latest
    env:
      SMOKE_BASE_URL: ${{ needs.deploy.outputs.smoke_base_url }}
      SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
      SMOKE_TEST_CODE: ${{ secrets.SMOKE_TEST_CODE }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.deploy.outputs.source_sha }}
      - name: Validate smoke settings
        run: |
          set -euo pipefail
          for name in SMOKE_BASE_URL SMOKE_TEST_EMAIL SMOKE_TEST_CODE; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing ${name}" >&2; exit 1; fi
          done
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Run production smoke suite
        run: npm --workspace @orbit/web run test:smoke
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/e2e/.report
            apps/web/e2e/.results
          if-no-files-found: ignore
          retention-days: 14

name: React Doctor


on:
  pull_request:
    branches: [main, redesign/main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  react-doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fail on new React issues in changed files
        run: >
          npx -y react-doctor@0.7.6 .
          --blocking error
          --scope changed --base origin/${{ github.base_ref }}
          --no-dead-code --no-supply-chain --no-score
          --yes

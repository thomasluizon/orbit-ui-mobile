name: PR Tests

on:
  pull_request:
    branches: [main, redesign/main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-image:
    name: Web image build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        with:
          # Use the engine's BuildKit so setup needs no Docker Hub driver image.
          driver: docker
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: orbit-web:smoke
          build-args: |
            NODE_IMAGE=ghcr.io/thomasluizon/orbit-node-base:22-bookworm-slim
            WEB_COMMIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.STAGING_NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.STAGING_NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_EVENT_API_BASE=${{ vars.STAGING_NEXT_PUBLIC_EVENT_API_BASE }}
            NEXT_PUBLIC_SITE_URL=${{ vars.STAGING_NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.STAGING_NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.STAGING_NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=staging
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.STAGING_NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_UPLOAD_BUCKET_ORIGIN=https://orbit-uploads-staging-713285551626.s3.us-east-2.amazonaws.com
      - name: Smoke test container
        run: |
          docker run -d --name orbit-web-smoke -p 3000:3000 orbit-web:smoke
          for attempt in $(seq 1 30); do
            echo "Health attempt ${attempt}"
            if curl -fsS http://localhost:3000/api/health | jq -e --arg sha "$GITHUB_SHA" '.status == "ok" and .commit == $sha'; then exit 0; fi
            sleep 2
          done
          docker logs orbit-web-smoke
          exit 1

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        env:
          # Bound stalled cache segments so npm ci can continue with a cold cache.
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - run: npm run build

  tool-hook-tests:
    name: Tool and Hook Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test CI workflow behavior
        run: node --test tools/__tests__/guards-changed-paths.test.mjs tools/__tests__/ci-minutes.test.mjs tools/__tests__/npm-cache-workflows.test.mjs .github/scripts/check-pr-metadata.test.mjs .github/scripts/unit-tests-workflow.test.mjs

      # The unit suite's contrast scan is skipped on a Turbo cache hit, so this step runs the
      # full-tree scan on every pull request. Findings stay advisory; a scanner error fails.
      - name: Report surface scope findings across the full tree
        if: ${{ !cancelled() }}
        run: |
          set +e
          node tools/check-surface-scope.mjs
          checker_status=$?
          set -e
          if [ "$checker_status" -eq 1 ]; then
            echo "Surface scope findings are reported and do not fail this step."
            exit 0
          fi
          exit "$checker_status"

      - name: Run tools harness
        if: ${{ !cancelled() }}
        run: node tools/test-tools.mjs

      - name: Run hooks harness
        if: ${{ !cancelled() }}
        run: node .claude/hooks/test-hooks.mjs

  unit-tests:
    name: Unit Tests
    if: ${{ always() }}
    needs: [build, web-tests, workspace-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Require every test job
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          WEB_RESULT: ${{ needs.web-tests.result }}
          WORKSPACE_RESULT: ${{ needs.workspace-tests.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$WEB_RESULT" = success
          test "$WORKSPACE_RESULT" = success

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download web shard reports
        uses: actions/download-artifact@v8
        with:
          pattern: web-unit-shard-*
          path: .artifacts/downloads/web
          merge-multiple: false

      - name: Download workspace coverage
        uses: actions/download-artifact@v8
        with:
          pattern: workspace-unit-coverage-*
          path: .artifacts/downloads/workspaces
          merge-multiple: false

      - name: Select latest report attempts
        run: |
          node tools/select-artifact-attempts.mjs --input-dir .artifacts/downloads/web --output-dir apps/web/.artifacts/unit-tests
          node tools/select-artifact-attempts.mjs --input-dir .artifacts/downloads/workspaces --output-dir .

      - name: Verify every web report arrived
        run: |
          for shard in $(seq 1 2); do
            test -s "apps/web/.artifacts/unit-tests/blobs/jsdom-${shard}.json"
          done
          for shard in $(seq 1 8); do
            test -s "apps/web/.artifacts/unit-tests/blobs/chromium-${shard}.json"
          done

      - name: Merge web reports and enforce coverage thresholds
        working-directory: apps/web
        run: npx vitest run --merge-reports=.artifacts/unit-tests/blobs --coverage --reporter=default --reporter=json --outputFile.json=.artifacts/unit-tests/merged.json

      - name: Upload web test timings
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-unit-timings
          path: |
            apps/web/.artifacts/unit-tests/timings
            apps/web/.artifacts/unit-tests/merged.json
          include-hidden-files: true
          if-no-files-found: error

      - name: Verify coverage reports
        run: |
          test -s apps/web/coverage/lcov.info
          test -s apps/mobile/coverage/lcov.info
          test -s packages/shared/coverage/lcov.info
          test -s eslint-rules/coverage/lcov.info

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage
          path: |
            apps/web/coverage/lcov.info
            apps/mobile/coverage/lcov.info
            packages/shared/coverage/lcov.info
            eslint-rules/coverage/lcov.info
          if-no-files-found: error

  web-tests:
    name: Web unit (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [chromium]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        total: [8]
        include:
          - project: jsdom
            shard: 1
            total: 2
          - project: jsdom
            shard: 2
            total: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Partial runs collect coverage; Unit Tests applies the unchanged gate to their union.
      # Completed shards reach 671 seconds; reserve 15 minutes for tests and ten for setup and reports.
      - name: Run web shard with coverage
        timeout-minutes: 15
        working-directory: apps/web
        run: >-
          npx vitest run --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.total }}
          --coverage --coverage.thresholds.statements=0 --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0 --coverage.thresholds.lines=0
          --reporter=default --reporter=blob --reporter=json
          --outputFile.blob=.artifacts/unit-tests/blobs/${{ matrix.project }}-${{ matrix.shard }}.json
          --outputFile.json=.artifacts/unit-tests/timings/${{ matrix.project }}-${{ matrix.shard }}.json
      - name: Upload web shard reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-unit-shard-${{ matrix.project }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: apps/web/.artifacts/unit-tests
          include-hidden-files: true
          if-no-files-found: error

  workspace-tests:
    name: Workspace unit (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: mobile
            directory: apps/mobile
          - workspace: shared
            directory: packages/shared
          - workspace: eslint-rules
            directory: eslint-rules
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Completed workspace suites reach 570 seconds; setup has a separate job allowance.
      - name: Run workspace with coverage thresholds
        timeout-minutes: 15
        run: npx turbo run test --filter="@orbit/${{ matrix.workspace }}" --concurrency=1 -- --coverage
      # Preserve repository paths when artifacts from independent jobs are combined.
      - name: Stage workspace coverage
        run: |
          test -s "${{ matrix.directory }}/coverage/lcov.info"
          mkdir -p ".artifacts/workspace-coverage/${{ matrix.directory }}/coverage"
          cp "${{ matrix.directory }}/coverage/lcov.info" ".artifacts/workspace-coverage/${{ matrix.directory }}/coverage/lcov.info"
      - name: Upload workspace coverage
        uses: actions/upload-artifact@v7
        with:
          name: workspace-unit-coverage-${{ matrix.workspace }}-attempt-${{ github.run_attempt }}
          path: .artifacts/workspace-coverage
          include-hidden-files: true
          if-no-files-found: error

  sonarcloud:
    name: SonarCloud Analysis
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          node-version: 22
          cache: npm

      # The scanner resolves tsconfig extends and dependency types from node_modules.
      - run: npm ci

      - name: Download coverage reports
        uses: actions/download-artifact@v8
        with:
          name: unit-test-coverage

      - name: Merge Coverage Reports
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          const reports = [
            { file: 'apps/web/coverage/lcov.info', prefix: 'apps/web' },
            { file: 'apps/mobile/coverage/lcov.info', prefix: 'apps/mobile' },
            { file: 'packages/shared/coverage/lcov.info', prefix: 'packages/shared' },
          ]

          const outputPath = path.join('coverage', 'lcov.info')
          fs.mkdirSync(path.dirname(outputPath), { recursive: true })

          const merged = []

          for (const report of reports) {
            if (!fs.existsSync(report.file)) continue

            const content = fs.readFileSync(report.file, 'utf8')
            const lines = content.split(/\r?\n/)

            for (const line of lines) {
              if (!line.startsWith('SF:')) {
                merged.push(line)
                continue
              }

              const sourceFile = line.slice(3).replace(/\\/g, '/')
              const normalized = sourceFile.startsWith(report.prefix)
                ? sourceFile
                : `${report.prefix}/${sourceFile}`

              merged.push(`SF:${normalized}`)
            }
          }

          fs.writeFileSync(outputPath, merged.join('\n'))
          NODE

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - run: npx turbo run type-check

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve pull request changed paths
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/changed-paths.sh "$BASE_REF" "$RUNNER_TEMP"

      - uses: actions/setup-node@v7
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Lint only files changed by this pull request
        shell: bash
        run: |
          set -euo pipefail
          web=()
          mobile=()
          shared=()
          while IFS= read -r -d '' file; do
            case "$file" in
              apps/web/*.js|apps/web/*.jsx|apps/web/*.mjs|apps/web/*.cjs|apps/web/*.ts|apps/web/*.tsx|apps/web/*.mts|apps/web/*.cts)
                web+=("${file#apps/web/}") ;;
              apps/mobile/*.js|apps/mobile/*.jsx|apps/mobile/*.mjs|apps/mobile/*.cjs|apps/mobile/*.ts|apps/mobile/*.tsx|apps/mobile/*.mts|apps/mobile/*.cts)
                mobile+=("${file#apps/mobile/}") ;;
              packages/shared/*.js|packages/shared/*.jsx|packages/shared/*.mjs|packages/shared/*.cjs|packages/shared/*.ts|packages/shared/*.tsx|packages/shared/*.mts|packages/shared/*.cts)
                shared+=("${file#packages/shared/}") ;;
            esac
          done < "$RUNNER_TEMP/changed-paths-present.nul"
          if [ "${#web[@]}" -gt 0 ]; then npm exec --workspace @orbit/web -- eslint -- "${web[@]}"; fi
          if [ "${#mobile[@]}" -gt 0 ]; then npm exec --workspace @orbit/mobile -- eslint -- "${mobile[@]}"; fi
          if [ "${#shared[@]}" -gt 0 ]; then npm exec --workspace @orbit/shared -- eslint -- "${shared[@]}"; fi
          echo "Linted ${#web[@]} web, ${#mobile[@]} mobile and ${#shared[@]} shared files."

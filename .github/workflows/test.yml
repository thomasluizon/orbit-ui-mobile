name: PR Tests

on:
  pull_request:
    branches: [main, redesign/main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - run: npm run build

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Run tests with coverage thresholds
        run: npx turbo run test -- --coverage

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - run: npx turbo run type-check

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Lint only files changed by this pull request
        shell: bash
        run: |
          set -euo pipefail
          web=()
          mobile=()
          shared=()
          while IFS= read -r -d '' file; do
            case "$file" in
              apps/web/*.js|apps/web/*.jsx|apps/web/*.mjs|apps/web/*.cjs|apps/web/*.ts|apps/web/*.tsx|apps/web/*.mts|apps/web/*.cts)
                web+=("${file#apps/web/}") ;;
              apps/mobile/*.js|apps/mobile/*.jsx|apps/mobile/*.mjs|apps/mobile/*.cjs|apps/mobile/*.ts|apps/mobile/*.tsx|apps/mobile/*.mts|apps/mobile/*.cts)
                mobile+=("${file#apps/mobile/}") ;;
              packages/shared/*.js|packages/shared/*.jsx|packages/shared/*.mjs|packages/shared/*.cjs|packages/shared/*.ts|packages/shared/*.tsx|packages/shared/*.mts|packages/shared/*.cts)
                shared+=("${file#packages/shared/}") ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR -z origin/${{ github.base_ref }}...HEAD)
          if [ "${#web[@]}" -gt 0 ]; then npm exec --workspace @orbit/web -- eslint -- "${web[@]}"; fi
          if [ "${#mobile[@]}" -gt 0 ]; then npm exec --workspace @orbit/mobile -- eslint -- "${mobile[@]}"; fi
          if [ "${#shared[@]}" -gt 0 ]; then npm exec --workspace @orbit/shared -- eslint -- "${shared[@]}"; fi
          echo "Linted ${#web[@]} web, ${#mobile[@]} mobile and ${#shared[@]} shared files."

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Use the repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")" --no-audit --no-fund

      - run: npm ci --no-audit

      - name: Test critical production CVE gate
        run: node --test .github/scripts/check-critical-production-cves.test.mjs

      - name: Fail on critical production CVEs
        timeout-minutes: 3
        run: node .github/scripts/check-critical-production-cves.mjs

      - name: Report high and moderate advisories (non-blocking)
        if: always()
        run: npm audit --audit-level=moderate || true

  design-guard:
    name: Design Token Guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ban raw --slate-*, transition-all, h-screen in app code
        run: |
          # DESIGN.md bans semantic-token violations. Accent-color literals are caught by
          # the Copy Register gate (tools/check-copy.mjs); this gate covers the rest.
          hits=$(git diff --name-only --diff-filter=ACMR -z origin/${{ github.base_ref }}...HEAD -- apps/web apps/mobile \
            | grep -zE '\.(ts|tsx|css)$' \
            | grep -zvE '(^|/)__tests__/|/globals\.css$|/theme\.ts$|\.(test|spec)\.tsx?$' \
            | xargs -0 --no-run-if-empty grep -nHE '\-\-slate-|transition-all|\bh-screen\b' || true)
          if [ -n "$hits" ]; then
            echo "::error::DESIGN.md ban: use semantic tokens (var(--fg-*)/var(--primary)), transform+opacity transitions, and min-h-dvh."
            echo "$hits"
            exit 1
          fi
          echo "Design token guard passed."

      - name: Ban decorative gradients in app code
        run: |
          if git diff --name-only --diff-filter=ACMRD origin/${{ github.base_ref }}...HEAD \
               | grep -Eq '^apps/(web|mobile)/.*\.(cjs|css|js|jsx|mjs|ts|tsx)$|^tools/check-gradients\.mjs$'; then
            node tools/check-gradients.mjs
          else
            echo "Gradient guard skipped: no owned path changed."
          fi

  surface-scope-report:
    name: Surface Scope Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Report declared token surface scopes
        env:
          SURFACE_SCOPE_MODE: reporting-only
        run: |
          echo "Surface scope mode: ${SURFACE_SCOPE_MODE}. Findings are reported and do not fail this job."
          echo "Tickets #486 and #506 flip this job to enforcing."
          set +e
          node tools/check-surface-scope.mjs
          checker_status=$?
          set -e
          if [ "$SURFACE_SCOPE_MODE" = "reporting-only" ] && [ "$checker_status" -eq 1 ]; then
            echo "Surface scope findings reported. This reporting-only job exits 0."
            exit 0
          fi
          exit "$checker_status"

  contract-drift:
    name: Contract Drift
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Regenerate Zod contract snapshot from orbit-api main
        run: npm run generate:zod -w @orbit/shared

      - name: Fail if the API contract drifted from the committed snapshot
        run: |
          if ! git diff --quiet -- packages/shared/src/types/__generated__/api.generated.ts; then
            echo "::error::API contract drift: orbit-api's OpenAPI spec changed since the committed Zod snapshot was last regenerated. Review the orbit-api change, hand-update packages/shared/src/types/* if the contract you consume changed, then run 'npm run generate:zod -w @orbit/shared' and commit the updated api.generated.ts to re-baseline. See packages/shared/CONTRACT_DRIFT.md."
            git diff -- packages/shared/src/types/__generated__/api.generated.ts
            exit 1
          fi
          echo "No contract drift: committed snapshot matches orbit-api main."

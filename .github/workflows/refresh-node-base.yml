name: Refresh Node base image

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: refresh-node-base
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SOURCE: docker.io/library/node
      DESTINATION: ghcr.io/thomasluizon/orbit-node-base
      TAG: 22-bookworm-slim
    steps:
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy official image by digest
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "${SOURCE}:${TAG}" --format '{{.Manifest.Digest}}')
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::The official image did not report an index digest' >&2
            exit 1
          fi
          docker buildx imagetools create --tag "${DESTINATION}:${TAG}" "${SOURCE}@${digest}"
          copied_digest=$(docker buildx imagetools inspect "${DESTINATION}:${TAG}" --format '{{.Manifest.Digest}}')
          if [ "$copied_digest" != "$digest" ]; then
            echo "::error::Copied index ${copied_digest} differs from official index ${digest}" >&2
            exit 1
          fi
          docker buildx imagetools inspect "${DESTINATION}:${TAG}"
          echo "Copied ${SOURCE}@${digest} to ${DESTINATION}:${TAG} with the same index digest" >> "$GITHUB_STEP_SUMMARY"

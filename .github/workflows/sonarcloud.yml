name: SonarCloud

on:
  # In SonarCloud Project Settings > Branches and Pull Requests, set the long-lived
  # sonar.branch.longLivedBranches.regex to (main|redesign/main|(branch|release)-.*)
  # before the first redesign/main analysis. A short-lived branch cannot be reclassified.
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        branch: [main, redesign/main]
    concurrency:
      group: sonar-branch-${{ matrix.branch }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # A scheduled run saves caches in the default branch scope, and this job checks out redesign/main.
          package-manager-cache: false

      - run: npm ci

      - name: Run Tests with Coverage
        run: npx turbo run test --concurrency=1 -- --coverage

      - name: Merge Coverage Reports
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          const reports = [
            { file: 'apps/web/coverage/lcov.info', prefix: 'apps/web' },
            { file: 'apps/mobile/coverage/lcov.info', prefix: 'apps/mobile' },
            { file: 'packages/shared/coverage/lcov.info', prefix: 'packages/shared' },
          ]

          const outputPath = path.join('coverage', 'lcov.info')
          fs.mkdirSync(path.dirname(outputPath), { recursive: true })

          const merged = []

          for (const report of reports) {
            if (!fs.existsSync(report.file)) continue

            const content = fs.readFileSync(report.file, 'utf8')
            const lines = content.split(/\r?\n/)

            for (const line of lines) {
              if (!line.startsWith('SF:')) {
                merged.push(line)
                continue
              }

              const sourceFile = line.slice(3).replace(/\\/g, '/')
              const normalized = sourceFile.startsWith(report.prefix)
                ? sourceFile
                : `${report.prefix}/${sourceFile}`

              merged.push(`SF:${normalized}`)
            }
          }

          fs.writeFileSync(outputPath, merged.join('\n'))
          NODE

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: -Dsonar.branch.name=${{ matrix.branch }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

name: Reuse the unit results of the merged pull request
description: Save the unit results that the pull request run of a merged commit stored at the same keys, and report which groups count as cached
inputs:
  web-key:
    description: Cache key of the web unit results
    required: true
  mobile-key:
    description: Cache key of the mobile unit results
    required: true
  workspace-key:
    description: Cache key of the workspace unit results
    required: true
  web-path:
    description: Path of the web unit results
    required: true
  mobile-path:
    description: Path of the mobile unit results
    required: true
  workspace-path:
    description: Paths of the workspace unit results
    required: true
  web-hit:
    description: The string true when the first lookup found the web key
    required: true
  mobile-hit:
    description: The string true when the first lookup found the mobile key
    required: true
  workspace-hit:
    description: The string true when the first lookup found the workspace key
    required: true
outputs:
  web-unit-hit:
    description: The string true when the saved web entry exists
    value: ${{ steps.web-unit-merged.outputs.cache-hit }}
  mobile-unit-hit:
    description: The string true when the saved mobile entry exists
    value: ${{ steps.mobile-unit-merged.outputs.cache-hit }}
  workspace-unit-hit:
    description: The string true when the saved workspace entry exists
    value: ${{ steps.workspace-unit-merged.outputs.cache-hit }}
runs:
  using: composite
  steps:
    # The pull request run stored its keys beside its coverage. A failed lookup prints a warning and main runs the tests.
    - name: Find the unit results of the merged pull request
      id: merged
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: node .github/scripts/merged-unit-results.mjs find --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

    # download-artifact v8 calls setFailed on a missing artifact or a transport error. The match step reads only a
    # complete download (outcome is the result before continue-on-error), so a failed one runs the tests on main.
    - name: Download the unit results of the merged pull request
      id: merged-download
      if: steps.merged.outputs.artifact-id != ''
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ steps.merged.outputs.artifact-id }}
        run-id: ${{ steps.merged.outputs.run-id }}
        github-token: ${{ github.token }}

    - name: Match the unit result keys of the merged pull request
      id: adopt
      if: steps.merged-download.outcome == 'success'
      shell: bash
      env:
        WEB_UNIT_KEY: ${{ inputs.web-key }}
        MOBILE_UNIT_KEY: ${{ inputs.mobile-key }}
        WORKSPACE_UNIT_KEY: ${{ inputs.workspace-key }}
      run: node .github/scripts/merged-unit-results.mjs match --keys-file unit-test-keys.json | tee -a "$GITHUB_OUTPUT"

    - name: Save the merged web unit results
      if: github.event_name != 'pull_request' && inputs.web-hit != 'true' && steps.adopt.outputs.web-unit == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.web-path }}
        key: ${{ inputs.web-key }}

    - name: Save the merged mobile unit results
      if: github.event_name != 'pull_request' && inputs.mobile-hit != 'true' && steps.adopt.outputs.mobile-unit == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.mobile-path }}
        key: ${{ inputs.mobile-key }}

    - name: Save the merged workspace unit results
      if: github.event_name != 'pull_request' && inputs.workspace-hit != 'true' && steps.adopt.outputs.workspace-unit == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.workspace-path }}
        key: ${{ inputs.workspace-key }}

    # cache/save only warns when its upload fails, so a group counts as cached only when a lookup finds the saved entry.
    - name: Look up the merged web unit results
      id: web-unit-merged
      if: inputs.web-hit != 'true' && steps.adopt.outputs.web-unit == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.web-path }}
        key: ${{ inputs.web-key }}
        lookup-only: true

    - name: Look up the merged mobile unit results
      id: mobile-unit-merged
      if: inputs.mobile-hit != 'true' && steps.adopt.outputs.mobile-unit == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.mobile-path }}
        key: ${{ inputs.mobile-key }}
        lookup-only: true

    - name: Look up the merged workspace unit results
      id: workspace-unit-merged
      if: inputs.workspace-hit != 'true' && steps.adopt.outputs.workspace-unit == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.workspace-path }}
        key: ${{ inputs.workspace-key }}
        lookup-only: true

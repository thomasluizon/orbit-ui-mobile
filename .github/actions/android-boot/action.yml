name: Boot the release AAB
description: Require the signed-out first screen from the shipping Android bundle before upload
inputs:
  aab:
    description: Path to the AAB that will be uploaded
    required: true
  package:
    description: Android application id
    required: true
runs:
  using: composite
  steps:
    - name: Derive an installable APK from the shipping AAB
      shell: bash
      env:
        AAB: ${{ inputs.aab }}
        GH_TOKEN: ${{ github.token }}
        BOOT_CHECK_PASSWORD: android-boot-check
      run: |
        set -euo pipefail
        evidence="$RUNNER_TEMP/android-boot"
        mkdir -p "$evidence"
        for attempt in 1 2 3 4; do
          gh release download 1.18.3 --repo google/bundletool --pattern bundletool-all-1.18.3.jar --output "$RUNNER_TEMP/bundletool.jar" --clobber && break
          [ "$attempt" -lt 4 ] || exit 1
          sleep $((attempt * 5))
        done
        echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
        unzip -Z1 "$AAB" | sed -n 's|^base/lib/\([^/]*\)/.*|\1|p' | sort -u > "$evidence/aab-abis.txt"
        grep -Fx arm64-v8a "$evidence/aab-abis.txt"
        grep -Fx x86_64 "$evidence/aab-abis.txt"
        keytool -genkeypair -keystore "$RUNNER_TEMP/boot-check.jks" -storepass:env BOOT_CHECK_PASSWORD -keypass:env BOOT_CHECK_PASSWORD -alias boot-check -keyalg RSA -validity 2 -dname CN=BootCheck
        printf '%s' "$BOOT_CHECK_PASSWORD" > "$RUNNER_TEMP/boot-check-password"
        java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle="$AAB" --output="$RUNNER_TEMP/boot.apks" --mode=universal --ks="$RUNNER_TEMP/boot-check.jks" --ks-key-alias=boot-check --ks-pass="file:$RUNNER_TEMP/boot-check-password" --key-pass="file:$RUNNER_TEMP/boot-check-password"
        unzip -p "$RUNNER_TEMP/boot.apks" universal.apk > "$RUNNER_TEMP/boot.apk"
        unzip -p "$AAB" base/assets/index.android.bundle > "$RUNNER_TEMP/aab-hermes.bundle"
        unzip -p "$RUNNER_TEMP/boot.apk" assets/index.android.bundle > "$RUNNER_TEMP/apk-hermes.bundle"
        test -s "$RUNNER_TEMP/aab-hermes.bundle"
        cmp "$RUNNER_TEMP/aab-hermes.bundle" "$RUNNER_TEMP/apk-hermes.bundle"
        sha256sum "$AAB" "$RUNNER_TEMP/aab-hermes.bundle" > "$evidence/artifact-sha256.txt"
    - name: Enable KVM access
      shell: bash
      run: |
        test -c /dev/kvm
        sudo chmod 666 /dev/kvm
    - name: Cold start the AAB-derived APK
      uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
      env:
        BOOT_PACKAGE: ${{ inputs.package }}
      with:
        api-level: 35
        target: google_apis
        arch: x86_64
        emulator-boot-timeout: 300
        disable-linux-hw-accel: false
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
        script: node tools/android-boot.mjs --apk "$RUNNER_TEMP/boot.apk" --package "$BOOT_PACKAGE" --output "$RUNNER_TEMP/android-boot"
    - name: Retain Android boot evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: android-boot-evidence
        path: ${{ runner.temp }}/android-boot
        if-no-files-found: error

name: Prepare installed desktop acceptance
description: Install dependencies and the native prerequisites; the producer tests run in Tool and Hook Tests and in Desktop Acceptance Producers
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
      with:
        node-version: 22
        cache: npm
    - shell: bash
      run: npm ci --prefer-offline --no-audit --fund=false
    - name: Install native prerequisites
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
        if [ "$RUNNER_OS" = macOS ]; then
          brew install ffmpeg
        else
          choco install ffmpeg --yes --no-progress
        fi

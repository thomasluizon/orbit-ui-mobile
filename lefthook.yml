min_version: "2.1.10"
pre-commit:
  commands:
    root-allowlist:
      run: node tools/check-root-allowlist.mjs
    lockup-crop:
      glob: "design/brand/orbit-lockup.svg"
      run: node tools/check-lockup-crop.mjs
    web-eslint:
      root: "apps/web/"
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    shared-eslint:
      root: "packages/shared/"
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    mobile-eslint:
      root: "apps/mobile/"
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      # No --fix here, unlike web and shared above. `expo lint` ignores the file
      # arguments and always walks the whole app, so --fix repaired all 718
      # suppressed local/spacing-scale violations across 65 files nobody staged,
      # which orphaned those same 718 suppressions and exited 2. The hook could
      # never pass while a fixable rule was suppressed. Without --fix it exits 0.
      run: npx expo lint -- {staged_files}
    dashes:
      run: node tools/check-dashes.mjs --files {staged_files}
    copy-register:
      glob: "packages/shared/src/i18n/*.json"
      run: node tools/check-copy.mjs --check
pre-push:
  commands:
    protect-main:
      use_stdin: true
      run: node tools/check-push-target.mjs
